  select_main_deity_iberian_decision.select_cariocecus:0 "#T Cariocecus#!/\n#P Gott des Krieges und des heiligen Kriegespfades#!/"
  select_main_deity_iberian_decision.select_ataegina:0 "#T Ataegina#!/\n#P Göttin der Fruchtbarkeit, Wiedergeburt und der Morgendämmerung#!/"
  select_main_deity_iberian_decision.select_lucubo:0 "#T Lucubo#!/\n#P Gott des Reichtums, Handels und Wohlstands#!/"
  select_main_deity_iberian_decision.select_arancio:0 "#T Arancio#!/\n#P Gott der Heilung und der fließenden Gewässer#!/"
