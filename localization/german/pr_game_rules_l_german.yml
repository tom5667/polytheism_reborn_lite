l_german:
  # =============================================
  # Polytheism Reborn - Spielregeln
  # Lokalisierung für pr_game_rules.txt
  # =============================================

  # --- Kategorie ---
  game_rule_category_polytheism_reborn:0 "Polytheism Reborn"

  # --- Augurium ---
  rule_pr_augury:0 "PR Augurium"
  setting_pr_augury_on:0 "Standard"
  setting_pr_augury_on_desc:0 "Du erhältst nach 3 Jahren ohne Augurium-Anfrage einen negativen Modifikator. Macht es historisch genauer, erfordert aber mehr Mikromanagement"
  setting_pr_augury_off:0 "Aus"
  setting_pr_augury_off_desc:0 "Du erhältst keinen negativen Modifikator nach 3 Jahren ohne Augurium-Anfrage. Alle Funktionen bleiben jedoch nutzbar"

  # --- Konvertierungsmenü zum Polytheismus ---
  rule_pr_conversion_to_polytheism_menu:0 "PR Polytheismus-Konvertierungsmenü"
  setting_pr_conversion_to_polytheism_menu_on:0 "Standard"
  setting_pr_conversion_to_polytheism_menu_on_desc:0 "Aktiviert das Konvertierungsmenü zum Polytheismus"
  setting_pr_conversion_to_polytheism_menu_off:0 "Aus"
  setting_pr_conversion_to_polytheism_menu_off_desc:0 "Deaktiviert das Konvertierungsmenü zum Polytheismus"

  # --- Polytheismus rekonstruieren (KI) ---
  rule_pr_reconstruct_polytheism_ai:0 "Polytheismus rekonstruieren (KI)"
  setting_pr_reconstruct_polytheism_ai_on:0 "Standard"
  setting_pr_reconstruct_polytheism_ai_on_desc:0 "Die KI-Entscheidung zum Rekonstruieren des Polytheismus wird verfügbar. Wenn der Eifer eines christlichen oder muslimischen Glaubens unter 40 fällt, kann die KI die Entscheidung treffen und eine geheime, auf der Kultur basierende polytheistische Religion annehmen."
  setting_pr_reconstruct_polytheism_ai_off:0 "Aus"
  setting_pr_reconstruct_polytheism_ai_off_desc:0 "Die KI-Entscheidung zum Rekonstruieren des Polytheismus ist deaktiviert"

  # --- Polytheismus-Vielfalt (KI) ---
  rule_pr_polytheis_variety_ai:0 "Polytheismus-Vielfalt (KI)"
  setting_pr_polytheis_variety_ai_on:0 "Standard"
  setting_pr_polytheis_variety_ai_on_desc:0 "Die KI wird manchmal zu einer polytheistischen Religion basierend auf der Kultur konvertieren."
  setting_pr_polytheis_variety_ai_off:0 "Aus"
  setting_pr_polytheis_variety_ai_off_desc:0 "Es wird keine Vielfalt an polytheistischen Religionen in deinem Reich geben"

  # --- Entscheidungen für antike Königreiche ---
  rule_pr_ancient_kingdoms_decisions:0 "Entscheidungen für antike Königreiche"
  setting_pr_ancient_kingdoms_decisions_on:0 "Standard"
  setting_pr_ancient_kingdoms_decisions_on_desc:0 "Entscheidungen zur Wiederherstellung antiker Königreiche sind verfügbar"
  setting_pr_ancient_kingdoms_decisions_player:0 "Nur Spieler"
  setting_pr_ancient_kingdoms_decisions_player_desc:0 "Entscheidungen sind nur für Spieler verfügbar"
  setting_pr_ancient_kingdoms_decisions_off:0 "Aus"
  setting_pr_ancient_kingdoms_decisions_off_desc:0 "Entscheidungen zur Wiederherstellung antiker Königreiche sind nicht verfügbar"

  # --- Semi-historische Ereignisse ---
  rule_pr_semi_historical_events:0 "Semi-historische Ereignisse"
  setting_pr_semi_historical_events_on:0 "Standard"
  setting_pr_semi_historical_events_on_desc:0 "Aktiviert Ereignisse wie das Finden des Vertrags von Kadesch"
  setting_pr_semi_historical_events_off:0 "Aus"
  setting_pr_semi_historical_events_off_desc:0 "Deaktiviert die weniger historisch genauen Ereignisse. Wichtig: Dies deaktiviert nicht die Zufallereignisse für Religionen"
