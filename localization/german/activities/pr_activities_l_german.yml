  # =============================================

  # --- Kogaionon-Pilgerfahrt (Dako-Thrakisch) ---
  pr_activity_kogaionon_pilgrimage:0 "Pilgerfahrt nach Kogaionon"
  pr_activity_kogaionon_pilgrimage_desc:0 "Reise zum heiligen Berg Kogaionon, dem heiligen Sitz des Zalmoxis, um mit dem Göttlichen zu kommunizieren."
  pr_local_kogaionon_pilgrimage_phase:0 "Die heilige Reise"
  pr_activity_kogaionon_pilgrimage_province_desc:0 "Ein Ziel, das einer Pilgerfahrt nach Kogaionon würdig ist."
  pr_activity_kogaionon_pilgrimage_host_desc:0 "Du wirst eine Pilgerfahrt nach Kogaionon anführen."
  pr_activity_kogaionon_pilgrimage_conclusion_desc:0 "Deine Pilgerfahrt nach Kogaionon ist abgeschlossen. Zalmoxis wacht über dich."

  # --- Uisneach-Pilgerfahrt (Keltisch) ---
  pr_activity_cnoc_uisnigh_pilgrimage:0 "Pilgerfahrt nach Uisneach"
  pr_activity_cnoc_uisnigh_pilgrimage_desc:0 "Reise zum heiligen Hügel von Uisneach, dem Nabel Irlands, wo die Götter die Welt der Sterblichen treffen."
  pr_local_cnoc_uisnigh_pilgrimage_phase:0 "Die heilige Reise"
  pr_activity_cnoc_uisnigh_pilgrimage_province_desc:0 "Ein Ziel, das einer Pilgerfahrt nach Uisneach würdig ist."
  pr_activity_cnoc_uisnigh_pilgrimage_host_desc:0 "Du wirst eine Pilgerfahrt nach Uisneach anführen."
  pr_activity_cnoc_uisnigh_pilgrimage_conclusion_desc:0 "Deine Pilgerfahrt nach Uisneach ist abgeschlossen. Die alten Götter gehen mit dir."

  # --- Delphi-Pilgerfahrt (Hellenisch) ---
  pr_activity_delphi_pilgrimage:0 "Pilgerfahrt nach Delphi"
  pr_activity_delphi_pilgrimage_desc:0 "Reise zum alten Orakel von Delphi, dem Nabel der Welt, um die Weisheit Apollos zu suchen."
  pr_local_delphi_pilgrimage_phase:0 "Die heilige Reise"
  pr_activity_delphi_pilgrimage_province_desc:0 "Ein Ziel, das einer Pilgerfahrt nach Delphi würdig ist."
  pr_activity_delphi_pilgrimage_host_desc:0 "Du wirst eine Pilgerfahrt nach Delphi anführen."
  pr_activity_delphi_pilgrimage_conclusion_desc:0 "Deine Pilgerfahrt nach Delphi ist abgeschlossen. Das Orakel hat gesprochen."

  # --- Irminsul-Pilgerfahrt (Germanisch) ---
  pr_activity_vogtei_pilgrimage:0 "Pilgerfahrt zur Irminsul"
  pr_activity_vogtei_pilgrimage_desc:0 "Reise zur großen Irminsul, der Weltsäule, die den Himmel trägt, um die alten germanischen Götter zu ehren."
  pr_local_vogtei_pilgrimage_phase:0 "Die heilige Reise"
  pr_activity_vogtei_pilgrimage_province_desc:0 "Ein Ziel, das einer Pilgerfahrt zur Irminsul würdig ist."
  pr_activity_vogtei_pilgrimage_host_desc:0 "Du wirst eine Pilgerfahrt zur Irminsul anführen."
  pr_activity_vogtei_pilgrimage_conclusion_desc:0 "Deine Pilgerfahrt zur Irminsul ist abgeschlossen. Die Götter haben deine Hingabe empfangen."

