  # =============================================
  # PR Aktivitäten - Festaktivitäten
  # =============================================

  # --- Saturnalia (Römisch) ---
  pr_activity_saturnalia:0 "Saturnalien"
  pr_activity_saturnalia_desc:0 "Ehre Saturn mit einem großen Fest des Schmausens, Glücksspiels und der Rollenumkehr — das fröhlichste der römischen Feiertage."
  pr_activity_saturnalia_phase_meal:0 "Das Saturnalienfest"
  pr_activity_saturnalia_phase_toast:0 "Trinksprüche auf Saturn"
  pr_activity_saturnalia_province_desc:0 "Eine Provinz, die würdig ist, eine Saturnalienfeier auszurichten."
  pr_activity_saturnalia_host_desc:0 "Du wirst ein Saturnalienfest zu Ehren Saturns ausrichten."
  pr_activity_saturnalia_conclusion_desc:0 "Die Saturnalien sind vorbei. Möge Saturn deine Herrschaft segnen."

  # --- Wintersonnenwende (Keltisch) ---
  pr_activity_winter_solstice:0 "Wintersonnenwendefest"
  pr_activity_winter_solstice_desc:0 "Versammle deine Sippe und Vasallen zu einem großen Fest, um die Wintersonnenwende, die längste Nacht des Jahres, zu feiern."
  pr_activity_winter_solstice_phase_meal:0 "Das Sonnenwendefest"
  pr_activity_winter_solstice_phase_toast:0 "Sonnenwendetrinksprüche"
  pr_activity_winter_solstice_province_desc:0 "Eine Provinz, die würdig ist, eine Wintersonnenwendefeier auszurichten."
  pr_activity_winter_solstice_host_desc:0 "Du wirst ein Wintersonnenwendefest ausrichten."
  pr_activity_winter_solstice_conclusion_desc:0 "Das Wintersonnenwendefest ist vorbei. Das Licht kehrt zurück."

  # --- Sommersonnenwende (Keltisch) ---
  pr_activity_summer_solstice:0 "Sommersonnenwendefest"
  pr_activity_summer_solstice_desc:0 "Feiere den Höhepunkt des Sommers mit einem großen Fest unter dem längsten Tag, zu Ehren der Sonne und der alten Götter."
  pr_activity_summer_solstice_phase_meal:0 "Das Mittsommerfest"
  pr_activity_summer_solstice_phase_toast:0 "Mittsommertrinksprüche"
  pr_activity_summer_solstice_province_desc:0 "Eine Provinz, die würdig ist, eine Sommersonnenwendefeier auszurichten."
  pr_activity_summer_solstice_host_desc:0 "Du wirst ein Sommersonnenwendefest ausrichten."
  pr_activity_summer_solstice_conclusion_desc:0 "Das Sommersonnenwendefest ist vorbei. Die Sonne scheint über dein Reich."

  # --- Wintersonnenwende (Germanisch) ---
  pr_activity_winter_solstice_germanic:0 "Julfest"
  pr_activity_winter_solstice_germanic_desc:0 "Versammle dich um das Herdfeuer für ein großes Julfest, schwöre Eide und ehre die Götter während der dunkelsten Nächte des Winters."
  pr_activity_winter_solstice_germanic_phase_meal:0 "Das Julfest"
  pr_activity_winter_solstice_germanic_phase_toast:0 "Jul-Eide"
  pr_activity_winter_solstice_germanic_province_desc:0 "Eine Provinz, die würdig ist, eine Julfeier auszurichten."
  pr_activity_winter_solstice_germanic_host_desc:0 "Du wirst ein Julfest ausrichten."
  pr_activity_winter_solstice_germanic_conclusion_desc:0 "Das Julfest ist vorbei. Die Götter haben deine Eide gehört."

  # --- Sommersonnenwende (Germanisch) ---
  pr_activity_summer_solstice_germanic:0 "Mittsommer-Blot"
  pr_activity_summer_solstice_germanic_desc:0 "Halte ein großes Sommer-Blot ab — ein Fest des Opfers und der Feier, um die Götter auf dem Höhepunkt der Wachstumszeit zu ehren."
  pr_activity_summer_solstice_germanic_phase_meal:0 "Das Blot-Fest"
  pr_activity_summer_solstice_germanic_phase_toast:0 "Trinksprüche auf die Götter"
  pr_activity_summer_solstice_germanic_province_desc:0 "Eine Provinz, die würdig ist, ein Sommer-Blot auszurichten."
  pr_activity_summer_solstice_germanic_host_desc:0 "Du wirst ein Sommer-Blot-Fest ausrichten."
  pr_activity_summer_solstice_germanic_conclusion_desc:0 "Das Sommer-Blot ist vorbei. Die Götter sind zufrieden."

