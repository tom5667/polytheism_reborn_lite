  pr_pilgrimage_type_religious_desc:0 "Unternehme diese Pilgerfahrt als Akt der Hingabe an die Götter."
  pr_pilgrimage_type_recreation:0 "Erholungsreise"
  pr_pilgrimage_type_recreation_desc:0 "Reise aus Neugier und weltlicher Erfahrung statt aus reiner Hingabe."

