l_english:
  # =============================================
  # Polytheism Reborn - Game Rules
  # Localization for pr_game_rules.txt
  # =============================================

  # --- Category ---
  game_rule_category_polytheism_reborn:0 "Polytheism Reborn"

  # --- Augury ---
  rule_pr_augury:0 "PR Augury"
  setting_pr_augury_on:0 "Default"
  setting_pr_augury_on_desc:0 "You get a negative no augury requested after 3 years without requesting the augury. Makes it more historically accurate but also gives more micromanagement"
  setting_pr_augury_off:0 "Off"
  setting_pr_augury_off_desc:0 "You get no negative no augury requested modifier after 3 years without requesting the augury. But can still use all functions"

  # --- Conversion to Polytheism Menu ---
  rule_pr_conversion_to_polytheism_menu:0 "PR Polytheism Conversion Menu"
  setting_pr_conversion_to_polytheism_menu_on:0 "Default"
  setting_pr_conversion_to_polytheism_menu_on_desc:0 "This will turn On the Conversion to Polytheism interaction menu"
  setting_pr_conversion_to_polytheism_menu_off:0 "Off"
  setting_pr_conversion_to_polytheism_menu_off_desc:0 "This will turn Off the Conversion to Polytheism interaction menu"

  # --- Reconstruct Polytheism (AI) ---
  rule_pr_reconstruct_polytheism_ai:0 "Reconstruct Polytheism AI"
  setting_pr_reconstruct_polytheism_ai_on:0 "Default"
  setting_pr_reconstruct_polytheism_ai_on_desc:0 "The reconstruct polytheism AI decision will become available for ai. If the fervor of a Christian or Muslim faith goes under 40 there is a chance the ai takes the decision and gets a secret faith based on the culture."
  setting_pr_reconstruct_polytheism_ai_off:0 "Off"
  setting_pr_reconstruct_polytheism_ai_off_desc:0 "The reconstruct polytheism AI decision is disabled"

  # --- Polytheism Variety (AI) ---
  rule_pr_polytheis_variety_ai:0 "Polytheism Variety AI"
  setting_pr_polytheis_variety_ai_on:0 "Default"
  setting_pr_polytheis_variety_ai_on_desc:0 "AI will sometimes convert to a polytheistic religion based on culture."
  setting_pr_polytheis_variety_ai_off:0 "Off"
  setting_pr_polytheis_variety_ai_off_desc:0 "You will have no variety in polytheistic religions within your realm"

  # --- Ancient Kingdom Decisions ---
  rule_pr_ancient_kingdoms_decisions:0 "Ancient Kingdom Decisions"
  setting_pr_ancient_kingdoms_decisions_on:0 "Default"
  setting_pr_ancient_kingdoms_decisions_on_desc:0 "Decisions to restore ancient kingdoms are available"
  setting_pr_ancient_kingdoms_decisions_player:0 "Player only"
  setting_pr_ancient_kingdoms_decisions_player_desc:0 "Decisions will only be available for players"
  setting_pr_ancient_kingdoms_decisions_off:0 "Off"
  setting_pr_ancient_kingdoms_decisions_off_desc:0 "Decisions to restore ancient kingdoms are not available"

  # --- Semi Historical Events ---
  rule_pr_semi_historical_events:0 "Semi Historical Events"
  setting_pr_semi_historical_events_on:0 "Default"
  setting_pr_semi_historical_events_on_desc:0 "Makes events like finding the treaty of Kadesh available"
  setting_pr_semi_historical_events_off:0 "Off"
  setting_pr_semi_historical_events_off_desc:0 "Disables the less historically accurate events. Important$:$ This doesn't disable random events for religions"
