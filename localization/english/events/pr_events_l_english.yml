  pr.0030.t:0 "The libraries"
  pr.0030.desc:0 "#F I have gained knowledge of the ancient ways of far different peoples. I should consider sending out someone to find more information on the gods of old.#!"
  pr.0030.alexandria:0 "Library of Alexandria"
  pr.0030.athens:0 "Library of Athens"
  pr.0030.vatican:0 "Vatican library"
  pr.0030.minor_library:0 "Minor library"

  pr.0031.t:0 "Return of the historian"
  pr.0031.desc:0 "#F The historian returns with grand news! Let us hear what they present from the scriptures.#!"
  pr.0031.a:0 "Learn about the religion"

  pr.0032.t:0 "Return of the historian"
  pr.0032.desc:0 "#F The historian returns with nothing of help. Perhaps I should invite a book merchant who can aid my search?#!"
  pr.0032.a:0 "Invite a book merchant"
  pr.0032.b:0 "Leave it as it is"

  pr.0034.t:0 "The book merchant"
  pr.0034.desc:0 "#F After five days the book merchant arrived with a wagon full of books. He said he has only one book of the ancient religions, created by historians before Christianity was a religion.#!"
  pr.0034.a:0 "Buy the book"
  pr.0034.b:0 "Don't buy the book"

  pr.0033.t:0 "Found information"
  pr.0033.desc:0 "#F It is not easy to reconstruct the ways of the past when all that could be related to it has been hidden or squirreled away. Perhaps with the knowledge of the few lowborn and the historian, I might be able to do so — or should I stop here?#!"
  pr.0033.a:0 "Continue learning"
  pr.0033.b:0 "This is all I want to know"

  pr.0035.t:0 "Court chaplain interference"
  pr.0035.desc:0 "#F [realm_priest.GetCouncilTitle] [realm_priest.GetName] believes that every time I attempt something that drives me away from the Church, they learn of it and suggest I repent for my sins. Should I repent, or should I try to convince them that the Old Ways were better?#!"
  pr.0035.a:0 "Try to convince the [realm_priest.GetCouncilTitle]"
  pr.0035.b:0 "Repent"

  pr.0036.t:0 "Won the debate"
  pr.0036.desc:0 "#F After a long and tiresome debate, [realm_priest.GetCouncilTitle] [realm_priest.GetName] finally gave in and sees that the old gods aren't as evil as they say.#!"
  pr.0036.a:0 "It won't be simple my friend"

  pr.0037.t:0 "Moderate debate"
  pr.0037.desc:0 "#F After a long and tiresome debate, [realm_priest.GetCouncilTitle] [realm_priest.GetName] stayed with his point that his god is superior. Well, does he speak the truth? He says there is still time to repent.#!"
  pr.0037.a:0 "Imprison this fool"
  pr.0037.b:0 "Repent"

  pr.0038.t:0 "Lost debate"
  pr.0038.desc:0 "#F [realm_priest.GetCouncilTitle] [realm_priest.GetName] is right, and I was blind not to see the glory promised by God.#!"
  pr.0038.a:0 "Repent"

  pr.0039.t:0 "At the dungeon"
  pr.0039.desc:0 "#F You deny your own ancestors by not coming back to the gods, and for that I have no choice but to imprison you.#!"
  pr.0039.a:0 "Can I call all of this a success ?"

  pr.0040.t:0 "A good book"
  pr.0040.desc:0 "#F A great book! No one knows that I know of the ancient truths of the past, and I can learn more as I read through the book itself!#!"
  pr.0040.a:0 "Continue reading"
  pr.0040.b:0 "This is all I want to know"

  pr.0041.t:0 "A bad book"
  pr.0041.desc:0 "#F As I start reading the book, I come across a page with the following text: 'You have been fooled, the book has nothing to it!' All for naught...#!"
  pr.0041.a:0 "Better luck next time I hope"

  pr.0042.t:0 "After studying"
  pr.0042.desc:0 "#F Amazing, everything seems to be so well preserved! Especially the rituals!#!"
  pr.0042.a:0 "Convert to the true faith"

  pr.0043.t:0 "Repenting"
  pr.0043.desc:0 "#F The priest was right after all. After repenting, I have returned to the loving embrace of God.#!"
  pr.0043.a:0 "Glory to God!"

  #Invite relatives
  pr.0400.t:0 "The Sassanid Relatives"
  pr.0400.desc:0 "#F They are finally here. First we gave them food and drinks to help them recover from their long journey.#!\n\nAfter some time we came to business: can we help them back on the throne? Yes, our families share the same bloodline, but we still need soldiers to fight with us and remove those Abbasids from Persia, as the Chinese troops don't want to help. We are on our own. It's up to us — do we help them, or do we send them back?"
  pr.0400.stay:0 "Invite them to stay"
  pr.0400.abdicate_samani:0 "Give them your titles"
  pr.0400.abdicate_afrighid:0 "Give them your titles"
  pr.0400.send_away:0 "Send them back"

  #Sassanid Reconquest
  pr.0500.t:0 "Start of the reconquest"
  pr.0500.desc:0 "#F The time has come to reclaim the Persian Empire under the Sassanids, starting with the province of Merv. This marks the beginning of our reconquest, as we strive to restore the glory of our ancestors and drive out the invaders.#!"
  pr.0500.a:0 "Praise Ahura Mazda"

  pr.0300.t:0 "Close the temple of Vesta"
  pr.0300.desc:0 "Closed once by Christians now soldiers of the [ROOT.Char.GetFaith.GetAdjective] religion close it once more and hopefully for good now."
  pr.0300.a:0 "Close the heathen temple"

  #Gaelic
  pr.0001.t:0 "New Beginning"
  pr.0001.desc:0 "By allowing experienced traders, farmers, and artisans from our neighbours, [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] will soon become a thriving center of commerce.\n\nHopefully, these new Gaelic settlers will also help us to understand our past better."
  pr.0001.a:0 "You are all welcome!"
  #Text not changed, not important for single player
  pr.0002.t:0 "The New Settlers"
  pr.0002.desc.vassals:0 "[scoped_ruler.GetTitledFirstName] has decided to welcome foreign settlers from the neighboring [scoped_ruler.GetFaith.GetReligion.GetAdjectiveNoTooltip] realms.\n\n[scoped_ruler.GetSheHe|U] hopes that these new arrivals will help populate our land faster and increase commerce with our allies."
  pr.0002.desc.others:1 "[scoped_ruler.GetTitledFirstName] has decided to welcome foreign settlers from the [scoped_ruler.GetFaith.GetReligion.GetAdjectiveNoTooltip] realms neighboring [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\n[scoped_ruler.GetSheHe|U] hopes that these new arrivals will help populate [scoped_ruler.GetHerHis] land faster and increase commerce with [scoped_ruler.GetHerHis] allies."
  pr.0002.a:0 "Well, I don't trust them!"
  pr.0002.b:0 "I see..."

