  #Greek-Roman
  pr.0020.t:0 ""
  pr.0020.desc:0 "#F The ancient Greek and Roman religions, long ago the dominant religions in the Mediterranean. The Roman religion — or better said Cultus deorum, the cultivation of the gods — was once the state religion of the mighty Roman Empire. Or perhaps the religion created by Emperor Julian the Philosopher, a combination of Greek and Roman religion. Maybe even the ancient Greek religion of the mighty Spartans and Athenians.#!"
  pr.0020.roman:0 "Roman Polytheism"
  pr.0020.greek:0 "Greek Polytheism"
  pr.0020.pr_mycenaean:0 "Mycenaean Polytheism"
  pr.0020.pr_graeco_egyptian:0 "Graeco Egyptian Polytheism"
  pr.0020.back:0 "Back"

  #Etruscan
  pr.0021.t:0 ""
