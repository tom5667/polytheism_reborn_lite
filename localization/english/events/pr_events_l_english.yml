  #Dismantle patriarchate
  pr.0044.t:0 "The Dissolution of the Patriarchate"
  pr.0044.desc.muslim:1 "The Christians' dominion over Constantinople has finally come to an end. \n\nThanks to the committed efforts of many devoted servants of [scoped_destroyer.GetFaith.HighGodName], all of Greece has fallen under [scoped_destroyer.GetFaith.GetAdjective] rule. The faithful have worked tirelessly to strip away all blasphemous icons and bring the decadent clergy that ruled over these lands to justice."
  pr.0044.desc.hellenic:1 "The tyranny of the Galileans over Europe has finally come to an end.\n\nFor centuries these glorified cultists have been given free rein to vilify and deface the ancient monuments of our divine protectors, but no more! By restoring [scoped_destroyer.GetFaith.GetAdjective] rule over Constantinople and the Greek lands, we have squashed the very heart of the Church of the carpenter god."
  pr.0044.desc.fallback:0 "After centuries being belittled and deceived by their missionaries, the followers of [scoped_destroyer.GetFaith.HighGodName] have finally taken their revenge upon the followers of the Christ god. \n\nThe heartland of their faith has been conquered with the favor of our gods, their churches have been pillaged, their priests stripped of all power and dignity. Thanks to my glorious invasion, I have rid the world of this cowardly religion and avenged the dishonor brought upon our lands and ancestors by their trickery."
  pr.0044.desc.patriarch.submission:0 "\n\nIn the face of our undeniable religious supremacy, ex-patriarch [scoped_patriarch.GetFullName] has even publicly recanted the [orthodox.GetAdjectiveNoTooltip] faith and converted to [scoped_destroyer.GetFaith.GetNameNoTooltip]!"
  pr.0044.desc.patriarch.crucifixion:0 "\n\n[scoped_patriarch.GetFirstName], still defiantly clinging to the undeserved title of Patriarch, was crucified among the burning ruins of the Hagia Sophia. So ends the disgraceful line of Christian Patriarchs of Constantinople."
  pr.0044.desc.patriarch.sacrificed:0 "\n\nThe Hagia Sophia was sanctified and rededicated to [scoped_destroyer.GetFaith.HighGodName] using the blood of [scoped_patriarch.GetTitledFirstName] [scoped_patriarch.GetHerselfHimself], who was sacrificed on the very altar [scoped_patriarch.GetSheHe] used to preach from."
  pr.0044.desc.no_patriarch:0 "\n\nDisorganized [orthodox.BishopNeuterPlural] have individually been attempting to rally the demoralized [orthodox.GetAdherentNamePluralNoTooltip], but without a true [orthodox.ReligiousHeadName] to lead them it is clear that the days of Papal authority are over."
  pr.0044.a.a:0 "[scoped_destroyer.GetFaith.HighGodName] has blessed us!"
  pr.0044.a.b:0 "This is the time of our resurgence!"
  pr.0044.a.c:0 "Their dead god could not protect them after all."
  pr.0045.desc.faithful:0 "Thanks to [scoped_destroyer.GetTitledFirstNamePossessive] relentless campaign of conquest, the entire Greek lands has fallen to [scoped_destroyer.GetFaith.GetAdjective] rule.\n\nWith [scoped_destroyer.GetFaith.HighGodNamePossessive] help, [scoped_destroyer.GetSheHe] has hunted down all remaining cabals of Orthodox still congregating in Italy and stripped all major Bishoprics of wealth and influence, thus striking a severe blow to the authority of the false Church."
  pr.0045.desc.christians:0 "The monstrous campaign of terror of [scoped_destroyer.GetTitledFirstName] has brought ruin and darkness upon the heartland of Our Holy Mother Church!\n\nThe vile heathen has stripped the Patriarch of all its possessions and dignity, brutally murdered countless theologians and will not stop until [scoped_destroyer.GetSheHe] has brought all Christianity to heel. With the Patriarchate destroyed and its hierarchy in shambles, the Orthodox faith has been reduced to a disorganized cult."
  pr.0045.desc.fallback:0 "The daring campaign of conquest of [scoped_destroyer.GetTitledFirstName] has brought ruin and darkness upon the heartland of the Orthodox Church!\n\nHaving already stripped the Patriarch of most of its possessions and dignity, it seems [scoped_destroyer.GetSheHe] will only be satisfied when all Christianity is brought to heel. With the Patriarchate destroyed and its hierarchy in shambles, the Orthodox faith has been reduced to a disorganized cult."
  pr.0045.a.a:0 "It was about time somebody did it."
  pr.0045.a.b:0 "The end is nigh!"
  pr.0045.a.c:0 "I see..."


  #Credits cybrxkhan
  RICEmisc.0010.t:0 "Conversion"
  RICEmisc.0010.desc.host:0 "Because I have converted to [host.GetFaith.GetName], the [activity_type.GetNameNoTooltip()] I originally planned is of little use to me anymore, as the event itself or the manner it would have been done in does not adhere to the new teachings I follow. I have therefore canceled this event."
  RICEmisc.0010.desc.not_host:0 "Because [host.GetTitledFirstName] have converted to [host.GetFaith.GetName], the [activity_type.GetNameNoTooltip()] [host.GetSheHe] originally planned has been canceled, as the event itself or the manner it would have been done in does not adhere to the new teachings [host.GetSheHe] follows.\n\nThis is awkward to say the least."
  RICEmisc.0010.a:0 "And so it is."

