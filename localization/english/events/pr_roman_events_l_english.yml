  pr_roman.0112.t:0 "The Offering"

  pr_roman.0112.vegetables.desc:0 "Today I'm going to honor Mercurius god of trade.\nAfter the preparations are done I'm ready to start the ritual.\nAs the ritual progresses it's time to offer to Mercurius, I state clearly what I offer and to which god(dess) and after that I put some vegetables on the plate and sprinkle it with some water.\n\nAs last part I observe the room for any signs and offer to Vesta and Janus and as safety offer one last time to Mercurius to apologize for any inconvenience during the ritual.\nNow the ritual is done I hope Mercurius did hear my prayer and accepts my offer, I eat the vegetables after the offering in a nice salad."

  pr_roman.0112.milk.desc:0 "Today I'm going to honor Mercurius god of trade.\nAfter the preparations are done I'm ready to start the ritual.\nAs the ritual progresses it's time to offer to Mercurius, I state clearly what I offer and to which god(dess) and after that I offer a libation of milk in a glass.\n\nAs last part I observe the room for any signs and offer to Vesta and Janus and as safety offer one last time to Mercurius to apologize for any inconvenience during the ritual.\nNow the ritual is done I hope Mercurius did hear my prayer and accepts my offer, I drink the milk afterwards."

  pr_roman.0112.incense.desc:0 "Today I'm going to honor Mercurius god of trade.\nAfter the preparations are done I'm ready to start the ritual.\nAs the ritual progresses it's time to offer to Mercurius, I state clearly what I offer and to which god(dess) and after that I offer incense.\n\nAs last part I observe the room for any signs and offer to Vesta and Janus and as safety offer one last time to Mercurius to apologize for any inconvenience during the ritual.\nNow the ritual is done I hope Mercurius did hear my prayer and accepts my offer. at the end I stop the incense from burning."

  pr_roman.0112.fallback.desc:0 "Today I'm going to honor Mercurius god of trade.\nAfter the preparations are done I'm ready to start the ritual.\nAs the ritual progresses it's time to offer to Mercurius, I state clearly what I offer and to which god(dess) and after that I put the flowering plants on the plate and sprinkle it with some water.\n\nAs last part I observe the room for any signs and offer to Vesta and Janus and as safety offer one last time to Mercurius to apologize for any inconvenience during the ritual.\nNow the ritual is done I hope Mercurius did hear my prayer and accepts my offer, I give the flowering plants back to nature."

