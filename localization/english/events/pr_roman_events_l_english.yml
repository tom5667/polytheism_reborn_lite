  #Cultus Deorum ritual 
  pr_roman.0100.t:0 "Preparations"
  pr_roman.0100.desc:0 "First of al i need to collect everything i need, let's start with the toga to cover my head. after that I can collect a bowl with water. Wine, milk and some other things offer like fruit and last but not least two glasses and a plate.\n\nsecond option is for players who don't want the walkthrough."
  pr_roman.0100.a:0 "Let's do this step by step"
  pr_roman.0100.incense:0 "Offer the frankincense"
  pr_roman.0100.wine:0 "Offer the wine"
  pr_roman.0100.fruit:0 "Offer the fruit"

