  pr_roman.0101.t:0 "Purificatio (Purification)"
  pr_roman.0101.desc:0 "I cover head with the toga, and wash my hands and face (this is a sign of respect and piety to the gods) with saying a simple prayer."
  pr_roman.0101.a:0 "Proceed"

  pr_roman.0102.t:0 "Praefatio (Start communication)"
  pr_roman.0102.desc:0 "Now i'm purified i can start the ritual, first I need to light a candle and greet mother Vesta with a prayer. next go through with saying a prayer to janus the two faced god an give him a welcome offer of incense. last offer to Vesta thanking her for the flame for the ritual."
  pr_roman.0102.a:0 "Proceed"

  pr_roman.0103.t:0 "Salutatio (Greeting and asking the gods to attend in the ritual)"
  pr_roman.0103.desc:0 "$cdr_polytheism_high_god_name_alternate$ god of the sky and protector of the people of Rome or whatever name you prefer, may you attend to this ritual. And may you accept this offer of fruit (after speaking the words put it on the bowl. and sprinkel some water on it."
  pr_roman.0103.a:0 "Proceed"

  pr_roman.0104.t:0 "Precatio (Prayer)"
  pr_roman.0104.desc:0 "For the Precatio I will offer my main offer to $cdr_polytheism_high_god_name$ (but first the main reason formally stated). $cdr_polytheism_high_god_name$ Optimus Maximus may you favour my family and the people of my realm. Now pour a libation of wine in the cup and i say the words $cdr_polytheism_high_god_name$ May you  favour my family and people of my realm with power and victory to overcome our enemies."
  pr_roman.0104.a:0 "Proceed"

  pr_roman.0105.t:0 "Immolatio (Sacrifice)"
  pr_roman.0105.desc:0 "$cdr_polytheism_high_god_name_alternate$ god of thunder and protector of the people of Rome, accept this libation of wine and may you favour my family and the people of my realm. Now pour a libation of wine in the cup and i say the words "$cdr_polytheism_high_god_name$ May you  favour my family and people of my realm with power and victory to overcome our enemies.""
  pr_roman.0105.a:0 "Proceed"

  pr_roman.0106.t:0 "Litatio (Observance)"
  pr_roman.0106.desc:0 "Observe the room for signs"
  pr_roman.0106.a:0 "Proceed"

  pr_roman.0107.t:0 "Piaculum (Atonement)"
  pr_roman.0107.desc:0 "Now for if there are made any errors int the ritual, I will offer incense to Ianus, Vesta and as safety offer one last time to Iupiter to apologize for any inconveniance during the ritual."

  pr_roman.0107.incense:0 "Offer the frankincense"
  pr_roman.0107.wine:0 "Offer the wine"
  pr_roman.0107.fruit:0 "Offer the fruit"

  pr_roman.0107.message.positive:0 "Offer Successful"
  pr_roman.0107.message.negative:0 "Offer Unsuccessful"


  #Embrace roman culture
  pr_roman_culture.0600.t:0 "Embrace Roman Culture"
  pr_roman_culture.0600.desc:0 "#F The virtues that once made Rome the mistress of the world — gravitas, pietas, virtus — have faded from our lands.#!\n\nIt is time to look back to the ancient customs, to the language of Cicero and the discipline of the legions, and once more call ourselves Romans in truth, not merely in memory."
  pr_roman_culture.0600.a:0 "Embrace the Roman culture"
  #Embrace Gallo Roman Culture
  pr_roman_culture.0601.t:0 "Embrace Gallo-Roman Culture"
  pr_roman_culture.0601.desc:0 "#F The provinces of Gaul once thrived under a blend of Roman law and Gallic spirit, producing a culture both refined and fierce.#!\n\nThat heritage has been neglected for too long. Let us revive the traditions of our Gallo-Roman ancestors, honouring both the gods of Rome and the spirits of the land."
  pr_roman_culture.0601.a:0 "Embrace the Gallo-Roman culture"
  #Embrace Romano British Culture
  pr_roman_culture.0602.t:0 "Embrace Romano-British Culture"
  pr_roman_culture.0602.desc:0 "#F Beyond the ocean, in the misty isle of Britannia, our ancestors built cities and temples that rivalled those of Rome herself, blending Roman ways with the old British pride.#!\n\nWe have wandered far from that legacy. It is time to reclaim the Romano-British identity and the virtues that came with it."
  pr_roman_culture.0602.a:0 "Embrace the Romano-British culture"
  #Embrace Romano Germanic Culture
  pr_roman_culture.0603.t:0 "Embrace Romano-Germanic Culture"
  pr_roman_culture.0603.desc:0 "#F Along the Rhine and the Danube, Roman and Germanic peoples met, traded, and intermarried, forging a culture of strength and adaptability — neither wholly Roman nor wholly Germanic, but something greater.#!\n\nWe have let those bonds slip. Let us renew the Romano-Germanic ways and stand once more as guardians of the frontier."
  pr_roman_culture.0603.a:0 "Embrace the Romano-Germanic culture"
  #Embrace Hispano Roman Culture
  pr_roman_culture.0604.t:0 "Embrace Hispano-Roman Culture"
  pr_roman_culture.0604.desc:0 "#F Hispania was once a jewel of the Roman world, its cities adorned with temples and baths, its people producing emperors and poets. The Hispano-Roman heritage is one of eloquence, faith, and fiery pride.#!\n\nWe have strayed from those ancient roots. Let us embrace the Hispano-Roman culture and restore the glory our ancestors knew."
  pr_roman_culture.0604.a:0 "Embrace the Hispano-Roman culture"

  #Restore cultus deorum Priesthood
  pr_roman.0200.t:0 "The New [scoped_ruler.GetFaith.GetAdjective] Priesthood"
  pr_roman.0200.desc:0 "After the interlude of exile and persecution following the Christian conquests, Cultus deorum has been accepted by the people of Europe as the one true path to righteousness. [scoped_ruler.GetTitledFirstName] has ordered the institution of the office of the [new_priest.GetTitleTierName], a Priest of Priests to rule over a restored clerical hierarchy.\n\nThe [new_priest.GetTitleTierName] will serve as the highest religious authority in the [scoped_ruler.GetFaith.GetAdjective] world, with powers ranging from the blessing of future military expeditions to the granting of divorces to married couples."
  pr_roman.0200.a:0 "The eternal flame of Mother Vesta burns once more!"
  pr_roman.0201.desc.orthodox:0 "The accursed followers of [scoped_ruler.GetFaith.HighGodName] have reclaimed enough land and influence to re-establish a blasphemous priesthood under the protection of [scoped_ruler.GetTitledFirstName].\n\nIf not soon stopped, these demon-worshiping pagans might turn the tide of Christian expansion in Europe, polluting the mind of their unaware subjects with lies and perversions."
  pr_roman.0201.desc.others:0 "The strange, Cultus Deorum followers of [scoped_ruler.GetFaith.HighGodName] have reclaimed enough of their ancestral Roman territories to re-establish a functional Priesthood.\n\nIf not stopped soon, they might turn the tide of Christian expansion and restore Europe under the protection of their old gods."
  pr_roman.0201.a:0 "Glory to [scoped_ruler.GetFaith.HighGodName]!"
  pr_roman.0201.b:0 "Their demons will not shield them from the might of [ROOT.Char.GetFaith.HighGodName]!"
  pr_roman.0201.c:0 "... Pantheon worshiping?"

  #Hellenismos

  #event modifier 


  pr_roman.0400.desc:0 "Your suggestion for me to uproot my entire life and scurry off to the temple of Vesta is ludicrous. I am happy where I am, and I have no plans to change that."

  pr_roman.0500.desc:0 "I will answer the call to serve a higher power, and I thank you for setting me on this path of righteousness."
  pr_roman.0500.a:0 "I am sure you will serve Mother Vesta well!"


  pr_roman.0300.t:0 "Temple of Vesta opened"
  pr_roman.0300.desc:0 "After centuries of closure the temple of vesta is open again, the flame is burning and the new vestal virgins are doing everything they can to keep the flame burning."
  pr_roman.0300.a:0 "Finally the eternal flame burns again"

  pr_roman.0600.t:0 "Saturnalia"
  pr_roman.0600.desc:0 "The 17th of December has finally arrived, marking the closure of businesses and the completion of the year's harvest. Today, we honor Saturn and express our gratitude to the gods for the bountiful harvest. Following the sacred rituals, we exchange gifts with one another and immerse ourselves in joyous festivities."
  pr_roman.0600.a:0 "Gather the realm for Saturnalia"

  pr_roman_cult.0001.t:0 "Cults"
  pr_roman_cult.0001.desc:0 "In Roman times there where many cults and with the reestablishment of the [ROOT.Char.GetFaith.GetAdjective] Those cults also flourished again.\nThe question is do I want to be part of one the cults ?"
  pr_roman_cult.0001.mithras:0 "Mithras Cult"
  pr_roman_cult.0001.isis:0 "Isis Cult"
  pr_roman_cult.0001.serapis:0 "Serapis Cult"
  pr_roman_cult.0001.eluesinian:0 "Eluesinian Cult"
  pr_roman_cult.0001.sol_invictus:0 "Sol Invictus cult"
  pr_roman_cult.0001.imperial:0 "Imperial cult"
  pr_roman_cult.0001.cybele:0 "Cybele cult"
  pr_roman_cult.0001.optout:0 "Maybe now isn't the right time"

  #Join Mithras cult 
  pr_roman_cult.0002.t:0 "The Application"
  pr_roman_cult.0002.desc:0 "#F After learning how to contact the cult, I composed a letter explaining why I would be a worthy addition to their ranks.#!\n\nI left the letter in a hidden place by the old well, as instructed. Now I must wait a few days for a response."
  pr_roman_cult.0002.a:0 "Let us wait and hope"

  pr_roman_cult.0003.t:0 "The Answer"
  pr_roman_cult.0003.desc:0 "#F Some days later, I returned to the place where I left my letter.#!\n\nBetween the stones sat a small parchment bearing a few lines and a location — the place where I am to meet them for the initiation."
  pr_roman_cult.0003.a:0 "Go to the meeting place"

  pr_roman_cult.0004.t:0 "The Hidden Location"
  pr_roman_cult.0004.desc:0 "#F 'Welcome, welcome. So you are the one who sent the application,' the voice echoes in the dim chamber.#!\n\n'Mithras, god of war, is beloved by soldiers, and many of them count themselves among our brothers. You too have made a name for yourself, so we are pleased to say — we may begin the initiation.'"
  pr_roman_cult.0004.a.tt:0 "Historical context: the real initiation has not been preserved, so this is partly conjecture and fiction. What is known is that it was an initiation processs of seven grades, whose names have survived. The events build upon that framework."
  pr_roman_cult.0004.a:0 "Start the initiation"

  pr_roman_cult.0005.t:0 "The Initiation"
  pr_roman_cult.0005.desc:0 "#F We stand before the statue of Mithras. After the first degree of initiation, I am handed a knife.#!\n\n'Now, make a cut in your hand,' the Pater instructs. 'Let a few drops of blood fall upon the plate, and speak these words: I swear I will always follow the ways of Mithras, and will never betray my brothers and sisters.'\n\nA few moments later, it is done. I am now part of the cult, beginning my journey as a Corax."
  pr_roman_cult.0005.trait:0 "Finally I'm part of the Mithras cult"
  pr_roman_cult.0005.religion:0 "Finally I'm part of the Mithras cult"

  #Standard decline answer 
  pr_roman_cult.0006.t:0 "The Answer"
  pr_roman_cult.0006.desc:0 "Some days later I returned to the place where I left the letter, between the stones sat a small letter with a text.\nWe have to decline the application you're not yet worthy of joining our cult."
  pr_roman_cult.0006.a:0 "It's a shame"

  #Isis cult
  pr_roman_cult.0007.t:0 "The Dream"
  pr_roman_cult.0007.desc:0 "I had the strangest dream last night. It felt so real, like a message. Whispers of a powerful goddess, Isis, reached me on the wind. The dream urged me to travel to Tithorea in Greece, to find her temple. It feels like more than just a dream; it feels like a calling."
  pr_roman_cult.0007.a:0 "Follow the Whispers"

  pr_roman_cult.0008.t:0 "Arriving At Tithorea"
  pr_roman_cult.0008.desc:0 "The journey to Tithorea was long, but the dream's pull was undeniable.\n\nFinally, I stand before the Temple of Isis. It's weathered and ancient, holding secrets I can almost feel in the air. A sense of anticipation, and maybe a little fear, grips me as I approach the entrance."
  pr_roman_cult.0008.a:0 "Enter the temple"

  pr_roman_cult.0009.t:0 "Temple Of Isis"
  pr_roman_cult.0009.desc:0 "Inside, the air is thick with incense and the murmur of unseen worshippers. A priestess, her eyes deep and knowing, greets me. She seems to have been expecting me. 'The Mother has called you,' she says, her voice a silken whisper. 'Are you ready to embrace her mysteries?' A shiver runs down my spine. This is far beyond a simple pilgrimage; this is a true test."
  cult_009.a.tt:0 "Historical context, the real initiation has not been preserved, there are sources that say a initiation wasn't necessary.So it's a bit guessing and pure fiction."
  pr_roman_cult.0009.a:0 "start the initiation"

  pr_roman_cult.0010.t:0 "The Initiation"
  pr_roman_cult.0010.desc:0 "Let's start the initiation, First we start with ritual purifications, in the meantime the priest asks for forgiveness for my sins and sprinkles water on me./nAfter that I had to wait 10 days and abstaining from meat and wine, in the evening of the tenth day I got unspecified gifts from fellow devotees of Isis before donning a clean linen robe and entering the deepest part of the temple. After some rituals and swearing the following words\nI swear I will always follow the ways of Isis and will never betray my brothers and sisters.\nThe next day I left the temple and traveled back home."
  pr_roman_cult.0010.trait:0 "Finally I'm part of the Isis cult"
  pr_roman_cult.0010.religion:0 "Finally I'm part of the Isis cult"

  #Serapis Cult
  pr_roman_cult.0011.t:0 "Preparations"
  pr_roman_cult.0011.desc:0 "For weeks, my sleep has been plagued by the same vision. A majestic, bearded figure, a grain-measure resting on his head like a crown, sits enthroned. At his feet lies the monstrous three-headed hound, Cerberus. He does not speak, but his gaze is heavy with unspoken meaning, a mix of promise and warning. He shows me fleeting images... fields of golden wheat, a ship laden with grain, and a peaceful journey into a sunlit afterlife. The dream leaves me feeling both hopeful and deeply unsettled. I must understand its meaning."
  pr_roman_cult.0011.a:0 "I will seek an interpreter of dreams."

  pr_roman_cult.0012.t:0 "The Seeker's Path"
  pr_roman_cult.0012.desc:0 "The dream interpreter, a wise old mystic, listened intently. 'This is no mere dream,' she whispered, her eyes wide. 'It is a summons from the Great Serapis. He is a guide for souls and a bringer of plenty. He calls you to his temple, not one of grand stone, but a hidden place of quiet devotion. The path is not on any map; you must let the memory of your dream guide you.' Following this cryptic advice, I set out, my heart a mix of trepidation and purpose."
  pr_roman_cult.0012.a:0 "My journey begins."

  pr_roman_cult.0013.t:0 "The Serapeum"
  pr_roman_cult.0013.desc:0 "After what felt like an eternity, I found it. Tucked away in a secluded valley, a modest temple stood, its entrance flanked by statues matching the figures from my dream. A priest, his face serene, greeted me as if I were an old friend. 'The dream has led you true,' he said. 'Serapis has chosen you. He offers a life of abundance and a tranquil afterlife, but initiation demands a test of faith. You must spend a night in the incubation chamber, to dream once more and receive his final blessing. Are you prepared?'"
  pr_roman_cult.0013.a.tt:0 "Historical context, the real initiation has not been preserved so it's a bit guessing and pure fiction."
  pr_roman_cult.0013.a:0 "I will face the dream."

  pr_roman_cult.0014.t:0 "The Initiation"
  pr_roman_cult.0014.desc:0 "I was led to a small, dark chamber and left alone. As I drifted to sleep, the dream returned, clearer than ever. Serapis smiled, and the hound at his feet seemed to nod in approval. I awoke to the priest standing over me. 'You have been accepted,' he declared. I was then led to the inner sanctum, where I was anointed with oils and shared a meal of bread and wine with the other devotees. I swore an oath of secrecy and brotherhood. The priest placed a hand on my shoulder. 'Welcome, child of Serapis. May your life be as bountiful as the Nile.'"
  pr_roman_cult.0014.trait:0 "I am reborn in the eyes of Serapis!"



  #Eluesinian mysteries 
  pr_roman_cult.0015.t:0 "A Glimmer of Hope"
  pr_roman_cult.0015.desc:0 "Lately, my thoughts have been consumed by the grim finality of death. The tales of the shadowy, joyless underworld offer no comfort. In my search for solace, I have heard whispers of the Eleusinian Mysteries, a sacred cult dedicated to Demeter and Persephone. They say that for initiates, the afterlife is not a place of gloom, but one of blissful reunion. The path to this understanding begins with a pilgrimage to the holy site of Eleusis. I must know more."
  pr_roman_cult.0015.a:0 "I will make the journey to Eleusis."

  pr_roman_cult.0016.t:0 "The Sacred Way"
  pr_roman_cult.0016.desc:0 "I arrive in Eleusis to find a processsion underway. A priestess, a Hierophant, notices my searching gaze. 'You seek to understand the cycle of life and death, do you not? You seek the hope that Demeter grants to her children. The path of the initiate is one of purification and revelation. You must first be cleansed and taught the Lesser Mysteries, preparing your soul for the great truth that awaits. Are you ready to take the first step?'"
  pr_roman_cult.0016.a:0 "I am. Guide me."

  pr_roman_cult.0017.t:0 "The Kykeon"
  pr_roman_cult.0017.desc:0 "After days of fasting and ritual cleansing, the Hierophant leads me to the entrance of the Telesterion, the great initiation hall. 'You have been purified,' she intones. 'Now, you must drink the 'italic kykeon'!, the sacred brew that parts the veil between our world and the divine. It will open your mind to what must be seen. Do not be afraid. Demeter's light will guide you through the darkness.' She offers me a simple earthenware cup containing a grainy, mint-scented mixture."
  cult_017.a.tt:0 "Historical context, the real initiation has not been preserved so it's a bit guessing and pure fiction."
  pr_roman_cult.0017.a:0 "I drink without hesitation."

  pr_roman_cult.0018.t:0 "The Vision"
  pr_roman_cult.0018.desc:0 "The world dissolves into a whirlwind of light and shadow. I witness the sorrow of a mother's loss, the descent into the darkness of the underworld, and the glorious, vibrant rebirth of spring. I see Persephone, crowned with asphodel, and Demeter, her face radiant with joy. The vision is overwhelming, a profound truth that words cannot capture. When I return to my senses, the Hierophant is smiling. 'You have seen. You are one of us now. Carry this hope in your heart, for you no longer need to fear the final journey.'"
  pr_roman_cult.0018.trait:0 "I have seen the truth of the Mysteries."

  #Sol invictus cult
  pr_roman_cult.0019.t:0 "The Weight of a Crown"
  pr_roman_cult.0019.desc:0 "My realm is a tapestry of dissent and chaos. Vassals scheme in the shadows, and the loyalty of my subjects feels as fleeting as a summer breeze. In search of a solution, I have buried myself in the histories of the great emperors. I have just finished reading an account of Aurelian, 'Restorer of the World.' He faced an empire on the brink of collapse and, through sheer will, brought it back to glory. The chronicler notes that a key to his success was the establishment of the cult of Sol Invictus, the Unconquered Sun, as a divine anchor for the state. An idea takes root in my mind... perhaps this is the unifying light my own realm needs."
  pr_roman_cult.0019.a:0 "I must find the inheritors of this Unconquered Sun."

  pr_roman_cult.0020.t:0 "The Fading Embers"
  pr_roman_cult.0020.desc:0 "My search for the followers of Sol Invictus has been arduous. The cult, once the heart of an empire, has faded into obscurity. After many dead ends, my agents finally located a small, secluded community that still honors the Unconquered Sun. They are led by a man who calls himself the Hierophant, a former soldier who claims his lineage traces back to the priests of Aurelian. He has agreed to meet me, but his message was clear... 'Only those who truly understand the burden of rule are worthy of Sol's light.'"
  pr_roman_cult.0020.a:0 "I will meet this Hierophant."

  pr_roman_cult.0021.t:0 "The Radiance of Power"
  pr_roman_cult.0021.desc:0 "The Hierophant is a man forged from steel and sunlight, his eyes burning with an intense fire. 'You seek order in chaos, strength in division,' he states, not as a question, but as a fact. 'Sol Invictus is not a god of petty favors. He is the divine principle of order, the eternal victor, the soul of the Empire. To follow him is to embody his radiance, to become an unconquerable pillar for your people. The initiation is simple, yet profound... you must swear an oath, not just of loyalty, but of purpose. To uphold order, to be a light against the darkness, and to recognize the divine fire within yourself as a reflection of the Sun.' He extends a hand, upon which rests a simple bronze medallion depicting a radiant sun."
  cult_021.a.tt:0 "Historical context, Couldn't find any info about an initiation so this event is fictional, if someone has some more info let me know on steam or discord."
  pr_roman_cult.0021.trait:0 "I swear the oath. I will be Unconquered!"


  #Imperial cult 
  pr_roman_cult.0022.t:0 "The Foundation of Power"
  pr_roman_cult.0022.desc:0 "My authority feels fragile, my legacy uncertain. My vassals whisper in the shadows, and the common folk are fickle. I have been studying the annals of the Roman Empire, seeking the source of its enduring strength. It was not just legions and laws, but something deeper... the Imperial Cult. By elevating the Emperor to a divine status, they forged a bond of absolute loyalty that held the vast empire together. Perhaps this is the key to securing my own dynasty's future."
  pr_roman_cult.0022.a:0 "I must understand this divine mandate."

  pr_roman_cult.0023.t:0 "The Augustales"
  pr_roman_cult.0023.desc:0 "My inquiries lead me to a secluded college of priests, the Sodales Augustales. They have preserved the sacred rites of the Imperial Cult through the centuries. Their leader, a man of immense dignity, greets me. 'You seek to walk the path of the Divi, the deified emperors,' he says, his voice resonating with ancient authority. 'This is not a path of personal salvation, but of civic duty. It is to bind your soul to the fate of your realm, to become the living embodiment of its stability and glory. Are you prepared to bear such a weight?'"
  pr_roman_cult.0023.a:0 "I am."

  pr_roman_cult.0024.t:0 "The Divine Genius"
  pr_roman_cult.0024.desc:0 "The priest leads me to a grand temple, its walls adorned with the images of deified emperors of old. 'To join the Imperial Cult is to acknowledge the divine spark within you, your 'italic Genius'!,' he proclaims. 'It is the spirit that guides your hand and protects your people. You must make an offering not to a distant god, but to the divine potential of your own rule and the memory of those who came before.' He gestures to a grand altar. 'Swear an oath to uphold the prosperity of your realm, and you will be one of us. Your rule will be sacred, your legacy, eternal.'"
  cult_024.a.tt:0 "Historical context, Couldn't find any info about an initiation so this event is fictional, if someone has some more info let me know on steam or discord."
  pr_roman_cult.0024.trait:0 "My rule is divine. My legacy is secure."
  pr_roman_cult.0024.religion:0 "My rule is divine. My legacy is secure."

  #Cybele Cult
  pr_roman_cult.0050.t:0 "A Primal Calling"
  pr_roman_cult.0050.desc:0 "My lands feel barren, my dynasty fragile. I feel a deep disquiet, a sense that the civilized gods have grown deaf to my prayers. Lately, when walking in the wild places of my domain, I hear it — a faint, rhythmic drumming on the wind, a sound that seems to rise from the very earth. It is a primal, powerful call that speaks of untamed nature, of life, death, and ferocious rebirth. Whispers among the peasantry speak of the Magna Mater, the Great Mother, whose power is as ancient and untamed as the mountains themselves."
  pr_roman_cult.0050.a:0 "I must find the source of this sound."

  pr_roman_cult.0051.t:0 "The Ecstatic Procession"
  pr_roman_cult.0051.desc:0 "Drawn by the incessant drumming, I find a processsion snaking through a dark forest. It is a wild, frenzied affair. Cymbals clash, flutes shriek, and devotees, their eyes wide with ecstasy, dance and whirl. At their head is a figure of imposing authority, an Archigallus, who carries a statue of a goddess crowned with towers. He sees me and approaches. 'You feel the call of the Great Mother, Cybele,' he says, his voice surprisingly calm amidst the chaos. 'She is the earth, the mountain, the lion. She offers boundless life, but demands total surrender. Her path is not for the faint of heart.'"
  pr_roman_cult.0051.a:0 "I wish to understand this power."
  pr_roman_cult.0051.b:0 "This is madness. I must leave."

  pr_roman_cult.0052.t:0 "The Taurobolium"
  pr_roman_cult.0052.desc:0 "The Archigallus leads me to a sacred pit. 'To be reborn in the eyes of the Magna Mater, you must be washed in the lifeblood of her sacred beast,' he explains. I am instructed to stand in the pit as a great bull is led onto a perforated platform above me. With a final prayer, the priests sacrifice the animal. Warm, crimson blood pours down, drenching me in a torrent of life and death. I emerge, gasping, feeling the raw power of the earth coursing through my veins."
  pr_roman_cult.0052.a:0 "Bathe me in blood! I am reborn!"

  pr_roman.0700.t:0 "The Senate"
  pr_roman.0700.desc:0 "#F I take a deep breath as I stand before the Senate doors.#!\n\nWithin, a senate more divided than ever — Christians and polytheists, those who tolerate each other and those who do not. And here I am, proposing the return of the Altar of Victory to the Senate house."
  pr_roman.0700.a:0 "Enter the Senate"

  pr_roman.0701.t:0 "The Senate"
  pr_roman.0701.desc:0 "#F As expected, the Christians were not fond of the idea of bringing back the altar.#!\n\nIt is a shame they oppose the restoration of something placed there by Emperor Augustus himself, so that we might offer to the gods for the welfare of the empire. It was even used to swear oaths to the new emperors.\n\nAs the Christians in the senate grow angry, it is time to call the vote."
  pr_roman.0701.a:0 "Start the voting"

  pr_roman.0702.t:0 "The Voting"
  pr_roman.0702.desc:0 "#F The vote is counted, and the majority of the Senate favours the return of the altar.#!\n\nBut the decision has created new tensions. Some of the Christian senators are so enraged that they charge toward me with daggers drawn. I was not aware those were permitted in the Senate house..."
  pr_roman.0702.a:0 "Guards!"

  pr_roman.0703.t:0 "The Voting"
  pr_roman.0703.desc:0 "#F The vote is counted, and the majority of the Senate favours the return of the altar.#!\n\nBut the decision has created new tensions. Some of the Christian senators are so enraged that they charge toward me with daggers drawn. I was not aware those were permitted in the Senate house..."
  pr_roman.0703.a:0 "Guards!"


  pr_roman.0704.t:0 "Go to the Senate"
  pr_roman.0704.desc:0 "#F I take a deep breath as I stand before the Senate doors.#!\n\nWithin, a senate more divided than ever — Christians and polytheists, those who tolerate each other and those who do not. And here I am, proposing the return of the Altar of Victory to the Senate house."
  pr_roman.0704.a:0 "Enter the Senate"

  pr_roman.0705.t:0 "The Senate"
  pr_roman.0705.desc:0 "#F As expected, the Christians were not fond of the idea of bringing back the altar.#!\n\nIt is a shame they oppose the restoration of something placed there by Emperor Augustus himself, so that we might offer to the gods for the welfare of the empire. It was even used to swear oaths to the new emperors.\n\nAs the Christians in the senate grow angry, it is time to call the vote."
  pr_roman.0705.a:0 "Start the voting"

  pr_roman.0706.t:0 "The Voting"
  pr_roman.0706.desc:0 "#F The vote is counted, and the majority of the Senate favours the return of the altar.#!\n\nBut the decision has created new tensions. Some of the Christian senators are so enraged that they charge toward me with daggers drawn. I was not aware those were permitted in the Senate house..."
  pr_roman.0706.a:0 "Guards!"

  pr_roman.0707.t:0 "The Attack"
  pr_roman.0707.desc:0 "#F By $cdr_polytheism_high_god_name$, can we all calm down!#!\n\nNow that the guards have secured the Senate and the Christians have been subdued, let us return to the matter at hand. The vote has spoken — the Altar of Victory will be returned to the Senate house, effective immediately."
  pr_roman.0707.a:0 "Bring back the altar"

  pr_roman_culture.0002.t:0 "Adopting the Illyrian Gods"
  pr_roman_culture.0002.desc:0 "#F The gods of Illyrium have slumbered too long in their forgotten groves and hilltop shrines.#!\n\nAfter months of research, my scholars have mapped the sacred springs where Armatus was once invoked and the peaks where Jupiter Parthinus was worshipped. The omens are favourable — it is time to rebuild the shrines and write new rituals."
  pr_roman_culture.0002.a:0 "Let's begin"


  pr_roman_culture.0003.t:0 "Illyrian Gods Adopted"
  pr_roman_culture.0003.desc:0 "#F Shrines rise once more upon the ancient hills, and the people gather to learn the rites their ancestors knew.#!\n\nThe rituals are written, the priests are trained, and the word is spreading. The old gods of Illyrium walk among us again."
  pr_roman_culture.0003.a:0 "Spread the word"

  pr_roman_culture.0100.t:0 "Adopting the Gaulish Gods"
  pr_roman_culture.0100.desc:0 "#F The spirits of the Gaulish forests and the gods of the old Belgae have not been heard in generations.#!\n\nMy advisors have spent months searching for the sacred groves where Mars Lenus and Minerva Belisama were once honoured. The signs are good — let us rebuild what time has worn away."
  pr_roman_culture.0100.a:0 "Let's begin"


  pr_roman_culture.0101.t:0 "Gaulish Gods Adopted"
  pr_roman_culture.0101.desc:0 "#F The old Gaulish gods walk the forests and hills once more.#!\n\nNew shrines have been raised where the ancient ones once stood, and the people are learning the rituals anew. The bonds between gods and people are restored."
  pr_roman_culture.0101.a:0 "Spread the word"

  pr_roman.0113.t:0 "Adopting the British Gods"
  pr_roman.0113.desc:0 "#F In Britannia, the Romans and the Britons worshipped side by side — Sulis Minerva at her sacred spring, Mars Cocidius in the dark hills.#!\n\nThose traditions have faded, but the sacred places remain. After months of research, my scholars have found the old sites. It is time to restore them and write new rituals for our people."
  pr_roman.0113.a:0 "Let's begin"

  pr_roman.0114.t:0 "British Gods Adopted"
  pr_roman.0114.desc:0 "#F The gods of Britannia have returned to their ancient shrines.#!\n\nThe springs flow clear again, the hilltop altars are rebuilt, and the people gather to honour the old names. The rituals are written — now the word must spread."
  pr_roman.0114.a:0 "Spread the word"

  pr_roman_culture.0300.t:0 "Adopting the Germanic Gods"
  pr_roman_culture.0300.desc:0 "#F On the frontier of the old empire, Roman and Germanic peoples blended their gods — Mars Thincsus and Hercules Magusanus walked side by side.#!\n\nMy scholars have searched the old frontier forts and temples, and the omens are clear. Let us rebuild the shrines and restore the rituals of our Romano-Germanic ancestors."
  pr_roman_culture.0300.a:0 "Let's begin"

  pr_roman_culture.0500.t:0 "Adopting the West Semitic Gods"
  pr_roman_culture.0500.desc:0 "#F The gods of the Orient — Jupiter Dolichenus, Juno Caelestis, Eshmun — once drew worshippers from across the empire to their temples.#!\n\nMy scholars have traced the old trade routes and the forgotten sanctuaries. The omens are favourable — it is time to rebuild the shrines and write new rituals honouring these ancient powers."
  pr_roman_culture.0500.a:0 "Let's begin"

  pr_roman_culture.0400.t:0 "Adopting the Iberian Gods"
  pr_roman_culture.0400.desc:0 "#F Hispania's old gods — Mars Neto, Lucubo, Nabia — were worshipped in caves and on hilltops long before the Romans came, and long after they left.#!\n\nAfter months of searching, my scholars have found the ancient sites and recorded the old invocations. It is time to rebuild the shrines and restore the rituals our Hispano-Roman ancestors knew."
  pr_roman_culture.0400.a:0 "Let's begin"

  #Event text  random event Temple Sacrilege
  pr_roman.0002.t:0 "Temple Sacrilege"
  pr_roman.0002.desc:0 "Some fool has been caught defacing the temple of Jupiter. Such matter shouldn't be taken lightly. What should we do with him ? Next to that do I want to restore the temple?"
  pr_roman.0002.a:0 "Send him to our prison and repair the temple"
  pr_roman.0002.b:0 "The priest may decide his faith, only repair the temple"
  pr_roman.0002.c:0 "Let him go"

  #Lemuria
  pr_roman.0003.t:0 "Lemuria"
  pr_roman.0003.desc:0 "Today we hold the Lemuria to expel the restless death and the fearful ghosts from our house, Together with my family we go through the house\n they with pots behind me while I speak the words, with these beans I redeem me and mine, nine times, after that I put beans in my mouth and spit them out over my shoulder.\n Now that is done my family are clashing the pots, while I speak the words, Ghosts of my fathers and ancestors, be gone! The ritual is done so it's time to wash my hands three times and watch for a good or bad signs."
  pr_roman.0003.a:0 "watch for a good or bad signs"
  pr_roman.0003.message.positive:0 "The ghosts and restless deaths are appeased"
  pr_roman.0003.message.negative:0 "Bad omen sighted"

  #Offering to Dīs Pater
  pr_roman.0004.t:0 "Offering to Dīs Pater"
  pr_roman.0004.desc:0 "Today I walked along the graves of my ancestors, sometimes it's hard to believe they arren't around anymore. After I got back home I decided to make a offering to Dīs Pater to honor my ancestors and be a bit closer to them. Important is disposing the food I offer and not eat it myself afterwards."
  pr_roman.0004.a:0 "Make offering"

  #Visiting temple of Jupiter
  pr_roman.0005.t:0 "Visiting Temple of Jupiter"
  pr_roman.0005.desc:0 "To rule my realm I need some guidance from Jupiter King of the gods only he can he give the support my to rule my realm in a good way."
  pr_roman.0005.a:0 "Sacrifice a White Ox"
  pr_roman.0005.message.positive:0 "Blessed by Jupiter"
  pr_roman.0005.message.negative:0 "Unfavoured by Jupiter"

  #Ludi Plebii
  pr_roman.0006.t:0 "Ludi Plebii"
  pr_roman.0006.desc:0 "Today is the day for all citizens in the Realm races and all sort of other festivities to celebrate the liberties and democracy."
  pr_roman.0006.a:0 "Join the festivities"

  #Offer food of your meal to the lares 
  pr_roman.0007.t:0 "Offering to the Lares"
  pr_roman.0007.desc:0 "Nothing better then a good meal, but today I want to share a part with the Lares the house gods to thank them for protecting my family."
  pr_roman.0007.a:0 "Make offering to the Lares"

  #Offering to Ceres
  pr_roman.0008.t:0 "Offering to Ceres"
  pr_roman.0008.desc:0 "it's almost harvest time, to get some extra help we make a offering today to Ceres for a good harvest this season."
  pr_roman.0008.a:0 "Make offering to Ceres"
  pr_roman.0008.message.positive:0 "Blessed by Ceres"
  pr_roman.0008.message.negative:0 "Bad harvest"

  #Lupercalia
  #This festival had it's flawes and for game sake and respect to and for woman all things in favor hitting or Demonization will be left out of the events 
  #even though this was historically true 
  #\n\nThe festival has changed over the centuries for the better, in the early republic it was a custom for the luperci to dance naked. But with the first Roman Emperor Augustus it got reformed to luperci running around in goatskin.
  pr_roman.0009.t:0 "Lupercalia"
  pr_roman.0009.desc:0 "Today I can visit the center of the city where the yearly Lupercalia (between 13 and 15th of February) is being held. The festival in honor of $cdr_polytheism_good_god_juno$ Februata and is meant to Purify the city and promoting health and fertility.\n\nIt was also the festival where the famous Julius Ceasar refused the golden crown offered by Marcus Antonius."
  pr_roman.0009.a:0 "Go to the Center of the city"
  pr_roman.0009.b:0 "Maybe next year"

  pr_roman.0010.t:0 "City center"
  pr_roman.0010.desc:0 "Of course the Center of the city is crowded with people in a relationship or not, some just come watch the ceremonies and festivities. I on the other hand going to participate in the festival and that means I'm going to spent a whole day with the woman on the small piece of parchment I'm going to recieve.\n\nBut before that the Lupercari Priests are going to hold sacrifices this included a male goat and a dog. Next to that there is also a offering of salted mealcakes provided by the vestal virgins, two Luperci approached the altar. Their foreheads were anointed with blood from the sacrificial knife, then wiped clean with wool soaked in milk, after which they were expected to laugh.\n\n In a few centuries this al may sound a bit strange but as with everything also rituals will change with time.\n\n The luperci aproached us with a box where we received the small piece of parchment which contains the name of the woman I'm going to spend the day with."
  pr_roman.0010.a:0 "I hope this date works out"

  pr_roman.0011.t:0 "The Lupercalia date"
  pr_roman.0011.desc:0 "The day is at a end, what a day but the question is was it enough for both of us to build on ?"
  pr_roman.0011.a:0 "Maybe I really found the one"
  pr_roman.0011.b:0 "No it was just a nice date" 

  lover_lupercalia_date:0 "Lupercalia date"
  #Buy book about Roman mythology 
  pr_roman.0012.t:0 "The Bookseller"
  pr_roman.0012.desc:0 "As I walked through the market today I found a stand with some books, there was one particular book that catches my eye that was the one about Roman Mythology. It costs a few coins but it's worth it."
  pr_roman.0012.a:0 "Buy the book"

  #Read book about Roman mythology 
  pr_roman.0013.t:0 "Story of Aenaes"
  pr_roman.0013.desc:0 "You would say the Roman and Greek mythology is same but yet it isn't. I read About Aneas the son of $cdr_polytheism_fertility_god_name$ and how he fled to Rome as commanded by the gods with a group known as the Aenaeds, Carried with them the statues of the Lares and Penates the household gods of troy, As the group spread arrived in Italy they started to spread the statues.\n\nNext to that Aenaes was supposed to be married with Queen Dido of Carthago but after intervention of $cdr_polytheism_wealth_god_name$ on behalve of $cdr_polytheism_high_god_name$ that didn't happen. Queen Dido Cursed Rome to be always a enemy of Carthage what would end up in the first, second and third pr_punic war and even elephants in the alps."
  pr_roman.0013.a:0 "Funny to think that there once where elephants in the Alps"

  # Recruit augur event
  pr_roman.0014.t:0 "Court Augur"
  pr_roman.0014.fallback_reason.desc:0 "We never know if the gods approve neither a  [ROOT.Char.GetTitleTierName]. I should hire a court augur so I can find out if the gods approve my actions.\n\nI have asked around for recommendations, and they have assembled a few options to chose from."
  pr_roman.0014.decision.desc:0 "We never know if the gods approve neither a  [ROOT.Char.GetTitleTierName]. I should hire a court augur so I can find out if the gods approve my actions.\n\nI have asked around for recommendations, and they have assembled a few options to chose from."
  pr_roman.0014.a:0 "Apparently, [high_skill_option.GetFirstNameNoTooltip] is quite experienced."
  pr_roman.0014.a.tt:1 "A [GetCourtPositionType('pr_court_augur_court_position').GetName()] also has a monthly salary of [gold_i][SCOPE.ScriptValue('court_position_physician_salary')]"
  pr_roman.0014.b:0 "[low_skill_option.GetFirstNameNoTooltip] seems enthusiastic, if nothing else."
  pr_roman.0014.c:0 "[mystic_option.GetFirstNameNoTooltip] claims to be trained in "alternative medicine.""
  pr_roman.0014.d.two:0 "Both of them fail to impress me."
  pr_roman.0014.d.more:0 "They all fail to impress me."
  pr_roman.0014.e:0 "[excellent_skill_option.GetFirstNameNoTooltip] is widely known in scholarly circles."
  pr_roman.0014.d.tt:1 "I do not recruit anyone as my [GetCourtPositionType('pr_court_augur_court_position').GetName()]"

  pr_roman.0015.fallback.t:0 "This is a bug"
  pr_roman.0015.fallback.desc:0 "Please report the bug on steam or discord when you see this message. Thanks in advance!"
  pr_roman.0015.sacred_hens.t:0 "The sacred hens title"
  pr_roman.0015.sacred_hens.desc:0 "I asked my [GetCourtPositionType('pr_court_augur_court_position').GetName()] for the Tripudiis auspice of the sacred hens. of course he can't guarantee a good outcome but If I have the approval of the gods, the rule of my realm would be a lot easier.\n\nIf the hens come out the cage and eat in a pattern it's a good sign if they don't I have big problem."

  pr_roman.0015.eagle.t:0 "The Eagle Auspice"
  pr_roman.0015.eagle.desc:0 "I asked my [GetCourtPositionType('pr_court_augur_court_position').GetName()] for the Avibus auspice of the eagle. of course he can't guarantee a good outcome but If I have the approval of the gods, the rule of my realm would be a lot easier.\n\nIf the eagle flies high it's a good sign if it doesn't I have big problem."

  pr_roman.0015.crows.t:0 "The crows title"
  pr_roman.0015.crows.desc:0 "I asked my [GetCourtPositionType('pr_court_augur_court_position').GetName()] for the Oscines auspice of the crows. of course he can't guarantee a good outcome but If I have the approval of the gods, the rule of my realm would be a lot easier.\n\nIf the Crows sing it's a good sign if they don't I have big problem."
  pr_roman.0015.a:0 "Let's proceed"
  pr_roman.0015.b:0 "Wait I have a proposition"

  pr_roman.0016.t:0 "Good Auspice"
  pr_roman.0016.sacred_hens.desc:0 "The cage opened, what will the hens do will they stay in the cage or come out and eat?\nNot long after did a small prayer to [ROOT.Char.GetFaith.HighGodName] The hens came out of the cage and started eating. The augur watched and after a few minutes he said. "The gods have spoken they approve this war to be fought [ROOT.Char.GetFaith.WarGodName] Invicta!"\n\nNow we can go to battle the enemy in knowledge that the gods approve our actions."
  pr_roman.0016.eagle.desc:0 "The [GetCourtPositionType('pr_court_augur_court_position').GetName()] opened the cage of the eagle and he immediately took of to the sky en circled high above us all. The augur waited a few minutes and said "As the eagle flies high above us, $cdr_polytheism_high_god_name$ Optimus Maximus certainly approves the actions of [scoped_ruler.GetTitledFirstName]."\n\nNow the gods have approved the stability in my realm is once more assured!"
  pr_roman.0016.crows.desc:0 "The [GetCourtPositionType('pr_court_augur_court_position').GetName()] Stands next to the cage of the crows, he let's them out they immediatly fly to a tree nearby. A few minutes later the crows start to make sound, the augur listened and not much later hey said "Their sound is like a song played by $cdr_polytheism_good_god_apollo$ the gods approve the the financial state of the realm"\n\nNow the gods have approved the trade in my realm is once more assured!
  pr_roman.0016.a:0 "The gods approve!"

  pr_roman.0017.t:0 "Augur Accepts Bribe"
  pr_roman.0017.sacred_hens.desc:0 "The augur told me that he will use hens that haven't eaten in a while so a good outcome is assured."
  pr_roman.0017.eagle.desc:0 "The augur told me that he has a eagle that flies high on order so that a good outcome is assured."
  pr_roman.0017.crows.desc:0 "The augur told me that he that crows will make song like sounds so that a good outcome is assured."
  pr_roman.0017.a:0 "Great!"

  pr_roman.0018.t:0 "Augur Didn't Accept"
  pr_roman.0018.desc:0 "The [GetCourtPositionType('pr_court_augur_court_position').GetName()] was not amused to say the least. He asked if I want the wrath of the gods over the realm\n\nWhile unfortunate, the gods have spoken and had not grant me their blessings to rule the realm. Best I can do is prove them mistaken."
  pr_roman.0018.a:0 "I think I leave now"

  #Special event cancel auspice 
  pr_roman.0020.t:0 "The Eagle Owl"
  pr_roman.0020.desc:0 "It where just a few minutes after the start of the auspice when the sound of the eagle owl came close and immediately the augur stoped the auspice and said, "I can't continue this is a eagle owl interfering in a auspice and that is a bad omen.""
  pr_roman.0020.a:0 "Well this doesn't sound good at all."

  #Bad auspice 
  pr_roman.0021.t:0 "Bad Auspice"
  pr_roman.0021.fallback.desc:0 "Please report the bug on steam or discord when you see this message. Thanks in advance!"
  pr_roman.0021.eagle.desc:0 "The augur led the eagle out of the cage but it was safe to say the eagle didn't go very high in my opinion. A moment later the [GetCourtPositionType('pr_court_augur_court_position').GetName()] came to me and said. "The gods have spoken and your actions are not approved by the gods, Proceed in this way and you will anger [ROOT.Char.GetFaith.HighGodName]"\n\nThis was really the worst what could happen my vassals, my realm could get in trouble because of my actions."

  pr_roman.0021.sacred_hens.desc:0 "The augur led the hens out of the cage but it was safe to say the hens weren't very hungry in my opinion. A moment later the [GetCourtPositionType('pr_court_augur_court_position').GetName()] came to me and said. "The gods have spoken and your actions are not approved by the gods, Proceed in this way and you will anger [ROOT.Char.GetFaith.HighGodName]"\n\nThis was really the worst what could happen my vassals, my realm could get in trouble because of my actions."

  pr_roman.0021.crows.desc:0 "The augur led the crows out of the cage but instead of making a song like sound they flew to the three and just stayed there without making sound. A moment later the [GetCourtPositionType('pr_court_augur_court_position').GetName()] came to me and said. "The gods have spoken and your actions are not approved by the gods, Proceed in this way and you will anger [ROOT.Char.GetFaith.HighGodName]"\n\nThis was really the worst what could happen my vassals, my realm could get in trouble because of my actions."
  pr_roman.0021.a:0 "Oh no"

  pr_roman.0022.t:0 "Augury"
  pr_roman.0022.desc:0 "In ancient Rome Augury was one of the most important things as only they can see if the gods approve our decisions, yet I failed to do so. Now I have to face the consequences."
  pr_roman.0022.a:0 "Oh no"

  pr_roman.0023.t:0 "The Lararium Shop"
  pr_roman.0023.desc:0 "Today I going to a local lararium shop they sell lots of statues of the gods but also things like incense, should I buy a new statue ?"
  pr_roman.0023.jupiter:0 "$cdr_polytheism_high_god_name$"
  pr_roman.0023.juno:0 "$cdr_polytheism_good_god_juno$"
  pr_roman.0023.mars:0 "$cdr_polytheism_war_god_name$"
  pr_roman.0023.lares:0 "$cdr_polytheism_wealth_god_name$"
  pr_roman.0023.venus:0 "$cdr_polytheism_good_god_Venus$"
  pr_roman.0023.mercurius:0 "$cdr_polytheism_wealth_god_name$"
  pr_roman.0023.minerva:0 "$cdr_polytheism_knowledge_god_name$"
  pr_roman.0023.apollo:0 "$cdr_polytheism_good_god_apollo$"
  pr_roman.0023.cancel:0 "Maybe not now"

  pr_roman_cult.0025.t:0 "The Call to Advance"
  pr_roman_cult.0025.corax.desc:0 "As a Corax, I have served my brothers in the Mithraeum, carrying the ritual food and drink. I have learned humility and the importance of service. The Pater tells me that I have shown the diligence of Mercury and that the path to the next grade, that of Nymphus, is open to me. It is a trial of symbolic union and purity, representing Venus."
  pr_roman_cult.0025.nymphus.desc:0 "As a Nymphus, I have tended the sacred lamps, ensuring the light of the Mithraeum never falters. I have learned of the soul's purity and its mystical marriage to the divine. The Pater says I am ready to face the trial of the Soldier, the Miles. This grade, under the protection of Mars, requires a test of loyalty and endurance."
  pr_roman_cult.0025.miles.desc:0 "As a Miles, I have proven my endurance and loyalty, refusing the earthly crown to declare Mithras as my only king. I have stood vigil and shown my strength. The Pater now calls me to the trial of the Leo, the Lion. Protected by Jupiter, this grade requires a trial by fire, a purification of the spirit."
  pr_roman_cult.0025.leo.desc:0 "As a Leo, I have handled the sacred fire, offering libations of honey to purify my hands and tongue. I have learned to control my passions and act with the strength of the Lion. The Pater believes I am ready to become a Perses, a Persian. This grade, under the Moon, is one of guardianship over the sacred fruits of the earth."
  pr_roman_cult.0025.perses.desc:0 "As a Perses, I have guarded the sacred honey, a symbol of preservation and the bounty of the earth. I have learned the secrets of the harvest and the cycles of nature. The Pater now calls me to the grade of Heliodromus, the Sun-Runner. This trial, under the Sun itself, is a test of my ability to guide others as Mithras guides the cosmos."
  pr_roman_cult.0025.heliodromus.desc:0 "As a Heliodromus, I have carried the light of the Sun, participating in the sacred drama of the solar journey. I have learned to embody the light and order that Mithras brings to the world. The Pater, seeing my wisdom and dedication, has declared me ready for the final step... to become a Pater, a Father to the community, under the guidance of Saturn, the keeper of time and wisdom."
  pr_roman_cult.0025.fallback.desc:0 "This is a bug please report it on steam or on discord"

  pr_roman_cult.0025.corax.a:0 "I am ready for the trial of the Bridegroom."
  pr_roman_cult.0025.corax.a.tt:0 "I will become a Nymphus, a Bridegroom. I will be veiled and presented with a lamp, symbolizing the soul's search for divine light."
  pr_roman_cult.0025.nymphus.a:0 "I am ready for the trial of the Soldier."
  pr_roman_cult.0025.miles.a:0 "I am ready for the trial of the Lion."
  pr_roman_cult.0025.leo.a:0 "I am ready for the trial of the Persian."
  pr_roman_cult.0025.leo.a.tt:0 "I will become a Perses, a Persian. I will be entrusted with the guardianship of the sacred honey, symbolizing the preservation of life."
  pr_roman_cult.0025.perses.a:0 "I am ready for the trial of the Sun-Runner."
  pr_roman_cult.0025.perses.a.tt:0 "I will become a Heliodromus, the Sun-Runner. I will participate in the sacred drama, carrying a torch to represent the light of the Sun."
  pr_roman_cult.0025.heliodromus.a:0 "I am ready to become a Father."
  pr_roman_cult.0025.heliodromus.a.tt:0 "I will become a Pater, the highest grade. I will take on the role of a wise leader, guiding my brothers in the mysteries of Mithras."
  pr_roman_cult.0025.standard:0 "Great meeting with my fellow brothers and sisters"

  pr_roman_cult.0026.t:0 "The Initiation"
  pr_roman_cult.0026.desc:0 "For the initiation to the Leo rank I need to recitation of a catechism, where I need to answer on a serie of questions. The pater of the cult started\n\n"...He will say 'Where  ...?'" Very sharp and ...\n"'... is he at a loss there?' Say'...'" Much. He will say\n"... Say'Night'. He will say 'Where ...?'" '... of the hot and cold'. He will say '...?'\n"... Say 'All things ...'" red linen. He will say Why? Say\n"Are you called? Say Because of the summery" Red border the linen, however,\n"Having become he/it has the fiery ones"  has been wrapped? Say the savior's\n"did you receive?' Say 'In a pit'. He will say 'Where is your ...'?" He will say 'Who is the father?' Say'The one who begets everything'\nIn the Leonteion. He will say 'Will you gird ...?'" He will say 'How did you become a Leo?' Say 'By the ... of the father ...'\n'"... death'. He will say 'Why, having girded yourself, ...?'" Say 'Drink and food'. He will say'...?'\n"... this has four tassels." ... in the seven-...\n\n After the recitation is done I'm welcomed into the rank of Leo"
  pr_roman_cult.0026.a:0 "I'm part of the Leo rank!"

  pr_roman_cult.0027.t:0 "The Trial of the Soldier"
  pr_roman_cult.0027.desc:0 "The Pater leads me to the center of the Mithraeum. He presents me with a crown on the tip of a sword. 'Aurelian offered a crown to the Unconquered Sun,' he proclaims. 'Now, a crown is offered to you.' I know the rite. I must push the crown away and declare my loyalty to a higher power.\n\n'My only crown is Mithras!' I shout. The Pater nods in approval. 'You have shown your loyalty. You are now a Miles, a soldier of the Unconquered God.'"
  pr_roman_cult.0027.a:0 "My only crown is Mithras!"

  pr_roman.0026.t:0 "The Latin Speaker"
  pr_roman.0026.desc:0 "After the Latin speaker arrived, he began to unroll some ancient scrolls written by Roman statesmen such as Cicero and Livius. He also placed a book of the Gallic Wars, Commentarii de bello Gallico, written by Gaius Julius Caesar, on the table.\n\nAfter a few days of learning, the teacher said, "You now know the basics of Latin. Keep working on your Latin, and you will get better every day.\n\nAs a present, I am giving you this book about the Gallic Wars."\n\nAnd so, I am finally done, and I can finally reintroduce the Latin language in court if I want to."
  pr_roman.0026.a:0 "The Latin language is back!"
  pr_roman.0026.b:0 "The Latin language is back! (Though some at court may object...)"

  pr_roman.0027.t:0 "Pontif"
  pr_roman.0027.desc:0 "My fellow [ROOT.Char.GetFaith.GetAdherentNamePlural] certainly don't expect me to declare our submission to the existing.\n\nYet, perhaps by pledging allegiance to the old Pontifex we stand stronger against our enemies..."
  pr_roman.0027.a:0 "$head_of_faith.0021.a$"
  pr_roman.0027.d:0 "We must continue cleaving to [old_pontifex.GetFaith.GetAdjectiveNoTooltip] authority!"
  pr_roman.0027.rejection_body:0 "rejects the pledge"
  pr_roman.0027.acceptance_body:0 "accepts the pledge"
  pr_roman.0027.rejection.outcome:0 "You are forced to take your own path regardless"
  pr_roman.0027.d.rejection:0 "@piety_level_0_icon_islam! [old_pontifex.GetTitledFirstNameNoTooltip] $pr_roman.0027.rejection_body$"
  pr_roman.0027.d.acceptance:0 "@piety_level_3_icon_islam! [old_pontifex.GetTitledFirstNameNoTooltip] $pr_roman.0027.acceptance_body$"

  pr_roman.0029.t:0 "The Sibylline Books"
  pr_roman.0029.desc:0 "As our priests are starting to kick out the Nazerene priests and their zea lots out of our lands and temples, many aristocrats and priests believe it is time to search for the remnants of the Sibylline Books that had been destroyed by the general Stilicho in 405 AD/1158 AUC.\n\nSo this is how we proceed answered [ROOT.Char.GetFaith.ReligiousHeadName] "If we are going through with this, it will take about a year to complete the books. Of course I will personally oversee the safety of the oracle and make sure they can do their work without interferrence of others. The choice is yours.""
  pr_roman.0029.a:0 "You may proceed" 
  pr_roman.0029.cancel:0 "Never mind"

  pr_roman.0030.t:0 "The new Sybelline Books"
  pr_roman.0030.desc:0 "While sitting on your throne, your [ROOT.Char.GetFaith.ReligiousHeadName] suddenly rushes into the hall shouting "Good news, everyone! The Oracle in Graecia had deemed the new Sibylline Books finished!"\n\n"Where would we store it?" You ask after the celebratory clutter ends. "I thought you might have had an idea about that, my liege...""
  pr_roman.0030.jupiter:0 "The Temple of $cdr_polytheism_high_god_name$!"
  pr_roman.0030.mars:0 "The Temple of $cdr_polytheism_war_god_name$!"
  pr_roman.0030.venus:0 "The Temple of $cdr_polytheism_fertility_god_name$!"
  pr_roman.0030.minerva:0 "The Temple of $cdr_polytheism_knowledge_god_name$!"

  pr_roman.0031.t:0 ""
  pr_roman.0031.desc:0 "Even though Emperor Julians Rule was short, he still left a big mark on the fourth century. He got a few nicknames in the time he ruled now it's time to choose what name you to give him."
  pr_roman.0031.polytheistic_nick:0 "Templorum Restaurator"
  pr_roman.0031.christian_nick:0 "Apostate"
  pr_roman.0031.philosopher_nick:0 "The Philosopher"
  pr_roman.0031.jewish_nick:0 "The Hellen"

  ep3_roman_restoration.0100.c:0 "The way of the great Emperor Augustus"

  pr_roman.0032.t:0 "Romanize the [pagan.GetCulture.GetCollectiveNounNoTooltip]"
  pr_roman.0032.desc:0 "Romanization brings prosperity and protection to people, but our neighbor, [pagan.GetTitledFirstName], is blissfully unaware of it, and persists in believing in only their gods who can't protect them forever from the christians.\n\nSaving [pagan.GetHerHis] soul and those of [pagan.GetHerHis] people is a noble endeavor in itself, but there also #EMP earthly#! advantages to their conversion — for starters, reducing their hostility towards us and bringing them into our own sphere of influence.\n\nMy chosen missionary, [evangelizer.GetFirstName], is ready to go."
  pr_roman.0032.a:0 "May [ROOT.Char.GetFaith.HighGodName] guide you!"
  pr_roman.0032.a.tt: "[evangelizer.GetFirstNameNoTooltip] departs for [pagan.GetTitledFirstNamePossessiveNoTooltip] capital."


  pr_roman.0034.desc: "Emissaries from our neighbors come and go frequently enough that they all mix together in my mind. However, today's envoy from [GetTitleByKey('e_byzantium').GetName] sticks out like none before.\n\n[evangelizer.GetSheHe|U] seems to be some sort of holy [evangelizer.GetWomanMan], for starters, and instead of advancing political demands, this [evangelizer.GetFirstName] preaches of an omnipotent God, honored in temples of gold and silver that always smell of incense."
  pr_roman.0034.a: "Please tell me more"
  pr_roman.0034.a.tt: "You create an [alliance|E] with [evangelizer.GetTitledFirstNamePossessiveNoTooltip] liege, [sender.GetTitledFirstName]"
  pr_roman.0034.b: "We don't need new gods."
  pr_roman.0034.c: "Ridiculous!"
  pr_roman.0034.c.tt: "This is sure to send a message: your preachers are not welcome here! But we should be ready for retaliation..."

  pr_roman.0035.t: "" #AI event, leave empty
  pr_roman.0035.desc: "" #AI event, leave empty
  pr_roman.0035.a: "" #AI event, leave empty

  pr_roman.0037.desc_new: "My predecessor [sender.GetFirstName] had invested into the spreading of the [pagan.GetCulture.GetCollectiveNounNoTooltip] but, unfortunately for [sender.GetHerHim], it is I who will reap the benefits of [sender.GetHerHis] efforts. [sender.GetHerHis|U] missionary [evangelizer.GetFirstName], in fact, has just returned."
  pr_roman.0037.desc_old: "Months ago, I sent my trusted [evangelizer.GetFirstName] to bring the knowledge about the Gods to the [pagan.GetCulture.GetCollectiveNounNoTooltip]. It is with great joy that I welcome [sender.GetHerHim] back today, as I've been eagerly waiting for [evangelizer.GetHerHis] report."
  pr_roman.0037.desc_success: "\n\n"I bring great news, my liege! [pagan.GetTitledFirstName|U] was eager to hear the Glad Tidings, and converted to [evangelizer.GetFaith.GetName], accompanied by many of [pagan.GetHerHis] people."
  pr_roman.0037.desc_failure: "\n\n"I bring somber news, my liege. Unfortunately, [pagan.GetTitledFirstName] was most unresponsive to the Word of the gods, and sent me away empty-handed.""
  pr_roman.0037.a: "Excellent!"
  pr_roman.0037.b: "It's only a temporary setback."
  pr_roman.0037.a.tt: "You create an [alliance|E] with the newly-converted [pagan.GetTitledFirstName]."

  pr_roman.0038.desc: "Terrible tidings!\n\nNews has come from the land of [pagan.GetCulture.GetCollectiveNounNoTooltip] and, apparently, my missionary [evangelizer.GetFirstName] was killed but the barbarian [pagan.GetTitledFirstName], who wasn't satisfied with rebuking any conversion attempts, but went as far as committing the final desecration and murder a [evangelizer.GetWomanMan] of the Gods!"
  pr_roman.0038.a: "Outrageous!"

  pr_roman.0039.t: "Pantheon of Constantinople"
  pr_roman.0039.desc: "With the Hagia sophia demolished we have space to build a pantheon like the one in Rome, a proper place to worship the gods "
  pr_roman.0039.a: "Open the Pantheon"

  pr_roman.0040.t: "Reopening of Pantheon"
  pr_roman.0040.desc: "Centuries have gone by, with ulitmatly giving away the pantheon by Emperor  to the Pope. All christian signs and statues are removed and replaced by marble statues of the gods./n/nFrom now on the proper gods will be worshiped here again !"
  pr_roman.0040.a: "Open the Pantheon"

  pr_roman.0041.t:0 "A Sacred Duty"
  pr_roman.0041.desc:0 "Today, I have made the momentous decision to send my beloved daughter to serve as a Vestal Virgin. It is both an honor and a sacrifice for our family, but I know that her service will bring great favor from the gods and eternal glory to our name. As she departs for the temple of Vesta, I pray that she will uphold the sacred flame and fulfill her duty with dignity and devotion."
  pr_roman.0041.a:0 "May Vesta watch over her"
  pr_roman.0041.cancel:0 "Maybe not now"

  pr_roman_cult.0042.t:0 "The cults"
  pr_roman_cult.0042.desc:0 "Centuries ago the cults where many, but with the growth of christianity the cults where baned. As ruler I have the power to restore the cults.\n\nI could restore all of them but if that is a smart thing to ? Only the gods know."
  pr_roman_cult.0042.mithras:0 "Mithras"
  pr_roman_cult.0042.sol_invictus:0 "Sol Invictus"
  pr_roman_cult.0042.isis:0 "Isis"
  pr_roman_cult.0042.serapis:0 "Serapis"
  pr_roman_cult.0042.more:0 "See more cults"

  # Other cults page
  pr_roman_cult.0048.t:0 "The cults"
  pr_roman_cult.0048.desc:0 "Centuries ago the cults where many, but with the growth of christianity the cults where baned. As ruler I have the power to restore the cults.\n\nI could restore all of them but if that is a smart thing to ? Only the gods know."
  pr_roman_cult.0048.eleusinian:0 "Eleusinian"
  pr_roman_cult.0048.imperial:0 "Imperial"
  pr_roman_cult.0048.bacchus:0 "Bacchus"
  pr_roman_cult.0048.cybele:0 "Cybele"
  pr_roman_cult.0048.back:0 "Go back"
  pr_roman_cult.0048.close:0 "Close"

  pr_roman_cult.0028.t:0 "Restoration of Mithras Cult" 
  pr_roman_cult.0028.desc:0 "In the forgotten crypts and buried garrisons of a bygone era, tales persist of a hidden lord, born from stone, who struck down the primordial bull. This is Mithras, the Unconquered Guide, whose mysteries once forged unbreakable bonds among soldiers and merchants, instilling discipline, cosmic understanding, and unwavering loyalty. For centuries, his sacred caves have remained sealed, his seven grades of initiation lost to time, known only through obscure fragments and whispered legends.\n\nMy most daring spies and dedicated scholars have hinted at the rediscovery of a hidden Mithraeum, or perhaps a ciphered text revealing the true path to his ancient wisdom. To seek out this obscured truth is to undertake a perilous quest, fraught with secrecy and demanding an iron will. It will require immense personal risk, significant investment, and a dedication to an order that transcends mere mortal ambition. Yet, the promise of the strength, foresight, and unbreakable loyalty that the Mysteries of Mithras once bestowed... it beckons with a potent, almost forgotten power."
  pr_roman_cult.0028.a:0 "Praise Mithras"

  pr_roman_cult.0043.t:0 "Restoration of Isis Cult"
  pr_roman_cult.0043.desc:0 "Rumours have reached my ear, from distant lands and ancient wisdom. They speak of Isis, the powerful goddess, queen of heaven and earth, whose embrace brings forth life and whose favour protects prosperity. Decades, perhaps even centuries, her mysteries have remained hidden, her temples neglected, her hymns silenced in this land. Yet, the echo of her name lingers on the wind, calling with the promise of abundance, fertility, and safe journeys.\n\nMy scholars and spies have uncovered ancient texts fragments of rituals, prayers, and references to secret initiations. It seems the key to her forgotten worship lies within reach, an opportunity to once again invoke her divine grace upon my realm and my people.\n\nThis is no fleeting endeavour, but a profound undertaking that will demand my dedication and resources. But imagine the blessings a reawakened Isis could bestow..."
  pr_roman_cult.0043.a:0 "Restore the cult"

  pr_roman_cult.0044.t:0 "Restoration of Cybele Cult"
  pr_roman_cult.0044.desc:0 "In the wildest parts of my domain, where civilization's grip is weakest, whispers of an ancient and formidable power have resurfaced. This is the domain of the Magna Mater, the Great Mother Cybele, a deity of untamed nature, of life, death, and ferocious rebirth. Her worship, once a vibrant and ecstatic force, has long been suppressed, its rites driven into the shadows.\n\nMy most trusted agents have uncovered a hidden community that has preserved the core of her mysteries. They speak of the Taurobolium, a baptism of blood, and of the Archigallus, the high priest who embodies the goddess's untamed spirit. To restore this cult is to embrace a primal power, one that promises immense vitality and a deep connection to the earth, but it is a path that demands absolute surrender and walks the line between divine ecstasy and madness."
  pr_roman_cult.0044.a:0 "Let the Great Mother's drums beat again!"


  pr_roman_cult.0045.t:0 "Restoration Sol Invictus Cult"
  pr_roman_cult.0045.desc:0 "For generations, the grand tales of the Roman emperors and their celestial patrons have faded into legend, whispers in crumbling ruins and forgotten texts. Yet, amidst these ancient fragments, my scholars have unearthed a recurring symbol the radiant visage of Sol, the Unconquered Sun. This was not merely a god amongst many, but the divine companion of emperors, the very essence of victory, light, and enduring power.\n\nThe knowledge required to rekindle his sacred fire is immense, scattered across lost provinces and buried beneath centuries of dust.\n\nBut I feel its pull a calling to restore this ancient patron, to bring his unifying light back to a world that has strayed far from his influence. To undertake this task is to embrace a destiny of order and might, to reforge a spiritual bedrock for an empire, or indeed, for any realm seeking true invincibility. It will demand immense personal sacrifice, vast resources, and a will as unyielding as the sun itself. Yet, the promise of his eternal favour... it is alluring beyond measure."
  pr_roman_cult.0045.a:0 "Solis Invicti!"

  pr_roman_cult.0031.t:0 "Restoration Serapis Cult"
  pr_roman_cult.0031.desc:0 "Even through the mists of time, where the gods of old seem but echoes, persistent whispers speak of a deity whose wisdom encompassed life and death, and whose bounty promised sustenance for all. This is Serapis, the lord of the fertile soil and the benevolent guide of souls through the underworld. His temples, once bustling centres of healing and prophecy, now lie silent, their sacred knowledge fragmented, passed down only through obscure lore.\n\nMy advisors speak of ancient scrolls unearthed, or perhaps a vision granted during a period of deep contemplation, hinting at the profound rituals required to reawaken his grace. The path to his restoration promises not only bountiful harvests and freedom from pestilence for my lands, but also solace for the weary and insight into the mysteries of existence.\n\nIt is a long and arduous journey, demanding dedication, substantial resources, and an understanding that transcends mere mortal concerns. But the thought of his benevolent hand guiding my realm towards unparalleled prosperity and well-being... it is a future worth striving for."
  pr_roman_cult.0031.a:0 "Restore the cult"

  pr_roman_cult.0046.t:0 "Restoration Eleusinian Cult"
  pr_roman_cult.0046.desc:0 "From the depths of ancient lore and the forgotten wisdom of the earth, whispers surface of the Eleusinian Mysteries. This was once a sacred path, illuminated by Demeter and Persephone, promising not just abundant harvests for the living, but also solace and hope for the souls journey beyond this mortal coil. Its grand rites, once held annually in hallowed Eleusis, have been lost to the ages, their profound secrets concealed by time and the silence of crumbling temples.\n\nMy most dedicated scholars speak of obscure references in philosophical texts, or perhaps the rediscovery of a hidden chamber beneath ancient ruins, hinting at the profound knowledge required to re-establish these Mysteries. To undertake this restoration is to delve into the very essence of existence, to reconnect my realm with the primal forces of life, death, and renewal. It will demand immense scholarly effort, spiritual purity, significant resources, and a reverence for the cycles that govern all things. Yet, the promise of fertile lands, inner peace, and a clearer vision of what lies beyond... it calls with a quiet, yet powerful, certainty."
  pr_roman_cult.0046.a:0 "Praise Demeter"

  pr_roman_cult.0033.t:0 "Restoration Bacchus Cult"
  pr_roman_cult.0033.desc:0 "Even in the long shadows cast by forgotten eras, whispers persist of a primal force, a deity whose ecstatic rites transcended the boundaries of civilization and unleashed the wild spirit within. This is Bacchus, the god of wine, frenzy, and liberation, whose mysterious followers, the Bacchanals, once roamed the night, shedding the shackles of mundane life. Their rites, once a hidden undercurrent in the heart of empires, were driven underground by fear and societal condemnation, their knowledge splintered into dangerous fragments.\n\nMy curiosity has been piqued by strange findings ancient tablets describing delirious dances and secret oaths, or perhaps a clandestine meeting with a shadowy figure claiming lineage to forgotten Dionysian traditions. The path to reawakening this ancient revelry is fraught with peril. It promises liberation and potent insight into the untamed aspects of existence, but at the cost of societal disapproval, moral decay, and the very real threat of scandal. It demands a spirit bold enough to embrace chaos, and resources to fund what many would deem utter madness. Yet, the allure of such untamed power, the shedding of inhibitions... it holds a dangerous fascination."
  pr_roman_cult.0033.a:0 "Freedom!"

  pr_roman_cult.0034.t:0 "Restoration Imperial Cult"
  pr_roman_cult.0034.desc:0 "Though the sun of Rome may have set in the West centuries ago, and its Christian flame burns on in the East, the profound truth of its ancient power lingers in the annals of history the mightiest realms were bound not just by laws and legions, but by the divine aura of their rulers. The Pagan Imperial Cult, that sacred tradition of venerating the 'genius' or the very person of the Emperor, was the spiritual bedrock upon which the vast Roman world once stood united. Its grand temples and solemn rites, once the beating heart of loyalty and civic order, have crumbled or been repurposed, their original pagan purpose forgotten by all but the most dedicated antiquarians.\n\nMy most esteemed advisors, after arduous study of unearthed decrees and and monumental inscriptions, have deciphered the hidden mechanisms of this ancient system. This undertaking, however, is monumental. It demands unprecedented wealth, unwavering Piety, and a soul prepared to ascend to a station beyond mortal men. It will reshape the very fabric of my realm, binding all subjects in sacred loyalty, yet offering the promise of an unshakeable dominion and an eternal legacy, echoing the true power of ancient Rome."
  pr_roman_cult.0034.a:0 "Ave Augustus"

  pr_roman_cult.0042.close:0 "Close"


  pr_roman_cult.0047.t:0 "The New Vestalis Maxima"
  pr_roman_cult.0047.desc:0 "After the death of the last Vestalis Maxima, a new vestalis maxima has been chosen by the vestal virgins. Hopefully she will stay in office for a long time and keep the sacred flame burning."
  pr_roman_cult.0047.a:0 "Praise Vesta!"


  pr_roman_cult.0053.t:0 "The New Hierophant of Isis"
  pr_roman_cult.0053.desc:0 "The previous Hierophant of Isis has journeyed to the afterlife, but the Great Mother's work is eternal. From among the most devout priestesses, a new leader has been chosen to interpret her will and guide her followers. May she be a worthy successor, blessed with wisdom and magic."
  pr_roman_cult.0053.a:0 "May Isis guide her hand."


  pr_roman_cult.0054.t:0 "The New Hierophant of Serapis"
  pr_roman_cult.0054.desc:0 "The guiding hand of the last Hierophant of Serapis has fallen still. From the ranks of the faithful, a new leader has been chosen to oversee the rites of the benevolent god of the afterlife and abundance. May he ensure our prosperity in this life and the next."
  pr_roman_cult.0054.a:0 "Praise be to Serapis!"


  pr_roman_cult.0055.t:0 "The New Hierophant of Sol Invictus"
  pr_roman_cult.0055.desc:0 "The light of the previous Hierophant has been extinguished, but the Unconquered Sun never sets. A new leader, strong and resolute, has been chosen to carry the solar flame. May his leadership be as radiant and unwavering as the sun itself."
  pr_roman_cult.0055.a:0 "The Sun is Unconquered!"


  pr_roman_cult.0056.t:0 "The New Hierophant of Eleusis"
  pr_roman_cult.0056.desc:0 "The keeper of the Mysteries has passed into the great mystery itself. A new Hierophant has been selected to lead the sacred rites of Demeter and Persephone, to guide new initiates, and to preserve the sacred hope of a blissful afterlife. May she guard the secrets well."
  pr_roman_cult.0056.a:0 "The cycle of life continues."


  pr_roman_cult.0057.t:0 "The New Hierophant of Bacchus"
  pr_roman_cult.0057.desc:0 "The wild revels of the last Hierophant have ended. A new master of ceremonies has been chosen to lead the followers of Bacchus in their ecstatic worship. May his festivals be joyous and his wine ever-flowing, bringing liberation to all who follow him."
  pr_roman_cult.0057.a:0 "Let the revelry begin anew!"

  pr_roman_cult.0058.t:0 "The New Archigallus of Cybele"
  pr_roman_cult.0058.desc:0 "The primal cry of the last Archigallus has faded. A new high priest has been chosen to lead the frenzied worship of the Great Mother, Cybele. May his devotion be as fierce as the lions that pull her chariot, and may he bring vitality to the land."
  pr_roman_cult.0058.a:0 "The Great Mother provides!"


  pr_roman_cult.0059.t:0 "The New Pater of Mithras"
  pr_roman_cult.0059.desc:0 "The Father of our Mithraeum has completed his final trial. From among the most worthy Heliodromi, a new Pater has been chosen to lead our brotherhood. May he guide us with the strength and discipline of Mithras himself, and may our bonds remain unbreakable."
  pr_roman_cult.0059.a:0 "For Mithras, the Unconquered Guide!"

  pr_roman_cult.0060.t:0 "The New Augustalis"
  pr_roman_cult.0060.desc:0 "The previous Augustalis, who upheld the divine authority of the Emperor, has passed from this world. A new priest has been chosen to lead the Imperial Cult, to ensure the 'Genius' of the ruler is venerated and the stability of the realm is secured through divine mandate. May he serve the empire with unwavering loyalty."
  pr_roman_cult.0060.a:0 "For the glory of the Empire!"

  pr_roman_cult.0061.t:0 "The Cave of Whispers"
  pr_roman_cult.0061.desc:0 "While surveying a remote part of my domain, my men stumbled upon a hidden cave. The entrance, obscured by overgrown vines, revealed a narrow passage descending into the earth. Inside, they found not a simple cavern, but a perfectly preserved Mithraeum, untouched for centuries.\n\nThe air is still and heavy with the scent of ancient incense. A magnificent Tauroctony dominates the far wall, its colors still vibrant. This place feels holy, a direct link to the earliest days of our brotherhood. I feel a pull to study its secrets, to understand the wisdom left behind by our ancestors."
  pr_roman_cult.0061.a:0 "I will personally investigate this sacred place."
  pr_roman_cult.0061.b:0 "Seal the entrance. Some secrets should remain buried."

  pr_roman_cult.0062.t:0 "The Heart of the Mithraeum"
  pr_roman_cult.0062.desc:0 "Days spent in the silent dark of the ancient Mithraeum have yielded a profound discovery. Behind a false wall in the altar, I found a small, lead-lined chest. Inside, resting on faded silk, is not gold or jewels, but a series of clay tablets inscribed with astronomical charts and philosophical texts that deepen the mysteries of Mithras beyond anything I have ever known.\n\nHowever, the chest itself is heavy... far too heavy. Prying open the lead lining reveals a hidden compartment filled with ancient gold coins, a treasure of immense value. The tablets are a gift to the spirit, the gold a temptation for the flesh. What is the true treasure of this sacred place?"
  pr_roman_cult.0062.a:0 "The wisdom is the true treasure. The gold will fund a new temple."
  pr_roman_cult.0062.b:0 "Mithras rewards the strong. The gold is mine."

  pr_roman_cult.0063.t:0 "Drums in the Woods"
  pr_roman_cult.0063.desc:0 "A frantic, rhythmic drumming echoes from the woods tonight, a sound that stirs something primal in my soul. My scouts report a wild gathering not far from the castle — men and women dancing with abandon around a great bonfire, their faces painted, their cries lost in the cacophony of drums and flutes.\n\nThey are followers of the Great Mother, Cybele, lost in one of her ecstatic rites. The energy is both terrifying and alluring. This is the raw, untamed power I pledged to understand."
  pr_roman_cult.0063.a:0 "Join them! Let the Great Mother's spirit take me!"
  pr_roman_cult.0063.b:0 "I will watch from a safe distance."
  pr_roman_cult.0063.c:0 "This is chaos! Disperse them immediately!"

  cybele_ecstatic_revelry:0 "Ecstatic Revelry"
  cybele_ecstatic_revelry_desc:0 "This character has recently participated in a wild, ecstatic ritual in honor of the Great Mother, feeling the primal energy of nature flow through them."

  eleusinian_vision:0 "Eleusinian Vision"
  eleusinian_vision_desc:0 "This character has had a profound vision related to the Eleusinian Mysteries, granting them a sense of peace about the afterlife."

  bacchus_divine_madness:0 "Divine Madness"
  bacchus_divine_madness_desc:0 "This character has recently indulged in a divinely inspired revelry, feeling the liberating joy of Bacchus."

  serapis_ferryman_token:0 "Ferryman's Token"
  serapis_ferryman_token_desc:0 "This character possesses what they believe to be a token from Serapis, easing their fears of the afterlife."

  isis_whispering_reed:0 "Whispering Reed"
  isis_whispering_reed_desc:0 "This character has been gifted a sacred reed from a priestess of Isis, which seems to whisper ancient secrets, sharpening their mind."

  pr_roman_cult.0064.t:0 "The Eleusinian Dream"
  pr_roman_cult.0064.desc:0 "I dreamt last night of a field of asphodel under a sky with two suns. A veiled woman, who I knew to be Persephone, offered me a single pomegranate seed. 'Eat, and know what is to come,' she whispered. The dream was so vivid, so real, that I awoke with the taste of the seed still on my tongue.\n\nI feel as though I have glimpsed a truth that lies beyond the veil of this world. The Mysteries are not just rituals; they are a doorway."
  pr_roman_cult.0064.a:0 "I have seen a glimpse of the afterlife."
  pr_roman_cult.0064.b:0 "It was only a dream."

  pr_roman_cult.0065.t:0 "The Unexpected Vintage"
  pr_roman_cult.0065.desc:0 "A traveling merchant has arrived at court with a truly remarkable vintage of wine. He claims it was made from grapes grown on a mountainside where a follower of Bacchus had a vision. The wine is said to induce a state of joyful madness and clarity.\n\n'A single cup,' the merchant says with a sly grin, 'and you will dance with the god himself.' The temptation is strong, but the stories of the Bacchanalia are a warning as much as an invitation."
  pr_roman_cult.0065.a:0 "Pour me a cup! Tonight, I dance!"
  pr_roman_cult.0065.b:0 "Such indulgence is for lesser men."

  pr_roman_cult.0066.t:0 "The Ferryman's Coin"
  pr_roman_cult.0066.desc:0 "While walking by the river, I found a small, worn coin, unlike any in my treasury. On one side is the crowned head of Serapis, and on the other, the three-headed hound Cerberus. It feels cold to the touch, and holding it, I feel a strange sense of peace, as if the anxieties of this life are a distant shore.\n\nIt feels like a token, a promise from the god who guides souls that my own journey into the afterlife will be a tranquil one."
  pr_roman_cult.0066.a:0 "A comforting sign from the Great God."
  pr_roman_cult.0066.b:0 "It is just an old coin."

  pr_roman_cult.0067.t:0 "The Whispering Reed"
  pr_roman_cult.0067.desc:0 "A priestess of Isis has brought me a gift... a single, hollow reed from the banks of a sacred river. 'Hold it to your ear,' she instructed, 'and the Mother will whisper her secrets to you.'\n\nDoing so, I hear not words, but a sound like the rustling of a thousand wings, the gentle lapping of water, and the sigh of the wind. It is a language older than words, a magic that calms my soul and sharpens my mind. I feel the goddess's protection around me."
  pr_roman_cult.0067.a:0 "I am blessed by her magic."
  pr_roman_cult.0067.b:0 "It is just the wind in a reed."

  pr_roman_cult.0035.t:0 ""
  pr_roman_cult.0035.desc:0 "For this religion there is no cult available"
  pr_roman_cult.0035.a:0 "Okay...."

  pr_roman_cult.0068.t:0 "The Call of the Vine"
  pr_roman_cult.0068.desc:0 "The wine flows freely tonight, and the music is a wild, intoxicating rhythm. I feel a strange pull, a desire to lose myself in the revelry, to let go of all restraint. It is as if Bacchus himself is calling to me, inviting me to taste a deeper, more dangerous joy."
  pr_roman_cult.0068.a:0 "Indulge further."
  pr_roman_cult.0068.b:0 "Withdraw from the revelry."

  pr_roman_cult.0069.t:0 "The Vision of Bacchus"
  pr_roman_cult.0069.desc:0 "As the world spins around me, I see him. Bacchus, crowned with ivy, his eyes filled with a terrifying, beautiful madness. He offers me a cup, not of wine, but of pure, liquid light. 'Drink,' he whispers, 'and see the world as it truly is: a chaotic, glorious dance.'"
  pr_roman_cult.0069.a:0 "Embrace the vision."
  pr_roman_cult.0069.b:0 "Dismiss it as a drunken dream."

  bacchus_vision_cooldown:0 "Vision Cooldown"
  bacchus_vision_cooldown_desc:0 "This character has recently sought a vision from Bacchus and must wait before doing so again."

  bacchus_divine_insight:0 "Divine Insight"
  bacchus_divine_insight_desc:0 "This character has received a profound insight from a vision of Bacchus, granting them a deeper understanding of the chaotic nature of the world."

  pr_roman.0042.t:0 "The Gates of Janus are Open"
  pr_roman.0042.desc:0 "As is tradition, [ROOT.Char.GetTitledFirstName] has unbarred the Gates of Janus, the ancient symbol of war. The heavy bronze doors groan open, and the gaze of the two-faced god falls upon the world. Janus goes with our soldiers to war, his divine presence a promise of the victories to come."
  pr_roman.0042.a:0 "May Janus grant us swift victory!"

  pr_roman.0043.t:0 "The Gates of Janus are Closed"
  pr_roman.0043.desc:0 "As is tradition, [ROOT.Char.GetTitledFirstName] has barred the Gates of Janus, the ancient symbol of war. The heavy bronze doors groan shut, and the gaze of the two-faced god turns inward. Janus now watches over a world at peace, his divine presence a promise that the bloodshed has ceased."
  pr_roman.0043.a:0 "May Janus keep the peace as steadfastly as he once guided our soldiers!"

  # Latin Revival Chain (0050-0051)
  pr_roman.0050.t:0 "A Voice of Dissent"
  pr_roman.0050.desc:0 "No sooner has the Latin teacher departed the hall than [scope:pr_greek_opponent.GetFirstName] steps forward, face flushed with barely concealed irritation.\n\n"So we are to abandon the language of Homer and Plato?" [scope:pr_greek_opponent.GetSheHe] says, voice tight. "The language that built civilization? Greek has been the tongue of emperors and philosophers for a thousand years, and now we cast it aside for the scribblings of cattle-herders from Latium?"\n\nA murmur ripples through the court. Several courtiers nod in grudging agreement. The decision is yours — how you handle this dissent will set the tone for the Latin revival."
  pr_roman.0050.a:0 "Greek and Latin shall coexist in my court."
  pr_roman.0050.b:0 "Latin is the voice of Rome. Deal with it."
  pr_roman.0050.c:0 "Perhaps you should learn Latin yourself."

  pr_roman.0051.t:0 "The Scriptorium"
  pr_roman.0051.desc:0 "A fortnight later, [scope:pr_latin_speaker.GetFirstName] approaches the throne with a rolled parchment under one arm and a gleam in [scope:pr_latin_speaker.GetHerHis] eye.\n\n"My [ROOT.Char.GetTitleAsNameNoTooltip], the court has begun to embrace Latin, but words die without scribes to preserve them. I propose the establishment of a scriptorium — a place where clerks may copy the classics of Cicero, Livius, and Virgil, and where your courtiers may learn the tongue of our ancestors."\n\n[scope:pr_latin_speaker.GetSheHe] unrolls the parchment, revealing detailed plans for a modest writing hall. "It would require some gold to establish, but the rewards to your court's learning would be immeasurable." Then, with a sly smile, [scope:pr_latin_speaker.GetSheHe] adds, "Of course, if you truly wish to honor the legacy of Rome, we could build something grander — a full academy, worthy of the Caesars themselves.""
  pr_roman.0051.a:0 "Establish the scriptorium."
  pr_roman.0051.b:0 "We cannot afford such luxury."
  pr_roman.0051.c:0 "Make it a grand academy, worthy of Rome!"

  pr_scriptorium_established:0 "Scriptorium"
  pr_scriptorium_established_desc:0 "A scriptorium has been established at this court, where clerks copy the classics of Latin literature and courtiers learn the tongue of Rome."
  pr_grand_academy_established:0 "Grand Academy"
  pr_grand_academy_established_desc:0 "A grand academy has been established at this court, a center of Latin learning worthy of the Caesars, drawing scholars and scribes from across the realm."
  pr_latin_revival_diplomatic:0 "Cultural Exchange"
  pr_latin_revival_diplomatic_desc:0 "This ruler has fostered a spirit of cultural coexistence between the Greek and Latin traditions at their court."
