  # --- Roman Pontifex Selection (0027) ---
  pr_roman.0800.t:0 "Choosing a Pontifex"
  pr_roman.0800.desc:0 "#F The old faith has been reformed, and a new spiritual leader must be chosen to guide the faithful. As the reformer, it falls to me to decide whether to follow the existing pontifex or to assert our independence.#!\n\nThe gods watch as I make this sacred decision."
