  #Venus 
  pr_roman.0110.t:0 "The Offering"

  pr_roman.0110.incense.desc:0 "Today I'm going to honor Venus goddess of love, beauty and desire.\nAfter the preparations are done I'm ready to start the ritual.\nAs the ritual progresses it's time to offer to Venus, I state clearly what I offer and to which god(dess) and after that I burn the incense.\n\nAs last part I observe the room for any signs and offer to Vesta and Janus and as safety offer one last time to Venus to apologize for any inconvenience during the ritual.\nNow the ritual is done I hope Venus did hear my prayer and accepts my offer, afterwards I stop the incense from burning."


  pr_roman.0110.wine.desc:0 "Today I'm going to honor Venus goddess of love, beauty and desire.\nAfter the preparations are done I'm ready to start the ritual.\nAs the ritual progresses it's time to offer to Venus, I state clearly what I offer and to which god(dess) and after that I offer the libation of wine in a glass.\n\nAs last part I observe the room for any signs and offer to Vesta and Janus and as safety offer one last time to Venus to apologize for any inconvenience during the ritual.\nNow the ritual is done I hope Venus did hear my prayer and accepts my offer, afterwards you drink the wine."


  pr_roman.0110.roses.desc:0 "Today I'm going to honor Venus goddess of love, beauty and desire.\nAfter the preparations are done I'm ready to start the ritual.\nAs the ritual progresses it's time to offer to Venus, I state clearly what I offer and to which god(dess) and after that I put the roses in a vase and sprinkle it with some water.\n\nAs last part I observe the room for any signs and offer to Vesta and Janus and as safety offer one last time to Venus to apologize for any inconvenience during the ritual.\nNow the ritual is done I hope Venus did hear my prayer and accepts my offer, I give the roses back to nature."

