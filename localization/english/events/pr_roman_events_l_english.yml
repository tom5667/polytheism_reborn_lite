  pr_roman.0100.message.negative:0 "Offer Unsuccessful"


  #Iuno 
  pr_roman.0108.t:0 "The Offering"

  pr_roman.0108.incense.desc:0 "Today I'm going to honor $cdr_polytheism_good_god_juno$ goddess of marriage, protector of woman and wife of Iupiter.\nAfter the preparations are done I'm ready to start the ritual.\nAs the ritual progresses it's time to offer to $cdr_polytheism_good_god_juno$ , I state clearly what I offer and to which god(dess) and after that I put the figs on the plate and sprinkle it with some water.\n\nAs last part I observe the room for any signs and offer to Vesta and Janus and as safety offer one last time to $cdr_polytheism_good_god_juno$ to apologize for any inconvenience during the ritual.\nNow the ritual is done I hope $cdr_polytheism_good_god_juno$  did hear my prayer and accepts my offer, afterwards I stop the incense from burning."

  pr_roman.0108.wine.desc:0 "Today I'm going to honor $cdr_polytheism_good_god_juno$ goddess of marriage, protector of woman and wife of Iupiter.\nAfter the preparations are done I'm ready to start the ritual.\nAs the ritual progresses it's time to offer to $cdr_polytheism_good_god_juno$ , I state clearly what I offer and to which god(dess) and after that I offer the libation of wine in a glass.\n\nAs last part I observe the room for any signs and offer to Vesta and Janus and as safety offer one last time to $cdr_polytheism_good_god_juno$ to apologize for any inconvenience during the ritual.\nNow the ritual is done I hope $cdr_polytheism_good_god_juno$  did hear my prayer and accepts my offer, Afterwards I drink the wine."

  pr_roman.0108.figs.desc:0 "Today I'm going to honor $cdr_polytheism_good_god_juno$ goddess of marriage, protector of woman and wife of Iupiter.\nAfter the preparations are done I'm ready to start the ritual.\nAs the ritual progresses it's time to offer to $cdr_polytheism_good_god_juno$ , I state clearly what I offer and to which god(dess) and after that I put the figs on the plate and sprinkle it with some water.\n\nAs last part I observe the room for any signs and offer to Vesta and Janus and as safety offer one last time to $cdr_polytheism_good_god_juno$ to apologize for any inconvenience during the ritual.\nNow the ritual is done I hope $cdr_polytheism_good_god_juno$  did hear my prayer and accepts my offer, afterwards I eat the figs or give them back to nature."

  pr_roman.0108.fallback.desc:0 "This is a bug, please send a message on discord or leave a bug report on steam."

