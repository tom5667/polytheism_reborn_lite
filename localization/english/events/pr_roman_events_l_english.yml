  pr_roman.0109.incense.desc:0 "Today I'm going to honor Mars god of war.\nAfter the preparations are done I'm ready to start the ritual.\nAs the ritual progresses it's time to offer to Mars, I state clearly what I offer and to which god(dess) and after that I burn the incense.\n\nAs last part I observe the room for any signs and offer to Vesta and Janus and as safety offer one last time to Mars to apologize for any inconvenience during the ritual.\nNow the ritual is done I hope Mars did hear my prayer and accepts my offer, afterwards I stop the incense from burning."

  pr_roman.0109.wine.desc:0 "Today I'm going to honor Mars god of war.\nAfter the preparations are done I'm ready to start the ritual.\nAs the ritual progresses it's time to offer to Mars, I state clearly what I offer and to which god(dess) and after that I offer the libation of wine.\n\nAs last part I observe the room for any signs and offer to Vesta and Janus and as safety offer one last time to Mars to apologize for any inconvenience during the ritual.\nNow the ritual is done I hope Mars did hear my prayer and accepts my offer, afterwards you drink the wine"

