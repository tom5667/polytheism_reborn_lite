l_english:

  # --- A Priest of Tadenus (0001) ---
  pr_illyrian.0001.t:0 "A Priest of Tadenus"
  pr_illyrian.0001.desc:0 "#F I sit in my chambers, nursing my wounds from a recent battle. The pain is great, and I know that I will not heal on my own.#!\n\nSuddenly, a knock comes at the door. I open it to find a priest of Tadenus, the Illyrian god of healing. "Greetings," the priest says. "I have heard of your wounds, and I have come to offer my help."\n\nI am hesitant at first, but I agree to let the priest heal me. He places his hands on my wounds and chants a prayer to Tadenus. He then sacrifices a small animal and offers its flesh to the flames.\n\nAs the priest prays, I feel a warm tingling sensation in my wounds. The pain begins to subside. After a few minutes, the priest finishes his prayer. He smiles and says, "Tadenus has heard our prayers."\n\nI am grateful to the priest, and I know that Tadenus has watched over me. However, I know that not all wounds heal, and that even the gods cannot always save us. I will have to wait and see if Tadenus's blessing is enough to heal me."
  pr_illyrian.0001.a:0 "Now we wait"

  # --- Choose Main Deity (0002) ---
  pr_illyrian.0002.t:0 "Choose Main Deity"
  pr_illyrian.0002.desc:0 "#F To help me in the struggle to rule my realm, I could devote myself to one of the gods or goddesses.#!"
  pr_illyrian.0002.en:0 "En"
  pr_illyrian.0002.medaurus:0 "Medaurus"
  pr_illyrian.0002.anzotica:0 "Anzotica"
  pr_illyrian.0002.bindus:0 "Bindus"
  pr_illyrian.0002.tadenus:0 "Tadenus"
  pr_illyrian.0002.optout:0 "Maybe now isn't the right time"

  # --- A Dream of Medaurus (0003) ---
  pr_illyrian.0003.t:0 "A Dream of Medaurus"
  pr_illyrian.0003.desc:0 "#F I am asleep in my bed when a dream takes me. In my dream, I am standing on a battlefield. The ground is stained with blood, and the air is filled with the sound of battle.#!\n\nSuddenly, I see a figure riding towards me on a white horse. It is Medaurus, the Illyrian god of war. Medaurus is tall and imposing, and he carries a lance in his hand.\n\nMedaurus stops in front of me and raises his lance. "I have come to you," he says, "because you have been chosen to be a champion of the Illyrian faith."\n\nI am shocked. "Me?" I ask. "But I am just a simple ruler."\n\n"You are not so simple," Medaurus says. "You have a strong heart and a brave spirit. These are the qualities that a champion needs."\n\nMedaurus lowers his lance. "I bless you with my strength and courage," he says. "You will be a great leader and a powerful warrior. You will bring glory to the Illyrian faith." Medaurus disappears, and I wake up.\n\nI sit up in bed, my heart pounding. Was it just a dream? Or did Medaurus truly appear to me?"
  pr_illyrian.0003.a:0 "Is this real or a dream?"

  # --- Embrace Illyrian Culture (0005) ---
  pr_illyrian.0005.t:0 "The Illyrian Spirit"
  pr_illyrian.0005.desc:0 "#F For too long, we have lost the old virtues of the Illyrian tribes. The last great king who stood against the Romans, Bardylis, was a true Illyrian — brave, strong, and wise. He fought for the freedom of our people, and he died a hero's death.#!\n\nBut after his fall, our people were scattered and divided. We lost our culture and our language. We became servants to others. But now, it is time to reclaim our heritage. It is time to become Illyrians again."
  pr_illyrian.0005.a:0 "Embrace the Illyrian culture"
