  # --- Choose Main Deity: Lusitanian (0100) ---
  pr_iberian.0100.t:0 "Choose Main Deity"
  pr_iberian.0100.desc:0 "#F The gods of the Iberian hills and forests are ancient, and their favour is won through devotion and sacrifice. To guide my people through the trials ahead, I would do well to devote myself to one of the great deities of the Lusitanian pantheon.#!\n\nReue, lord of the high places, watches over all who dwell beneath him. Endovelicus, god of healing, restores the sick who call upon him. Ataecina, lady of Turobriga, is honoured across the south. Nabia, lady of the springs, keeps the waters flowing. Bandua, protector of the community, stands guard over the faithful.\n\nWhich path shall I walk?"
  pr_iberian.0100.reue:0 "Reue, Lord of the Mountains"
  pr_iberian.0100.arancio:0 "Endovelicus, God of Healing"
  pr_iberian.0100.ataegina:0 "Ataecina, Lady of Turobriga"
  pr_iberian.0100.lucubo:0 "Nabia, Lady of the Springs"
  pr_iberian.0100.cariocecus:0 "Bandua, Protector of the Community"
  pr_iberian.0100.optout:0 "Maybe now isn't the right time"
