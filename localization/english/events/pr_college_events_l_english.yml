l_english:
 # College of Pontiffs: storyline "The New Believers" (Lex Ogulnia)
 pr_college.0100.t:0 "A Seat Among the Pontiffs"
 pr_college.0100.desc:0 "[pr_ogulnia_convert.GetTitledFirstName] comes before me dressed for the old rites, though not long ago [pr_ogulnia_convert.GetSheHe] knelt before the cross. "I have given my house to the gods," [pr_ogulnia_convert.GetSheHe] says, "yet the College of Pontiffs is closed to all but the families who kept the rites alive. Do the gods hear my prayers less well than theirs?"\n\nBehind [pr_ogulnia_convert.GetHerHim] the pontiffs of the founding houses watch in silence. [pr_ogulnia_founder.GetFirstName] has already told me what [pr_ogulnia_founder.GetSheHe] thinks: the rites belong to those who carried them through the dark years, not to those who wore a cross yesterday."
 pr_college.0100.desc.first:0 "\n\nIt is the first time the new believers ask for a voice in the College, but it will not be the last."
 pr_college.0100.desc.again:0 "\n\nThey asked before and were sent away. Now there are more of them, and they no longer ask as quietly."
 pr_college.era.700:0 "\n\n#weak Missionaries still walk the roads of the lands that keep the old gods, and the Church does not forget a soul that turns away.#!"
 pr_college.era.867:0 "\n\n#weak Rome and Constantinople quarrel over who may baptise the kings of the world. Neither will forgive a convert who slips away.#!"
 pr_college.era.1066:0 "\n\n#weak Since the two Churches parted, each counts its faithful jealously.#!"
 pr_college.era.1178:0 "\n\n#weak In this age the Church preaches the cross against those who turn from it.#!"
 pr_college.0100.a:0 "Let the College hear the petition."
 pr_college.0100.b:0 "The College is not yours to ask for."

 pr_college.0101.t:0 "Letters from the Church"
 pr_college.0101.desc.head:0 "Word reaches me that [pr_ogulnia_church_head.GetTitledFirstName] has written to the families of the new believers. The letters come with gifts and with a preacher, who speaks of the souls they have lost and of the welcome that waits for any who return to the Church. [pr_ogulnia_convert.GetFirstName]'s own kin have begun to waver."
 pr_college.0101.desc.nohead:0 "Word reaches me: [pr_ogulnia_church_title.GetName|U] has written to the families of the new believers. The letters come with gifts and with a preacher, who speaks of the souls they have lost and of the welcome that waits for any who return. [pr_ogulnia_convert.GetFirstName]'s own kin have begun to waver."
 pr_college.0101.era.700:0 "\n\n#weak So the Church has always worked: with letters, gifts and patient missionaries, under the protection of a Christian lord.#!"
 pr_college.0101.era.867:0 "\n\n#weak Rome and Constantinople bid against each other for every soul. It is said that a king may name his own archbishop, if only he chooses the right Church.#!"
 pr_college.0101.era.1066:0 "\n\n#weak When the faithful fall away, the Church's answer is no longer only letters: in the north, those who returned to the old gods have paid with fire and sword.#!"
 pr_college.0101.era.1178:0 "\n\n#weak The Church now grants the same pardon for fighting those who leave it as for fighting in the Holy Land.#!"
 pr_college.0101.a:0 "They are under my protection."
 pr_college.0101.b:0 "Let the preacher talk. A faith that cannot be argued for is no faith."
 pr_college.0101.b.holds:0 "[pr_ogulnia_convert.GetFirstName] stands firm"
 pr_college.0101.b.lost:0 "[pr_ogulnia_convert.GetFirstName] returns to the Church"
 pr_college.0101.c:0 "Send the envoy home."
 pr_college.0101.a.tt:0 "The new believers rally behind you: a #P better chance#! in the vote"
 pr_college.0101.b.holds.tt:0 "[pr_ogulnia_convert.GetFirstName] has proven [pr_ogulnia_convert.GetHerHis] faith: the #P best chance#! in the vote"
 pr_college.0101.c.tt:0 "The founding houses approve: a #P slightly better chance#! in the vote. The Church #N will answer this#! in a year or three."
 pr_college_ogulnia_collapse_tt:0 "The petition #N loses its face#!: the new believers will not ask again for five years"
 pr_college_ogulnia_refuse_tt:0 "The new believers will ask again in ten years, and #N remember the refusal#! when the College votes"

 pr_college.0102.t:0 "The Lex Ogulnia"
 pr_college.0102.desc:0 "The College is divided. [pr_ogulnia_founder.GetFirstName] speaks for the founding houses: "This is not about us. It is about the gods, and about rites that must not be stained."\n\n[pr_ogulnia_convert.GetFirstName] answers: "Do the gods hear a newcomer less well? Your own fathers came to the old gods once, as strangers. We do not come to push you aside, but to stand beside you.""
 pr_college.0102.desc.first:0 "\n\nThe law would add four seats to the College, for the new believers. Today it is put to the vote."
 pr_college.0102.desc.again:0 "\n\nWhen the law was last brought forward, a single veto stopped it. Today it is brought again, and some who opposed it then have begun to waver."
 pr_college.0102.a:0 "Open the College to them."
 pr_college.0102.b:0 "Let the College grow, but let it choose its new members."
 pr_college.0102.c:0 "Not in my lifetime."
 pr_college.0102.success:0 "The law passes"
 pr_college.0102.failure:0 "A veto stops the law"
 pr_college.0102.a.tt:0 "If the law passes, the new believers take the four new seats #P at once#!, and the new pontiffs are grateful to you. The founding houses will not forgive it."
 pr_college.0102.b.tt:0 "If the law passes, the College fills the four new seats #N itself, one at a time#!. The founding houses are content."
 pr_college_ogulnia_open_grateful_tt:0 "The four new pontiffs are grateful to you"
 pr_college_ogulnia_gradual_tt:0 "The College fills the new seats one at a time"

 pr_college.0103.t:0 "Four New Seats"
 pr_college.0103.desc.open:0 "The law has passed. Four new seats stand in the College of Pontiffs, and the new believers take them at once. [pr_ogulnia_convert.GetFirstName] is among the first. The founding houses keep their counsel, but they will not forget who opened the doors."
 pr_college.0103.desc.open.other:0 "The law has passed. Four new seats stand in the College of Pontiffs, and the new believers take them at once. The founding houses keep their counsel, but they will not forget who opened the doors."
 pr_college.0103.desc.gradual:0 "The law has passed. Four new seats stand in the College of Pontiffs, but the College itself will choose who fills them, one at a time, as it has always chosen its members. The founding houses are content. The new believers will have to earn their place."
 pr_college.0103.a:0 "The gods hear every voice."
 pr_college.0103.gradual.head.tt:0 "The new seats open one at a time, and each stands #N open for a year#!: in that year you can name a candidate with #V Nominate for the College of Pontiffs#! (right-click a man of the Roman faith, then Religion). The College takes your nominee first. Without one, it co-opts a member itself, and then the next seat opens."
 pr_college.0103.gradual.tt:0 "The College fills the new seats itself, one at a time."

 pr_college.0104.t:0 "The Veto"
 pr_college.0104.desc:0 "When the vote is called, [pr_ogulnia_founder.GetFirstName] rises and speaks a single word: "Veto." The law falls, and the hall empties in silence."
 pr_college.0104.desc.again:0 "\n\nIt is not the end. Such laws have failed before, and passed at the next attempt."
 pr_college.0104.desc.final:0 "\n\nIt was the fourth time. The new believers do not ask again. They wait, and they remember who would not open the doors."
 pr_college.0104.a:0 "Another day."
 pr_college.0104.a.tt:0 "In three years you can bring the law again with the decision #V Bring the Lex Ogulnia Again#!, with a better chance. After the fourth veto the new believers give up for now."
 pr_college.0104.a.final.tt:0 "The new believers #N give up for ten years#!, and remember it when the College next votes"

 pr_college.0105.t:0 "The Church Answers"
 pr_college.0105.desc.head:0 "[pr_ogulnia_church_head.GetTitledFirstName] has not forgotten the envoy I sent home. A new letter arrives, colder than the first: the Christians at my court are watched, and my name is spoken with contempt wherever they gather. The letter asks for amends."
 pr_college.0105.desc.nohead:0 "[pr_ogulnia_church_title.GetName|U] has not forgotten the envoy I sent home. A new letter arrives, colder than the first: the faithful at my court are watched, and my name is spoken with contempt wherever Christians gather. The letter asks for amends."
 pr_college.0105.era.700:0 "\n\n#weak More missionaries come to my borders now, under the protection of Christian lords.#!"
 pr_college.0105.era.867:0 "\n\n#weak The envoys of both Rome and Constantinople have grown cold at my court.#!"
 pr_college.0105.era.1066:0 "\n\n#weak On my borders, Christian lords speak of the apostates with open contempt.#!"
 pr_college.0105.era.1178:0 "\n\n#weak Preachers already speak of a cross to be taken up against those who turned from it.#!"
 pr_college.0105.a:0 "Send gifts to make amends."
 pr_college.0105.b:0 "Receive the next envoy with honour."
 pr_college.0105.c:0 "The gods of Rome answer to no bishop."
 pr_college.0105.c.tt:0 "The Christian rulers around you, the head of the Church and the #N Christians in your own realm#! think #N less of you#! for ten years"
 pr_college.next_vote.tt:0 "The College will vote on the law within a month or two."
 pr_college.next_lord.tt:0 "Within a year or two, the matter of the College comes before you again."
 pr_college.church_answers_end.tt:0 "This ends the quarrel: the Church will not write to you about this again."
 pr_college.church_answers_end.ogulnia.vote:0 "The vote on the Lex Ogulnia is still to come."
 pr_college.church_answers_end.ogulnia.veto:0 "Once three years have passed since the veto, you may bring the Lex Ogulnia again with the decision #V Bring the Lex Ogulnia Again#!."
 pr_college.church_answers_end.ogulnia.passed:0 "The Lex Ogulnia stands. The Church's anger does not touch it."
 pr_college.church_answers_end.ogulnia.gradual:0 "Under the Lex Ogulnia the College grows by one seat each year. The Church's anger does not touch it."
 pr_college.church_answers_end.ogulnia.rests:0 "The Lex Ogulnia rests for now. The question may return in later years."
 pr_college.church_answers_end.cornelia.vote:0 "The vote on the Lex Cornelia is still to come."
 pr_college.church_answers_end.cornelia.veto:0 "Once three years have passed since the veto, you may bring the Lex Cornelia again with the decision #V Bring the Lex Cornelia Again#!."
 pr_college.church_answers_end.cornelia.passed:0 "The Lex Cornelia stands. The Church's anger does not touch it."
 pr_college.church_answers_end.cornelia.gradual:0 "The Lex Cornelia waits until the College has filled the seats of the Lex Ogulnia. The Church's anger does not touch it."
 pr_college.church_answers_end.cornelia.rests:0 "The Lex Cornelia rests for now. The question may return in later years."
 pr_college.0105.amends.tt:0 "The head of the Church forgives the envoy sent home"

 # College of Pontiffs: storyline "Rome and Constantinople" (Lex Cornelia)
 pr_college.0200.t:0 "Rome and Constantinople"
 pr_college.0200.desc:0 "Two embassies arrive at my court within a month of each other, and neither knew of the other. The envoys of Rome bring books, relics and two bishops, and speak of the Apostle Peter, who holds the keys of heaven. The envoys of Constantinople bring silk, a golden cross and an offer: let me be baptised, and the Emperor himself will stand as my godfather.\n\nBoth want the same thing: my realm, and the souls in it. Both warn me against the other. And in the temples my pontiffs watch, and wonder whether the gods of Rome will still have a College when the bishops are done."
 pr_college.0200.desc.own_city:0 "An embassy from Rome arrives at my court. Its envoys bring books, relics and two bishops, and speak of the Apostle Peter, who holds the keys of heaven. Within a month the other Church answers, and it needs no ship: the Patriarch of Constantinople lives under my rule, and he comes in person, with a golden cross and an offer: let me be baptised by his hand, as the emperors of this city were crowned by it.\n\nBoth want the same thing: my realm, and the souls in it. Both warn me against the other. And in the temples my pontiffs watch, and wonder whether the gods of Rome will still have a College when the bishops are done."
 pr_college.0200.desc.first:0 "\n\nNever before have both Churches courted a realm of the old gods at once."
 pr_college.0200.desc.again:0 "\n\nThey have come before, and gone home empty-handed. This time they bring more, and their patience is thinner."
 pr_college.0200.era.700:0 "\n\n#weak Rome still writes gently: let the temples stand, but give them to the saints. Constantinople can give a title and a bride even to a lord who keeps his old gods.#!"
 pr_college.0200.era.700.own_city:0 "\n\n#weak Rome still writes gently: let the temples stand, but give them to the saints. The Patriarch, who must live under my rule, writes more gently still.#!"
 pr_college.0200.era.867:0 "\n\n#weak Not long ago a king of the Bulgars asked Rome for a patriarch of his own. Rome offered an archbishop. Constantinople offered more, and won him.#!"
 pr_college.0200.era.1066:0 "\n\n#weak Since the two Churches cursed each other, each counts every baptised king as a victory over the other.#!"
 pr_college.0200.era.1178:0 "\n\n#weak Rome now takes kingdoms under the protection of Saint Peter, and its preachers speak of the cross against those who refuse.#!"
 pr_college.0200.a:0 "The gods of Rome need no shepherd from abroad. Send them both home."
 pr_college.0200.a.tt:0 "Both Churches are #N offended#!, and the nearer one #N will answer this#! in a year or three. The College sees a ruler who bows to no bishop: a #P small help#! in the vote."
 pr_college.0200.b:0 "Let them bid against each other. Ask both for a patriarch of our own."
 pr_college.0200.b.success:0 "Both bid high"
 pr_college.0200.b.failure:0 "[pr_ogulnia_church_title.GetName|U] sees through it"
 pr_college.0200.b.success.tt:0 "The gifts of two Churches fill your treasury, and the great men of the realm see their ruler courted as an equal: a #P great help#! in the vote"
 pr_college.0200.b.failure.tt:0 "[pr_ogulnia_church_title.GetName|U] #N will not forget#! the deceit, nor will the rulers of its Church around you. It #N will answer this#! in a year or three. Some gifts still came: a #P small help#! in the vote."
 pr_college.0200.c:0 "Receive them both with honour, and promise nothing."
 pr_college.0200.c.tt:0 "Feasts and gifts for two embassies cost you face, but neither Church is offended: a #P great help#! in the vote"

 pr_college.0201.t:0 "The Wavering Lord"
 pr_college.0201.desc:0 "[pr_cornelia_lord.GetTitledFirstName] is the greatest of my lords who still keep the old gods. [pr_ogulnia_church_title.GetName|U] has kept a priest at [pr_cornelia_lord.GetHerHis] hall all winter, and now [pr_cornelia_lord.GetSheHe] speaks openly of baptism.\n\n"The bishops promise my house a place in their world," [pr_cornelia_lord.GetSheHe] tells me. "What does the old faith promise? Nine pontiffs, and every seat taken.""
 pr_college.0201.desc.nolord:0 "The envoys have gone, but their words remain. Yet none of my great lords wavers: the families of the realm keep the old gods, and wait to see what I will do with the College."
 pr_college.0201.era.700:0 "\n\n#weak So it has always gone: a missionary under the protection of a great lord, and a lord who weighs what the Church can give him.#!"
 pr_college.0201.era.867:0 "\n\n#weak The Bulgar king's nobles rose against him when he took the cross. A lord who goes over to the Church may take others with him.#!"
 pr_college.0201.era.1066:0 "\n\n#weak The missionary bishops of the north travel from hall to hall, and every lord they win is a door into the realm.#!"
 pr_college.0201.era.1178:0 "\n\n#weak The Church promises the baptised stone castles and the friendship of Christian kings.#!"
 pr_college.0201.a:0 "Promise [pr_cornelia_lord.GetHerHim] a seat in a greater College."
 pr_college.0201.a.tt:0 "[pr_cornelia_lord.GetFirstName] stays, and the great men of the realm see that the old faith has room for them: a #P great help#! in the vote. [pr_cornelia_lord.GetSheHe|U] #N expects the seat#!: if the College chooses its new members itself, or the law fails, the promise is broken."
 pr_college.0201.b:0 "Remind [pr_cornelia_lord.GetHerHim] who [pr_cornelia_lord.GetHerHis] liege is."
 pr_college.0201.b.submits:0 "[pr_cornelia_lord.GetFirstName] bows"
 pr_college.0201.b.lost:0 "[pr_cornelia_lord.GetFirstName] takes the cross"
 pr_college.0201.b.submits.tt:0 "The other lords take note: a #P fair help#! in the vote"
 pr_college.0201.c:0 "Let [pr_cornelia_lord.GetHerHim] go. Faith that must be bought is worth nothing."
 pr_college.0201.c.tt:0 "[pr_cornelia_lord.GetFirstName] #N goes over to the Church#!, but the College admires a ruler who will not buy faith with seats: a #P small help#! in the vote"
 pr_college.0201.d:0 "Then the law can be brought."

 pr_college.0202.t:0 "The Lex Cornelia"
 pr_college.0202.desc:0 "I bring the law before the College, the Lex Cornelia de sacerdotiis: fifteen places among the pontiffs instead of nine, so that the old faith has room for the great men of a great realm. [pr_cornelia_pontifex.GetFirstName] speaks against it: "A College that grows for every king's whim is no College. The gods chose nine. Let the gods choose more, if they want more."\n\nOne question remains: who will fill the new seats? The College could choose them itself, as it always has. Or they could be chosen by electors from among the great men of the realm, as was once done in Rome when the people would not trust the priests to choose their own."
 pr_college.0202.desc.first:0 "\n\nToday it is put to the vote."
 pr_college.0202.desc.again:0 "\n\nWhen the law was last brought forward, a veto stopped it. Today it is brought again."
 pr_college.0202.a:0 "Let the College choose its new members itself."
 pr_college.0202.b.none.tt:0 "#N No great man of your realm#! who keeps the old gods may take a seat: the College would co-opt the new members itself"
 pr_college.0202.b.few.tt:0 "Great men of your realm who keep the old gods and may take a seat: #V [SCOPE.ScriptValue('pr_college_cornelia_electable_value')|0]#! of six. The College co-opts the rest itself"
 pr_college.0202.b:0 "Let electors from among the great men choose them."
 pr_college.0202.c:0 "Not in my lifetime."
 pr_college.0202.success:0 "The law passes"
 pr_college.0202.failure:0 "A veto stops the law"
 pr_college.0202.a.tt:0 "#P The easier law to carry.#! If it passes, the College co-opts the six new pontiffs itself and is grateful for its old right, a #P great gain in piety#!. But your great lords #N get no seat#!, and any promise of a seat is #N broken#!."
 pr_college.0202.b.nopromise.tt:0 "#N The harder law to carry.#! If it passes, electors give the new seats to your greatest Roman vassals who may take one. They are grateful. The College #N resents it#!, and from now on it co-opts the great men of the realm before its own priests."
 pr_college.0202.b.tt:0 "#N The harder law to carry.#! If it passes, electors give the new seats to the lord you promised a seat and to your greatest Roman vassals who may take one. They are grateful. The College #N resents it#!, and from now on it co-opts the great men of the realm before its own priests."
 pr_college_cornelia_cooptation_tt:0 "The College co-opts the six new pontiffs itself"
 pr_college_cornelia_election_tt:0 "The six new seats go to your own great men, chosen by electors"
 pr_college_cornelia_election_none_tt:0 "No great man of your realm may take a seat: the College co-opts the new pontiffs itself"
 pr_college_cornelia_election_few_tt:0 "#V [SCOPE.ScriptValue('pr_college_cornelia_electable_value')|0]#! of the six new seats go to your own great men, chosen by electors. The College co-opts the rest"
 pr_college_cornelia_passed_over_tt:0 "Your powerful Roman vassals without a seat feel #N passed over#!"
 pr_college_cornelia_promise_broken_tt:0 "The lord you promised a seat #N did not get one#!"
 pr_college_cornelia_refuse_tt:0 "The law can be brought again in ten years, and the College #N remembers the refusal#! when it next votes"
 pr_college_cornelia_collapse_tt:0 "The law #N is set aside#!: it can be brought again in five years"

 pr_college.0203.t:0 "Fifteen Pontiffs"
 pr_college.0203.desc.cooptation:0 "The law has passed. Fifteen places now stand in the College of Pontiffs, and the College has chosen the six new members itself, as it chose its members before the people ever had a say. The pontiffs are grateful. The great lords who hoped for a seat are not."
 pr_college.0203.desc.election.none:0 "The law has passed. Fifteen places now stand in the College of Pontiffs, but the electors found no great man of the realm who keeps the old gods and may take a seat, so the College filled the new seats itself after all. The old pontiffs do not forgive the law for it: the choice was taken from them once, and from now on the College must co-opt the great men of the realm before its own priests. The law changed less than it promised."
 pr_college.0203.desc.election.few:0 "The law has passed. Fifteen places now stand in the College of Pontiffs. Electors chosen from among the great men of the realm seated those great men of the old gods they could find. The College filled the remaining seats itself. The old pontiffs keep a sullen silence. The new ones know whom they have to thank."
 pr_college.0203.desc.election:0 "The law has passed. Fifteen places now stand in the College of Pontiffs, and electors chosen from among the great men of the realm have filled the six new seats with their own. The old pontiffs keep a sullen silence. The new ones know whom they have to thank."
 pr_college.0203.a:0 "A greater College for a greater realm."

 pr_college.0204.t:0 "The Veto"
 pr_college.0204.desc:0 "When the vote is called, [pr_cornelia_pontifex.GetFirstName] rises: "Veto." The law falls."
 pr_college.0204.desc.again:0 "\n\nIt is not the end. The College has given way before, at the next attempt."
 pr_college.0204.desc.final:0 "\n\nIt was the fourth time. The matter rests, and the College remembers who would not let it be."
 pr_college.0204.a:0 "Another day."
 pr_college.0204.a.tt:0 "In three years you can bring the law again with the decision #V Bring the Lex Cornelia Again#!, with a better chance. After the fourth veto the matter rests for ten years."
 pr_college.0204.a.final.tt:0 "The matter #N rests for ten years#!, and the College remembers it when it next votes"

 pr_college.0205.t:0 "The Church Answers"
 pr_college.0205.desc.head:0 "[pr_cornelia_angry_church_head.GetTitledFirstName] has not forgotten how [pr_cornelia_angry_church_head.GetHerHis] envoys were treated at my court. A new letter arrives, colder than the first: the Christians at my court are watched, and my name is spoken with contempt wherever they gather. The letter asks for amends."
 pr_college.0205.desc.nohead:0 "[pr_cornelia_angry_church_title.GetName|U] has not forgotten how its envoys were treated at my court. A new letter arrives, colder than the first: its faithful at my court are watched, and my name is spoken with contempt wherever they gather. The letter asks for amends."
 pr_college.0205.amends.tt:0 "Both Churches forgive how their envoys were treated, and a Church you played against another forgives that too, with the rulers of its Church around you"
