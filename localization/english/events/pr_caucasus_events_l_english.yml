  # --- Choose Georgian Personal Deity (0001) ---
  pr_caucasus_decision.0001.t:0 "Deciding on a Deity"
  pr_caucasus_decision.0001.desc:0 "[ROOT.Char.GetFaith.PantheonTerm|U] are many and inscrutable, yet I cannot say that there are not some who hold a level of special appeal for me. Were I to dedicate myself openly to the express worship of primarily one such deity, I would doubtless draw like-minded souls to my side.\n\nWhatever the blessings my patron provides, being with similar [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] can only bring me health, wealth, and glory."
  pr_caucasus_decision.0001.armzi:0 "Armazi, Lord of Mtskheta!"
  pr_caucasus_decision.0001.adgilis_deda:0 "Zaden, Conquering God!"
  pr_caucasus_decision.0001.kopala:0 "The Lord of Battle, Giver of Victory!"
  pr_caucasus_decision.0001.barbale:0 "The Healer, Giver of Health!"
  pr_caucasus_decision.0001.optout:0 "$religious_decision.0102.flavor$"

  # --- Choose Armenian Personal Deity (0002) ---
