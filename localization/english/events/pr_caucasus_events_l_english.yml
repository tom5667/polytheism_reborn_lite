  pr_caucasus_decision.0002.desc:0 "[ROOT.Char.GetFaith.PantheonTerm|U] are many and inscrutable, yet I cannot say that there are not some who hold a level of special appeal for me. Were I to dedicate myself openly to the express worship of primarily one such deity, I would doubtless draw like-minded souls to my side.\n\nWhatever the blessings my patron provides, being with similar [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] can only bring me health, wealth, and glory."
  pr_caucasus_decision.0002.aramazd:0 "Aramazd, Creator of Heaven and Earth!"
  pr_caucasus_decision.0002.astlik:0 "Astghik, Goddess of Love!"
  pr_caucasus_decision.0002.nane:0 "Vahagn, Giver of Bravery!"
  pr_caucasus_decision.0002.nvard:0 "Anahit, Lady of Erez!"
  pr_caucasus_decision.0002.optout:0 "$religious_decision.0102.flavor$"
