l_english:

  # --- 3rd Avesta (0001) ---
  pr_zoroastrian.0001.t:0 "3rd Avesta"
  pr_zoroastrian.0001.desc:0 "#F As the conflict recedes, a beacon of hope emerges for the Mazdayasna community. With the Arabian invaders vanquished, their lands and temples reclaimed, a collective sense of relief sweeps across the land.#!\n\nAmongst the aristocracy and priesthood, a fervent desire ignites to restore the Avesta, their sacred text, ravaged by the invaders. This ancient repository of divine wisdom, painstakingly compiled over centuries, holds immense significance \u2014 its loss a grievous blow to the Zoroastrian faith.\n\nMy head of faith [ROOT.Char.GetFaith.ReligiousHeadName], recognizing the gravity of this task, addresses the congregation with unwavering conviction: \"Fellow Mazdayasna, as we stand on the threshold of a new era, we must not let the sacred text that guided our ancestors slip into oblivion. The Avesta has been scattered and destroyed by the invaders. Now, it is time to restore what had once been lost!\""
  pr_zoroastrian.0001.a:0 "Restore the Avesta"

  # --- The New Avesta (0002) ---
  pr_zoroastrian.0002.t:0 "The New Avesta"
  pr_zoroastrian.0002.desc:0 "#F As I sit upon my throne, anticipation hangs heavy in the air. The grand hall waits in hushed silence, the congregation holding its breath, awaiting the proclamation that will mark the culmination of our arduous journey.#!\n\nSuddenly, the doors burst open. My [ROOT.Char.GetFaith.ReligiousHeadName], face ablaze with triumph, strides into the chamber. Their voice, resonating with the power of Ahura Mazda, echoes through the hall: \"Praise be, fellow Mazdayasna! The Third Avesta is now complete!\"\n\nA thunderous roar of jubilation erupts from the congregation. I join in the celebration, my heart swelling with pride. The restoration of our sacred text is not merely a theological triumph \u2014 it is a testament to our unwavering faith and resilience.\n\nThe Third Avesta, now complete, will guide us towards a new era of prosperity, enlightenment, and righteousness."
  pr_zoroastrian.0002.a:0 "Glory to $zoroastrianism_high_god_name$!"

  # --- Reinstate Middle Persian Names (0003) ---
  pr_zoroastrian.0003.t:0 "Reinstate Middle Persian Names"
  pr_zoroastrian.0003.desc:0 "#F The restoration of the Third Avesta has rekindled the flames of tradition and heritage amongst the Mazdayasna community. As the sacred text is meticulously transcribed and disseminated, the ancient Middle Persian names, once lost to the ravages of time, are resurrected from the annals of history.#!\n\nMy head of faith [ROOT.Char.GetFaith.ReligiousHeadName], recognizing the significance of these names, addresses the congregation with solemn reverence: \"Fellow Mazdayasna, as we restore the Third Avesta, we must also revive the Middle Persian names that have been lost to us.\n\nThese names, steeped in the wisdom of our ancestors, are a testament to our heritage and faith. Let us embrace them once more, and honour the legacy of our forebears!\""
  pr_zoroastrian.0003.a:0 "Reinstate Middle Persian Names"

  # --- The Sassanid Envoys (0004) ---
  pr_zoroastrian.0004.t:0 "The Sassanid Envoys"
  pr_zoroastrian.0004.desc:0 "#F The Sassanid envoys, dispatched from the newly reclaimed lands of Sistan, arrived at the [SCOPE.sC('receiver').GetHouse.GetName] court with cautious optimism. Their attire, though modest compared to the grandeur of old, bore the unmistakable symbols of the resurgent Sassanid dynasty.#!\n\nKneeling before the [SCOPE.sC('receiver').GetHouse.GetName] ruler, they presented a missive sealed with the royal signet of the Shahanshah. The message spoke of the Sassanid\u2019s determination to restore the glory of their empire. It invited the [SCOPE.sC('receiver').GetHouse.GetName] ruler to join their cause \u2014 to forge an alliance and reclaim the lands and heritage of their ancestors.\n\nThe courtiers murmured among themselves, their expressions a mix of intrigue and skepticism. The envoys, their demeanour resolute yet humble, awaited the ruler\u2019s response. This moment could mark the beginning of a new chapter in the history of the Mazdayasna faith and the Persian people."
  pr_zoroastrian.0004.a:0 "Await the response"

  # --- The Sassanid Envoys to the Dabuyids (0008) ---
  pr_zoroastrian.0008.t:0 "The Sassanid Envoys"
  pr_zoroastrian.0008.desc:0 "#F The Sassanid envoys, dispatched from the newly reclaimed lands of Sistan, arrived at the [SCOPE.sC('receiver').GetHouse.GetName] court with cautious optimism. Their attire, though modest compared to the grandeur of old, bore the unmistakable symbols of the resurgent Sassanid dynasty.#!\n\nKneeling before the [SCOPE.sC('receiver').GetHouse.GetName] ruler, they presented a missive sealed with the royal signet of the Shahanshah. The message spoke of the Sassanid\u2019s determination to restore the glory of their empire. It invited the [SCOPE.sC('receiver').GetHouse.GetName] ruler to join their cause \u2014 to forge an alliance and reclaim the lands and heritage of their ancestors.\n\nThe courtiers murmured among themselves, their expressions a mix of intrigue and skepticism. The envoys, their demeanour resolute yet humble, awaited the ruler\u2019s response. This moment could mark the beginning of a new chapter in the history of the Mazdayasna faith and the Persian people."
  pr_zoroastrian.0008.a:0 "Await the response"

  # --- The Alliance of the Faithful (0005) ---
  pr_zoroastrian.0005.t:0 "The Alliance of the Faithful"
  pr_zoroastrian.0005.desc:0 "#F The [SCOPE.sC('receiver').GetHouse.GetName] ruler rose from the throne, expression bright with determination. Addressing the envoys with a voice that rang with authority, they declared, \"We shall join forces to reclaim our shared heritage!\"#!\n\nA wave of jubilation swept through the hall. The courtiers erupted in cheers and applause. The alliance of the faithful, forged in the crucible of adversity, would now stand united against the forces of darkness \u2014 their faith and heritage intertwined in a bond that transcended time and space."
  pr_zoroastrian.0005.a:0 "We shall join forces to reclaim our shared heritage!"

  # --- No Alliance (0006) ---
  pr_zoroastrian.0006.t:0 "No Alliance"
  pr_zoroastrian.0006.desc:0 "#F The [SCOPE.sC('receiver').GetHouse.GetName] ruler rose from the throne, expression resolute but unyielding. Addressing the envoys with a voice that carried the weight of sovereignty, they declared, \"We shall stand alone in this endeavor!\"#!\n\nA wave of disappointment swept through the envoys, their expressions betraying disbelief and sorrow. The rejection was a heavy blow to the Sassanid dynasty\u2019s aspirations, casting a shadow over their hopes of unity.\n\nYet with unwavering resolve, the envoys vowed to continue their mission \u2014 determined to restore their heritage and faith, even without the support of their brethren."
  pr_zoroastrian.0006.a:0 "We shall stand alone in this endeavor!"

  # --- Failed Persuasion (0007) ---
  pr_zoroastrian.0007.t:0 "Failed Persuasion"
  pr_zoroastrian.0007.desc:0 "#F The [SCOPE.sC('receiver').GetHouse.GetName] ruler rose from the throne, face contorted with fury and indignation. Addressing the envoys with a voice that thundered through the hall, they declared, \"How dare you presume to dictate terms to this court! Your arrogance is an affront to our sovereignty!\"#!\n\nThe envoys, their faces pale with fear, attempted to stammer out an apology, but it was too late. The ruler, patience exhausted, ordered the guards to seize them.\n\n\"Let this be a lesson to all who dare insult the [SCOPE.sC('receiver').GetHouse.GetName] dynasty!\""
  pr_zoroastrian.0007.a:0 "This is not what I wanted!"
