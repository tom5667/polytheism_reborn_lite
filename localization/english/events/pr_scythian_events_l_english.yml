  # --- Choose Main Deity (0001) ---
  pr_scythian.0001.t:0 "Choose Main Deity"
  pr_scythian.0001.desc:0 "#F The gods of the steppe are many, and their favour is fickle. To guide my people through the trials ahead, I would do well to devote myself to one of the great deities of the Scythian pantheon.#!\n\nTabiti, goddess of the hearth by whom the kings swear, is first among them. Artimpasa, the heavenly Aphrodite, blesses those who earn her favour. Goitosyros, whom the Greeks call Apollo, grants prosperity to the faithful. Api, the earth and the waters, sustains the land. The Sword, honoured as Ares, guards the tribes in war.\n\nWhich path shall I walk?"
  pr_scythian.0001.papaios:0 "Tabiti, Lady of the Hearth"
  pr_scythian.0001.artimpasa:0 "Artimpasa, the Heavenly Aphrodite"
  pr_scythian.0001.gaitasura:0 "Goitosyros, the Scythian Apollo"
  pr_scythian.0001.api:0 "Api, Lady of Earth and Water"
  pr_scythian.0001.pitara_za:0 "The Sword, Ares of the Scythians"
  pr_scythian.0001.optout:0 "Maybe now isn't the right time"
