  # --- Celtic Druid Selection (0005) ---
  pr_celtic_decision.0005.t:0 "Choosing a Druid"
  pr_celtic_decision.0005.desc:0 "#F The old faith has been reformed, and a new spiritual leader must be chosen to guide the faithful. As the reformer, it falls to me to decide whether to follow the existing druid or to assert our independence.#!\n\nThe gods watch as I make this sacred decision."
  pr_celtic_decision.0005.a:0 "We shall guide our own path."
  pr_celtic_decision.0005.d:0 "We shall follow the old druid."

  # =============================================
  # Celtic Polytheism Event Loc
  # Refactored from cp_events_l_english.yml
  # Namespaces: cp_rph_decisions/rhk/ccmd/solstice/celtic -> pr_celtic
  # =============================================
  #choose your main deity event localization

  #Restore celtic Priesthood
  pr_celtic.0001.t:0 "The New [scoped_ruler.GetFaith.GetAdjective] Priesthood"
  pr_celtic.0001.desc:0 "After the interlude of exile and persecution following the Christian conquests, Celtic Polytheism has been accepted by the people of Europe as the one true path to righteousness. [scoped_ruler.GetTitledFirstName] has ordered the institution of the office of the [new_priest.GetTitleTierName], a Priest of Priests to rule over a restored clerical hierarchy.\n\nThe [new_priest.GetTitleTierName] will serve as the highest religious authority in the [scoped_ruler.GetFaith.GetAdjective] world, with powers ranging from the blessing of future military expeditions to the granting of divorces to married couples."
  pr_celtic.0001.a:0 "The power of An Dagda strengthens the celts once more!"
  pr_celtic.0002.desc.catholic:0 "The accursed followers of [scoped_ruler.GetFaith.HighGodName] have reclaimed enough land and influence to re-establish a blasphemous priesthood under the protection of [scoped_ruler.GetTitledFirstName].\n\nIf not soon stopped, these demon-worshiping pagans might turn the tide of Christian expansion in Europe, polluting the mind of their unaware subjects with lies and perversions."
  pr_celtic.0002.desc.others:0 "The strange, Celtic polytheism followers of [scoped_ruler.GetFaith.HighGodName] have reclaimed enough of their ancestral Roman territories to re-establish a functional Priesthood.\n\nIf not stopped soon, they might turn the tide of Christian expansion and restore Europe under the protection of their old gods."
  pr_celtic.0002.a:0 "Glory to [scoped_ruler.GetFaith.HighGodName]!"
  pr_celtic.0002.b:0 "Their demons will not shield them from the might of [ROOT.Char.GetFaith.HighGodName]!"
  pr_celtic.0002.c:0 "... Celtic gods worshiping?"


  pr_celtic.0100.t:0 "Creating kingdom"
  pr_celtic.0100.desc:0 "After years of fighting between all the Irish tribes and keeping out invaders, It's finally time to Restore Ardrí na hÉireann also known as The Irish high kingdom."
  pr_celtic.0100.a:0 "Ardrí na hÉireann is once more"
  pr_celtic.0200.t:0 "Choose main deity"
  pr_celtic.0200.desc:0 "To help me in the struggle to rule my realm I could devote to one of the gods or goddesses."
  pr_celtic.0200.an_dagda:0 "An Dagda"
  pr_celtic.0200.lugh:0 "Lugh"
  pr_celtic.0200.brigid:0 "Brigid"
  pr_celtic.0200.nemain:0 "Nemain"
  pr_celtic.0200.ecna:0 "Ecna"
  pr_celtic.0200.optout:0 "Maybe now isn't the right time"

  pr_celtic.0201.t:0 "Choose main deity"
  pr_celtic.0201.desc:0 "To help me in the struggle to rule my realm I could devote to one of the gods or goddesses."
  pr_celtic.0201.taranis:0 "Taranis"
  pr_celtic.0201.lugus:0 "Lugus"
  pr_celtic.0201.arianrhod:0 "Arianrhod"
  pr_celtic.0201.andraste:0 "Andraste"
  pr_celtic.0201.brigantia:0 "Brigantia"
  pr_celtic.0201.optout:0 "Maybe now isn't the right time"

  pr_celtic.0202.t:0 "Choose main deity"
  pr_celtic.0202.desc:0 "To help me in the struggle to rule my realm I could devote to one of the gods or goddesses."
  pr_celtic.0202.toutatis:0 "Toutatis"
  pr_celtic.0202.lughus:0 "Lughus"
  pr_celtic.0202.rosmerta:0 "Rosmerta"
