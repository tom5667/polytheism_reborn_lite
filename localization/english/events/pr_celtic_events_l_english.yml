  pr_celtic.0300.t:0 "Tairisem"
  pr_celtic.0300.desc:0 "Midwinter, time to start festivities for the goddess of the sun Éatain Eachraidhe may she melt away the snow so we can start working on our fields again."
  pr_celtic.0300.a:0 "Gather the realm for the Solstice"

  pr_celtic.0301.t:0 "Gheimhridh"
  pr_celtic.0301.desc:0 "Middwinter, time to start festivities for the goddess of the sun Rhiannon may she melt away the snow so we can start working on our fields again."
  pr_celtic.0301.a:0 "Gather the realm for the Solstice"

  pr_celtic.0302.t:0 "Winter Solstice"
  pr_celtic.0302.desc:0 "Middwinter, time to start festivities for the goddess of the sun Epona may she melt away the snow so we can start working on our fields again."
  pr_celtic.0302.a:0 "Gather the realm for the Solstice"

  pr_celtic.0303.t:0 "Tairisem"
  pr_celtic.0303.desc:0 "Finally mid-summer, time to start festivities for the goddess of the sun Éatain Eachraidhe to banish the demons and evil spirits from the land.\nMay her warmth grant us good harvest and may relationships be blessed."
  pr_celtic.0303.a:0 "Gather the realm for the Solstice"

  pr_celtic.0304.t:0 "Alban Hefin"
  pr_celtic.0304.desc:0 "Finaly mid-summe, time to start festivities for the goddess of the sun Rhiannon to banish the demons and evil spirits from the land.\nMay her warmth grant us good harvest and may relationships be blessed."
  pr_celtic.0304.a:0 "Gather the realm for the solstice"

  pr_celtic.0305.t:0 "Summer Solstice"
  pr_celtic.0305.desc:0 "Finaly mid-summer, time to start festivities for the goddess of the sun Epona to banish the demons and evil spirits from the land.\nMay her warmth grant us good harvest and may relationships be blessed."
  pr_celtic.0305.a:0 "Gather the realm for the solstice"

  #Embrace Manx culture
  pr_celtic.0400.t:0 "Embrace Manx Culture"
  pr_celtic.0400.desc:0 "For far to long we lost the old virtues of the isle of Man."
  pr_celtic.0400.a:0 "Embrace the Manx culture"

  #Embrace Eburones culture
  pr_celtic.0401.t:0 "Embrace Eburones Culture"
  pr_celtic.0401.desc:0 "For far to long we lost the old virtues of the old Eburones Like Ambiorix and Cativolcus."
  pr_celtic.0401.a:0 "Embrace the Eburones culture"

  #Embrace Gaulish culture
  pr_celtic.0402.t:0 "Embrace Gaulish Culture"
  pr_celtic.0402.desc:0 "For far to long we lost the old virtues of the Gauls."
  pr_celtic.0402.a:0 "Embrace the Gaulish culture"
  #Celtic Empire
  pr_celtic.0403.t:0 "Celtic Empire"
  pr_celtic.0403.desc:0 "By the glory of the celtic gods finally our Celtic Brothers and Sisters are united under one banner, finally the Sassenach's are gone from our Islands"
  pr_celtic.0403.a:0 "The Celtic lands are United"

  pr_celtic.0404.t:0 "Druidic Circle"
  pr_celtic.0404.desc:0 "We stand at an cross point of a new faith. My fellow [ROOT.Char.GetFaith.GetAdherentNamePlural] certainly don't expect me to declare our submission to the existing druidic circle.\n\nYet, perhaps by pledging allegiance to the old Druidic circle we stand stronger against our enemies..."
  pr_celtic.0404.a:0 "$head_of_faith.0021.a$"
  pr_celtic.0404.d:0 "We must continue cleaving to [old_druid.GetFaith.GetAdjectiveNoTooltip] authority!"
  pr_celtic.0404.rejection_body:0 "rejects the pledge"
  pr_celtic.0404.acceptance_body:0 "accepts the pledge"
  pr_celtic.0404.rejection.outcome:0 "You are forced to take your own path regardless"
  pr_celtic.0404.d.rejection:0 "@piety_level_0_icon_pagan! [old_druid.GetTitledFirstNameNoTooltip] $pr_celtic.0404.rejection_body$"
  pr_celtic.0404.d.acceptance:0 "@piety_level_3_icon_pagan! [old_druid.GetTitledFirstNameNoTooltip] $pr_celtic.0404.acceptance_body$"

  pr_celtic.0408.t:0 "Arival Uisneach"
  pr_celtic.0408.desc:0 "It took quite a bit of traveling but finally... We're here! The holy hill of Uisneach. let's get up the hill and set camp. Maybe we can explore a little while the servants are setting up camp."
  pr_celtic.0408.a:0 "Get to the Top"

  pr_celtic.0409.t:0 "Uisneach"
  pr_celtic.0409.desc.zealous:0 "We're getting closer to the top of the hill, my guards however are still lagging behind, their armor makes the climb a bit more intense. This is a place every worshiper of Tuatha De needs to visit at least once in their lifetime. It is said that the Druids here foretold the future, the affairs of the realm and sacrificed beasts to please the gods. Even standing here makes me feel as though the winds carry the gods' words into my ears."
  pr_celtic.0409.desc.uisneach:0 "Finally at top of the hill, the place where the Druids resided and where the festival of Bealtaine would be held. I can see the camp from here. The feels... pleasant. I'm sure no one would mind if I took a small nap... Right?"

  pr_celtic.0409.a:0 "It's good to be faithful"

  pr_celtic.0410.t:0 "Travel Back Home"
  pr_celtic.0410.desc:0 "Time to go back home, revitalized by the knowledge of the great Druids' and the divine presence of $gaelic_polytheism_high_god_name$. I would love to remain and absorb more of the scenery, but I have a realm to govern."
  pr_celtic.0410.a:0 "Great to be Back Home Again"

  #Embrace Brythonic culture
  pr_celtic.0412.t:0 "Embrace Brythonic Culture"
  pr_celtic.0412.desc:0 "I have always felt a connection to the ancient Brythonic culture. I have read stories of their bravery and their strength, and I have always admired them. But for centuries, the Brythonic culture has been suppressed. The Romans invaded our lands and forced their culture upon us and after that the Saxons came. But now, at last, we have a chance to reclaim our heritage."
  pr_celtic.0412.a:0 "Embrace the Brythonic culture"

  pr_celtic.0413.t:0 "Push Out The Sassenach"
  pr_celtic.0413.desc:0 "Our celtic lands are invaded over and over again by those Germanic people, they raid our lands come and go whenever they want over and over again.\n\nWe need to act now and push them out bit by bit!"
  pr_celtic.0413.a:0 "For [ROOT.Char.GetFaith.HighGodName]!"

  pr_celtic.0414.t:0 "The Reconquest Saga"
  pr_celtic.0414.desc.eire:0 "Years of fighting vikings and other Irish tribes our reconquest is off to a good start, now our island is safe we can look at invading our next target.\n\nBut first it's time enjoy the moment that Ardrí na hÉireann also known as The Irish high kingdom is back in Celtic hands."
  pr_celtic.0414.desc.alba:0 "Scotland was never conquered by the Romans, but nevertheless we have Sassenach invasions, by creating the kingdom of Scotland we can protect ourself better against invasions. When Scotland, Ireland and Wales are under one banner we can invade england or better said in Scottish gaelic Sasainn"
  pr_celtic.0414.desc.wales:0 "Wales conquered by the romans, reconquered by the Scottish tribes after the fall of the Roman Empire. Now combined under the banner of Wales."
  pr_celtic.0414.desc.albion:0 "Victory at last, all Sassenach are gone, the lands of our ancestors are finally free.\n\nYou would think this is our final stop but no, we Celts once ruled the lands of what is now ruled by frankish kings and emperors.\nIt's within our right to reconquer those lost territories and bring back the golden age for the Celtic people!"
  pr_celtic.0414.desc.brittany:0 "Our celtic ancestors fled across the channel for the Sassenach centuries ago, now they give us a new foothold on the mainland."
  pr_celtic.0414.desc.galicia:0 "A few centuries ago our Caledonian ancestors fled to these lands for safety against the sassenachs, even though it's some time ago we should feel at home here. From here the road is open to the old Celtiberian lands!"
  pr_celtic.0414.desc.pr_belgae:0 "The of Belgae once proud defenders of the Celtic world, the most famous of all Ambiorix who rebelled against Roman rule."
  pr_celtic.0414.desc.celtica:0 "Celtica, Vercingetorix once ruled these lands as leader of the combined pr_gaulish tribes ready to fight of the the Romans. He ended up in Rome in a prison\nNow with the most of the old Celtic lands under control it's up to us to decide what happens next"


  pr_celtic.0414.a:0 "Onwards!"
  pr_celtic.0414.b:0 "Onwards!"
  pr_celtic.0414.c:0 "Onwards!"
  pr_celtic.0414.d:0 "May [ROOT.Char.GetFaith.WarGodName] guide us forward !"
  pr_celtic.0414.e:0 "Onwards!"
  pr_celtic.0414.f:0 "Our pr_iberian foothold is back"
  pr_celtic.0414.g:0 "May the mighty Belgae return"
  pr_celtic.0414.h:0 "[ROOT.Char.GetFaith.HighGodName] be Praised!"

  pr_celtic.0415.t:0 "The Celtic Empire"
  pr_celtic.0415.desc:0 "After reconquest of the islands, the kingdoms of Ireland, Scotland, Wales and England are united but also still separated.\n\nEvery year the most notable lords come together to speak about the future. And now to bring stability to the realms it's important to bring the kingdoms under one complete realm like the Romans did.\n\n The most influenceable leader of the lords stood up from his chair and said "Today my lord we want to ask you to take the Crown of the united Celtic Empire, with all it's duties and powers. Will you accept this honor? What will be your answer?"  "
  accepted_crown_of_celtic_empire_effect_tooltip:0 "Accept the crown of the Celtic Empire"
  pr_celtic.0415.a:0 "A normal coronation is sufficient"
  #pr_celtic.0415.b:0 "Ask the Arch druid to coronate you"
  pr_celtic.0415.c:0 "Not yet"

  pr_celtic.0416.t:0 "Embrace the Old Irish culture"
  pr_celtic.0416.desc:0 "Long we have strayed away from the old irish gods, as we want to bond again with the gods, it's important to delve into our old traditions.\nThis also means we need to get rit of our christian names and change them to proper old irish ones."
  pr_celtic.0416.a:0 "Embrace the Old Irish culture"

  pr_celtic.0417.t:0 "Druidic circle"
  pr_celtic.0417.desc:0 "The echoes of a long-forgotten age resonate once again. Anglesey, a land long abandoned, is now back in the hands of the Celtic peoples. With the island reclaimed, ancient rituals are being restored and the druidic circle is being reborn. The first new druids have broken the silence and begun their studies, so that one day they might once again explain the gods' sacred words to the people. Their task is to restore Celtic polytheism, the faith in [ROOT.Char.GetFaith.HighGodName] and the others, and to lead the people back to the old ways."
  pr_celtic.0417.a:0 "May [ROOT.Char.GetFaith.HighGodName] be praised!"

  pr_celtic.0419.t:0 "A sacred Duty"
  pr_celtic.0419.desc:0 "Today is a special day, I can send one of my children to the druidic circle to become a druid, this is a sacred duty and honor for the whole family.\n\nThe druids are the spiritual leaders of our people, they interpret the will of the gods, lead rituals and ceremonies, and provide guidance to the community.\n\nBy sending one of my children to become a druid, I am ensuring that our family has a direct connection to the divine and that we will always have someone who can help us navigate the challenges of life."
  pr_celtic.0419.a:0 "Send a child to the druidic circle"
  pr_celtic.0419.cancel:0 "Maybe not now"

  pr_celtic.0420.t:0 "The New Druidic Leader"
  pr_celtic.0420.desc:0 "After the death of the last Druidic leader, a new leader has been chosen by the Druids. Hopefully he will stay in office for a long time and keep the ancient knowledge alive."
  pr_celtic.0420.a:0 "Praise [ROOT.Char.GetFaith.HighGodName] !"



  pr_celtic.0421.t:0 "A vassal dispute"
  pr_celtic.0421.desc:0 "A bitter dispute over land rights and sworn oaths has erupted between two of my most powerful vassals, [vassal_1.GetTitledFirstName] and [vassal_2.GetTitledFirstName]. My own laws offer a clumsy solution at best, and any judgment I make is sure to anger one of them.\n\nMy court druid, [druidic_leader.GetFirstName], has approached me with a solution. 'My lord,' [druidic_leader.GetSheHe] says calmly, 'these matters are tangled in traditions that predate your laws. The ancient ways of our people have clear precedents for such things. Allow me to mediate. I will render a judgment according to the sacred laws that have guided our people for generations, a judgment that both must accept.'"
  pr_celtic.0421.a:0 "Very well, let the old laws decide this."
  pr_celtic.0421.b:0 "I will not have my authority undermined."

  pr_celtic.0422.t:0 "The Druid's Judgment"
  pr_celtic.0422.desc:0 "After days of hearing testimony and reciting ancient legal verses from memory, my court druid [druidic_leader.GetFirstName] has rendered [druidic_leader.GetHerHis] judgment. The ruling is complex, weaving together precedent, spiritual obligation, and a deep understanding of the land itself. It is a solution I would never have conceived of.\n\n[vassal_1.GetTitledFirstName] and [vassal_2.GetTitledFirstName] listen intently. As the final words are spoken, a silence falls over the court. Then, to my surprise, both nod in acceptance. The matter is settled, not by the sword, but by the weight of tradition."
  pr_celtic.0422.a:0 "A wise and fair judgment."

  pr_celtic.0423.t:0 "The Fading Verse"
  pr_celtic.0423.desc:0 "My court druid, [court_druid.GetFirstName], has requested an audience, a look of deep concern on [court_druid.GetHerHis] face. 'My lord,' [court_druid.GetSheHe] begins, 'our knowledge is a library carried in memory. The genealogies of kings, the laws of the land, the cycles of the stars, and the stories of the gods... all are held in verse, passed from teacher to student. But we are few, and memories can fail.'\n\n'I fear that if we do not act, this great ocean of knowledge will evaporate. I ask for your patronage to establish a school, a place where I can dedicate myself to training a new generation. It is a process that takes twenty years for a single student, but it is the only way to ensure our past is not forgotten.'"
  pr_celtic.0423.a:0 "An excellent idea. You have my support."
  pr_celtic.0423.b:0 "We have more pressing concerns."

  pr_celtic.0424.t:0 "The Assembly at Tara"
  pr_celtic.0424.desc:0 "The title of High King of Ireland, the Ardrí, is not one of inheritance, but of acclaim and strength. With the loyalty of the clans wavering, the great rulers of Éire have gathered at the sacred Hill of Tara to choose who among them is worthy to lead.\n\nI have made my ambitions clear, and my name is spoken with both respect and fear. Now is the time to formally declare my claim before the assembly. The other chieftains will be forced to acknowledge my supremacy, or challenge it."
  pr_celtic.0424.a:0 "It is my destiny to rule as High King."

  pr_celtic.0425.t:0 "The High King's Demand"
  pr_celtic.0425.desc:0 "[new_high_king.GetTitledFirstName] has been proclaimed the new Ardrí, the High King of all Ireland. From the peak of the Hill of Tara, [new_high_king.GetSheHe] now demands that all other rulers of the isle acknowledge [new_high_king.GetHerHis] authority.\n\nA messenger bearing the High King's standard has arrived in my court. The message is simple: I am to become a tributary, contributing to the High King's wealth and power, or I will be made an example of. My warriors look to me, their hands resting on the hilts of their swords, awaiting my command."
  pr_celtic.0425.a:0 "I will bend the knee. It is wiser to pay tribute than to spill blood."
  pr_celtic.0425.b:0 "I answer to no king but myself! To war!"
