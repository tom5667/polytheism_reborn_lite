  pr_celtic.0203.t:0 "Choose main deity"
  pr_celtic.0203.desc:0 "To help me in the struggle to rule my realm I could devote to one of the gods or goddesses."
  pr_celtic.0203.reue:0 "$pr_celtic_iberian_polytheism_high_god_name$"
  pr_celtic.0203.arancia:0 "$pr_celtic_iberian_polytheism_health_god_name$"
  pr_celtic.0203.nabia:0 "$pr_celtic_iberian_polytheism_fertility_god_name$"
