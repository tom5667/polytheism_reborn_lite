l_english:
  # =============================================
  # Polytheism Reborn - Mesopotamian Events
  # Localization for pr_mesopotamian_decision_events.txt
  # =============================================

  # --- Embrace Babylonian Culture (0001) ---
  pr_mesopotamian.0001.t:0 "Embrace Babylonian Culture"
  pr_mesopotamian.0001.desc:0 "#F Babylon, jewel of the Mesopotamian plain, has stood as a beacon of learning and power since the dawn of civilization.#!\n\nBy embracing the [culture|E] of my Babylonian forebears, I shall reclaim the legacy of Hammurabi and the kings who shaped the world between the rivers."
  pr_mesopotamian.0001.a:0 "I am Babylonian"

  # --- Embrace Assyrian Culture (0002) ---
  pr_mesopotamian.0002.t:0 "Embrace Assyrian Culture"
  pr_mesopotamian.0002.desc:0 "#F Assyria, land of conquest and empire, was forged in the crucible of war.#!\n\nBy embracing the [culture|E] of my Assyrian forebears, I shall reclaim the legacy of Ashur and the kings who stretched the boundaries of the known world."
  pr_mesopotamian.0002.a:0 "I am Assyrian"

  # --- Embrace Sumerian Culture (0003) ---
  pr_mesopotamian.0003.t:0 "Embrace Sumerian Culture"
  pr_mesopotamian.0003.desc:0 "#F Sumer, the cradle of cities and the first written word, holds the memory of the oldest civilization of the Mesopotamian plain.#!\n\nBy embracing the [culture|E] of my Sumerian forebears, I shall reclaim the legacy of Gilgamesh and the kings who raised the first ziggurats."
  pr_mesopotamian.0003.a:0 "I am Sumerian"

  # --- Choose Main Deity: Babylonian (0100) ---
  pr_mesopotamian.0100.t:0 "Choose Main Deity"
  pr_mesopotamian.0100.desc:0 "#F The gods of Babylon are ancient and terrible, and their favour is not given lightly. To guide my people through the trials ahead, I would do well to devote myself to one of the great deities of the Mesopotamian pantheon.#!\n\nMarduk, king of the gods and patron of Babylon, commands the storms and ordains the fate of kings. Ishtar, goddess of love and war, rides into battle at the head of armies. Ninhegal, lady of healing, wards off sickness and plague. Nabu, scribe of the gods, grants wisdom and mastery of the written word. Nergal, lord of plague and the underworld, brings death to the enemies of the faithful.\n\nWhich path shall I walk?"
  pr_mesopotamian.0100.marduk:0 "Marduk, King of the Gods"
  pr_mesopotamian.0100.ishtar:0 "Ishtar, Lady of Love and War"
  pr_mesopotamian.0100.ninhegal:0 "Ninhegal, Lady of Healing"
  pr_mesopotamian.0100.nabu:0 "Nabu, Scribe of the Gods"
  pr_mesopotamian.0100.nergal:0 "Nergal, Lord of Plague and the Underworld"
  pr_mesopotamian.0100.optout:0 "Maybe now isn't the right time"

  # --- Choose Main Deity: Assyrian (0101) ---
  pr_mesopotamian.0101.t:0 "Choose Main Deity"
  pr_mesopotamian.0101.desc:0 "#F The gods of Assyria demand devotion, and the empire endures only so long as their favour is upheld. To lead my people in war and in peace, I would do well to devote myself to one of the great deities of the Mesopotamian pantheon.#!\n\nAshur, chief god of Assyria and lord of the empire, grants victory to those who march in his name. Ishtar, goddess of love and war, arms the faithful for battle. Ninhegal, lady of healing, shields the people from sickness. Nabu, scribe of the gods, bestows wisdom upon the worthy. Ninkarrak, goddess of healing and protection, watches over the sick and the weak.\n\nWhich path shall I walk?"
  pr_mesopotamian.0101.ashur:0 "Ashur, Lord of the Empire"
  pr_mesopotamian.0101.ishtar:0 "Ishtar, Lady of Love and War"
  pr_mesopotamian.0101.ninhegal:0 "Ninhegal, Lady of Healing"
  pr_mesopotamian.0101.nabu:0 "Nabu, Scribe of the Gods"
  pr_mesopotamian.0101.ninkarrak:0 "Ninkarrak, Goddess of Healing"
  pr_mesopotamian.0101.optout:0 "Maybe now isn't the right time"

  # --- Choose Main Deity: Sumerian (0102) ---
  pr_mesopotamian.0102.t:0 "Choose Main Deity"
  pr_mesopotamian.0102.desc:0 "#F The gods of Sumer are the oldest of all, and their names were spoken in the first cities raised upon the earth. To guide my people in the ways of the ancients, I would do well to devote myself to one of the great deities of the Sumerian pantheon.#!\n\nEnlil, lord of wind and king of the gods, decrees the fate of the world. Inanna, goddess of love and war, is fiercer than any storm. Ninhegal, lady of healing, wards off sickness and despair. Nisaba, goddess of grain and writing, measures the harvest and the record alike. Ninurta, god of war and the southern wind, defends the order of creation.\n\nWhich path shall I walk?"
  pr_mesopotamian.0102.enlil:0 "Enlil, Lord of Wind and King of the Gods"
  pr_mesopotamian.0102.inanna:0 "Inanna, Lady of Love and War"
  pr_mesopotamian.0102.ninhegal:0 "Ninhegal, Lady of Healing"
  pr_mesopotamian.0102.nisaba:0 "Nisaba, Lady of Grain and Writing"
  pr_mesopotamian.0102.ninurta:0 "Ninurta, Lord of War and the Storm"
  pr_mesopotamian.0102.optout:0 "Maybe now isn't the right time"

  # --- Open First Brewery (0200) ---
  pr_mesopotamian.0200.t:0 "The First Brewery"
  pr_mesopotamian.0200.desc:0 "#F Mesopotamia is the cradle of beer, where the first grains were brewed into drink fit for gods and kings alike.#!\n\nThe artisans of my court have perfected the ancient craft, and the brewery stands ready to honour Ninkasi, the lady of beer, with every barrel it produces."
  pr_mesopotamian.0200.a:0 "Let the beer flow!"
