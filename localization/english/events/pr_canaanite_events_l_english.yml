l_english:

  # --- Build Temple to Tanit (0001) ---
  pr_canaanite.0001.t:0 "The Temple of Tanit"
  pr_canaanite.0001.desc:0 "#F The finest architects and artisans of the realm have been called upon to raise a new temple in Tunis, dedicated to Tanit, goddess of the moon and protector of Carthage.#!\n\nThe foundations are laid, the stones are cut, and the sacred fire is ready to be kindled. When the temple is complete, the goddess will have a dwelling place among her people once more."
  pr_canaanite.0001.a:0 "Build the temple"

  # --- Choose Punic Main Deity (0100) ---
  pr_canaanite.0100.t:0 "Choose Main Deity"
  pr_canaanite.0100.desc:0 "#F To help me in the struggle to rule my realm, I could devote myself to one of the gods or goddesses.#!"
  pr_canaanite.0100.baal:0 "Baal Hammon"
  pr_canaanite.0100.tanit:0 "Tanit"
  pr_canaanite.0100.astarte:0 "Astarte"
  pr_canaanite.0100.melqart:0 "Melqart"
  pr_canaanite.0100.kusor:0 "Kusor"
  pr_canaanite.0100.optout:0 "Maybe now isn't the right time"

  # --- Choose Semitic Main Deity (0200) ---
  pr_canaanite.0200.t:0 "Choose Main Deity"
  pr_canaanite.0200.desc:0 "#F To help me in the struggle to rule my realm, I could devote myself to one of the gods or goddesses.#!"
  pr_canaanite.0200.ba_al_hadad:0 "Baal"
  pr_canaanite.0200.ashera:0 "Astarte"
  pr_canaanite.0200.dagan:0 "Dagon"
  pr_canaanite.0200.el_elyon:0 "Taautos"
  pr_canaanite.0200.ashtart:0 "Reshef"
  pr_canaanite.0200.optout:0 "Maybe now isn't the right time"

  # --- Opening Temple (0002) ---

  # --- Offering to Baal Hammon (0003) ---
  pr_canaanite.0003.t:0 "Offering to Baal Hammon"
  pr_canaanite.0003.desc:0 "#F The priests of Baal Hammon have called for a great offering to be made to the god, that he may bless us with his favour and protection.#!\n\nThe fires are ready, the incense is lit, and the people await. I shall offer a sacrifice worthy of the lord of the heavens."
  pr_canaanite.0003.a:0 "Offer a great sacrifice to Baal Hammon"

  # --- Visiting Temple of Tanit (0005) ---
  pr_canaanite.0005.t:0 "Visiting the Temple of Tanit"
  pr_canaanite.0005.desc:0 "#F Today is a day of celebration, as the temple of Tanit is open to the public. The priests have prepared a grand feast and invited all the citizens to come and pay their respects.#!\n\nI will attend the festivities and ask the priests to make offerings to Tanit on my behalf."
  pr_canaanite.0005.a:0 "Ask the priests to make an offering"
  pr_canaanite.0005.message.positive:0 "Favoured by Tanit"
  pr_canaanite.0005.message.negative:0 "Unfavoured by Tanit"
