  pr_baltic_decision.0002.dievs:0 "Dievs, God of the Latvians!"
  pr_baltic_decision.0002.jumis:0 "Lopu māte, Mother of the Herds!"
  pr_baltic_decision.0002.perkons:0 "Pērkons, the Thunderer!"
