  # =============================================

  # --- Choose Lithuanian Personal Deity (0001) ---
  pr_baltic_decision.0001.t:0 "Deciding on a Deity"
  pr_baltic_decision.0001.desc:0 "[ROOT.Char.GetFaith.PantheonTerm|U] are many and inscrutable, yet I cannot say that there are not some who hold a level of special appeal for me. Were I to dedicate myself openly to the express worship of primarily one such deity, I would doubtless draw like-minded souls to my side.\n\nWhatever the blessings my patron provides, being with similar [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] can only bring me health, wealth, and glory."
  pr_baltic_decision.0001.dievas:0 "Andajus, God of the Lithuanians!"
  pr_baltic_decision.0001.dalia:0 "The Giver of Plenty, Bringer of Wealth!"
  pr_baltic_decision.0001.perkunas:0 "Perkūnas, the Thunderer!"
  pr_baltic_decision.0001.zemyna:0 "Žemyna, Mother of the Earth!"
  pr_baltic_decision.0001.saule:0 "Saulė, the Sun!"
  pr_baltic_decision.0001.optout:0 "$religious_decision.0102.flavor$"

