solstice_summer_decision:0 "Hold Summer Solstice"
solstice_summer_decision_tooltip:1 "Hold Summer Solstice"
solstice_summer_decision_desc:0 "As the winds begin to chill and the Seas begin to rise, A stormy Horizon looks to the people of the [ROOT.Char.GetPrimaryTitle.GetName], In order to ensure a bountiful harvest and for keeping the realm united, I must convene an audience with the gods before the Winter-Spirits arrive and Snow covers the land."
