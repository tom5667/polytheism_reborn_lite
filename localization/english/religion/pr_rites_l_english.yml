#####################
# Rites (1.20): per rite <key>, _adj, _adherent, _adherent_plural, _desc
# plus de niet-hervormde variant: _old, _old_adj, _old_adherent, _old_adherent_plural, _old_desc
# (rite-naam = rite-sleutel, zie common/religion/rite_types/_rite_types.info)
# Naamgeving: <naam>_rites (bv. gaelic_rites, dacian_rites, scythian_rites); Romeins: cultus_deorum_rites.
# Conventie: ALLE rite-naamsleutels staan in dit bestand (zie Rules/religion_rules.md, sectie Rites).
# Startwaarden = de bestaande faith-teksten; pas naar wens aan.
#####################

 # cultus_deorum_rites (faith: roman_polytheism)
 cultus_deorum_rites:0 "Roman"
 cultus_deorum_rites_adj:0 "Roman"
 cultus_deorum_rites_adherent:0 "Roman Polytheist"
 cultus_deorum_rites_adherent_plural:0 "Roman Polytheists"
 cultus_deorum_rites_desc:0 "The Roman faith, also known as Cultus Deorum or Cult of the Gods, was the most common form of pre-Christian Rome taking influence from both of its neighbors, Greek Polytheism and the Etruscan faith. Despite having many similarities with the Greeks, the Roman faith was primarily based on ancestral worship and justice."
 cultus_deorum_rites_old:0 "Old Roman"
 cultus_deorum_rites_old_adj:0 "Old Roman"
 cultus_deorum_rites_old_adherent:0 "Old Roman Polytheist"
 cultus_deorum_rites_old_adherent_plural:0 "Old Roman Polytheists"
 cultus_deorum_rites_old_desc:0 "The Roman faith, also known as Cultus Deorum or Cult of the Gods, was the most common form of pre-Christian Rome taking influence from both of its neighbors, Greek Polytheism and the Etruscan faith. Despite having many similarities with the Greeks, the Roman faith was primarily based on ancestral worship and justice."

 # gaelic_rites (faith: eriu_polytheism)
 gaelic_rites:0 "Gaelic"
 gaelic_rites_adj:0 "Gaelic"
 gaelic_rites_adherent:0 "Gaelic polytheist"
 gaelic_rites_adherent_plural:0 "Gaelic polytheists"
 gaelic_rites_desc:0 "Deep within the Emerald Isle, the ancient Gaelic faith endures. Here, reverence for deities like the Dagda (god of prosperity) and Ériu (goddess of the land) ensures bountiful harvests. But the faith extends beyond these major gods. The Tuatha Dé Danann, powerful spirits of the Otherworld, are appeased for guidance and blessings, while even the mischievous Leprechauns are acknowledged to bring good fortune."
