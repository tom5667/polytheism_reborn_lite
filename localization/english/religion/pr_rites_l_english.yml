 gaelic_rites_old_desc:0 "Deep within the Emerald Isle, the ancient Gaelic faith endures. Here, reverence for deities like the Dagda (god of prosperity) and Ériu (goddess of the land) ensures bountiful harvests. But the faith extends beyond these major gods. The Tuatha Dé Danann, powerful spirits of the Otherworld, are appeased for guidance and blessings, while even the mischievous Leprechauns are acknowledged to bring good fortune."

 # brythonic_rites (faith: pritani_polytheism)
 brythonic_rites:0 "Brythonic"
 brythonic_rites_adj:0 "Brythonic"
 brythonic_rites_adherent:0 "Brythonic polytheist"
 brythonic_rites_adherent_plural:0 "Brythonic polytheists"
 brythonic_rites_desc:0 "In Britain, the Brythonic gods are called upon through rites at sacred wells and hilltop shrines, sought for protection of the land, victory in war, and the favor of the Otherworld."
 brythonic_rites_old:0 "Old Brythonic"
 brythonic_rites_old_adj:0 "Old Brythonic"
 brythonic_rites_old_adherent:0 "Old Brythonic polytheist"
 brythonic_rites_old_adherent_plural:0 "Old Brythonic polytheists"
 brythonic_rites_old_desc:0 "Before Rome's eagles crossed the Channel, the Brythonic tribes honored their gods through rites at sacred wells and hillforts alone, bound by druidic wisdom passed down through generations."

