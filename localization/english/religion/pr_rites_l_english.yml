 babylonian_rites_adherent:0 "Babylonian Polytheist"
 babylonian_rites_adherent_plural:0 "Babylonian Polytheists"
 babylonian_rites_desc:0 "The native faith of the Akkadian and Babylonian people who rose up around the 3rd and 2nd millenniums BC following the decline of Sumer and subjugated the lands of Mesopotamia before being conquered by the Achaemenid Empire.  Their faith revolved around patron gods of city states, allowing the usurpation of one over the other and seeing their kings take center stage as bringers of prosperity."
