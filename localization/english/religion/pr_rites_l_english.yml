 # dacian_rites (faith: daco_thracian_polytheism) - main rite, god names from the religion-level localization block
 dacian_rites:0 "Thracian"
 dacian_rites_adj:0 "Thracian"
 dacian_rites_adherent:0 "Thracian Polytheist"
 dacian_rites_adherent_plural:0 "Thracian Polytheists"
 dacian_rites_desc:0 "Herodotus wrote that the Thracians honoured \"Ares, Dionysus and Artemis\", while their kings swore by Hermes alone and called him their ancestor. These were Greek names for Thracian gods. We meet them under their own names in later inscriptions: the sky and thunder god Zbelsurdos, Bendis, whose night festival with a torch race on horseback was celebrated in Athens, Sabazios, the Great Gods of the royal city of Seuthopolis, Darzalas of Odessos and the Thracian Rider."
 dacian_rites_old:0 "Old Thracian"
 dacian_rites_old_adj:0 "Old Thracian"
 dacian_rites_old_adherent:0 "Old Thracian Polytheist"
 dacian_rites_old_adherent_plural:0 "Old Thracian Polytheists"
 dacian_rites_old_desc:0 "Before Rome came to Thrace, the Odrysian kings and the mountain tribes honoured their gods at high sanctuaries, such as the oracle of Dionysus among the Satrae, where the Bessi served as prophets and a priestess spoke the oracle as at Delphi."

 # zalmoxism_rites (faith: daco_thracian_polytheism) - Getic cult of Zalmoxis (Herodotus 4.93-96)
 zalmoxism_rites:0 "Zalmoxian"
 zalmoxism_rites_adj:0 "Zalmoxian"
 zalmoxism_rites_adherent:0 "Zalmoxian"
 zalmoxism_rites_adherent_plural:0 "Zalmoxians"
 zalmoxism_rites_desc:0 "Herodotus called the Getae \"the bravest and most just of the Thracians\". They believed they did not die but went to Zalmoxis, whom some of them called Gebeleizis, and every few years they cast a messenger onto three spears to carry their requests to him. Plato tells of Thracian physicians of Zalmoxis who healed body and soul together, and Strabo of the priest Decaeneus, counsellor of King Burebista, on the holy mountain Kogaionon. Whether Zalmoxis and Gebeleizis were one god is still debated: Mircea Eliade saw in Gebeleizis a separate god of the sky and the storm, perhaps the Thracian Zbelsurdos."
 zalmoxism_rites_old:0 "Old Zalmoxian"
 zalmoxism_rites_old_adj:0 "Old Zalmoxian"
 zalmoxism_rites_old_adherent:0 "Old Zalmoxian"
 zalmoxism_rites_old_adherent_plural:0 "Old Zalmoxians"
 zalmoxism_rites_old_desc:0 "Long before Rome's legions crossed the Danube, the Getae and Dacians held that death was only a journey to Zalmoxis, where they would live forever."

 # scythian_rites (faith: scythian_religion) - god names from the religion-level localization block
 scythian_rites:0 "Scythian"
 scythian_rites_adj:0 "Scythian"
 scythian_rites_adherent:0 "Scythian Polytheist"
 scythian_rites_adherent_plural:0 "Scythian Polytheists"
 scythian_rites_desc:0 "Herodotus wrote that the Scythians honoured $scythian_polytheism_household_god_name$, goddess of the hearth, above all others, and after her $scythian_polytheism_creator_god_name$ and $scythian_polytheism_fertility_god_name$, the sky and the earth. They raised no statues, altars or temples, save to their god of war: in every district they heaped up a great mound of brushwood, crowned it with an ancient iron sword, and offered horses and cattle to it."
 scythian_rites_old:0 "Old Scythian"
 scythian_rites_old_adj:0 "Old Scythian"
 scythian_rites_old_adherent:0 "Old Scythian Polytheist"
 scythian_rites_old_adherent_plural:0 "Old Scythian Polytheists"
 scythian_rites_old_desc:0 "Long before the Sarmatians rode across the Pontic steppe, the Royal Scythians kept the hearth of $scythian_polytheism_household_god_name$ burning and laid their kings beneath great kurgans, with horses, gold and attendants to serve them in the life beyond."

 # semitic_rites (faith: canaanite_polytheism) - god names in its own localization block
 semitic_rites:0 "Canaanite"
 semitic_rites_adj:0 "Canaanite"
 semitic_rites_adherent:0 "Canaanite Polytheist"
 semitic_rites_adherent_plural:0 "Canaanite Polytheists"
 semitic_rites_desc:0 "The western branch of the Semitic peoples honoured a different set of gods than their Mesopotamian and Arabian cousins: El the father of the gods, Baal who rides the clouds, Astarte and Eshmun. Along the Levantine coast the Phoenicians, who called themselves Canaanites, kept these gods for a thousand years and carried them across the sea."
