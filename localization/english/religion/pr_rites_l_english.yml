 punic_rites_adherent_plural:0 "Punic Polytheists"
 punic_rites_desc:0 "The Punics derived the core of their religion from Phoenicia, but in Carthage it grew into a pantheon of its own. Baal Hammon and his consort Tanit stood at its head, and the sign of Tanit can be found on stelae, temples and many other buildings. The religion is also known as Western Phoenician or Carthaginian."
