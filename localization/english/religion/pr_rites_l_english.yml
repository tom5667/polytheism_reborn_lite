 assyrian_rites_adherent:0 "Assyrian Polytheist"
 assyrian_rites_adherent_plural:0 "Assyrian Polytheists"
 assyrian_rites_desc:0 "The Assyrians worshipped the same gods as Babylon, but placed Aššur, the god of their city, above all others. In their version of the Enūma eliš it is Aššur, not Marduk, who defeats Tiamat. At his side stood Mullissu, and the kings sought the favour of Ištar of Nineveh and Ištar of Arbela before every campaign."
