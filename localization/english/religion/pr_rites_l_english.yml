 gaulish_rites_adherent:0 "Gaulish polytheist"
 gaulish_rites_adherent_plural:0 "Gaulish polytheists"
 gaulish_rites_desc:0 "Across Gaul, druids lead their people in rites to Taranis, Belisama and the wider pantheon, weaving worship into every aspect of tribal life from war to harvest."
 gaulish_rites_old:0 "Old Gaulish"
 gaulish_rites_old_adj:0 "Old Gaulish"
 gaulish_rites_old_adherent:0 "Old Gaulish polytheist"
 gaulish_rites_old_adherent_plural:0 "Old Gaulish polytheists"
 gaulish_rites_old_desc:0 "In the years before Caesar's legions marched into Gaul, druids led their people in rites to Taranis and the wider pantheon, untouched by the growing shadow of Rome."

