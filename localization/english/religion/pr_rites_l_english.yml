 semitic_rites_old_adj:0 "Old Canaanite"
 semitic_rites_old_adherent:0 "Old Canaanite Polytheist"
 semitic_rites_old_adherent_plural:0 "Old Canaanite Polytheists"
 semitic_rites_old_desc:0 "In earlier centuries, before Punic colonization reshaped the western Mediterranean, the Canaanite faith was practised much as it had been for a thousand years along the Levantine coast."

