 armenian_rites_adherent_plural:0 "Armenian Polytheists"
 armenian_rites_desc:0 "Armenian polytheism holds a unique position due to Armenia's nature as a crossroad of cultures and religions. Ever since the Indo-Europeans that would come to be known as the Armenians migrated southwards through the Caucasus, they saw continued syncretism of their religion with Urartian, Mesopotamian, Mazdayasna and Hellenistic pantheons. This allowed the emerging Christian faith to influence the Armenian kingdom deeply, until it gained its status as the state religion."
