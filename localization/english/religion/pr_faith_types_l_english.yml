l_english:

 continental_polytheism:0 "Continental"
 continental_polytheism_adj:0 "Continental"
 continental_polytheism_adherent:0 "Continental Polytheist"
 continental_polytheism_adherent_plural:0 "Continental Polytheists"
 continental_polytheism_desc:0 "The polytheism of the Celtic peoples of the continent, from Gaul to the Celtiberian highlands. Each region honours its own gods at sacred groves, springs and hilltops, but druids and a shared tradition bind the tribes together."
 continental_polytheism_old:0 "Old Continental"
 continental_polytheism_old_adj:0 "Old Continental"
 continental_polytheism_old_adherent:0 "Old Continental Polytheist"
 continental_polytheism_old_adherent_plural:0 "Old Continental Polytheists"
 continental_polytheism_old_desc:0 "Before Rome brought Gaul and Hispania under its rule, the continental Celts kept their gods at sacred groves, springs and hilltops, guided by druids and by the customs of each tribe."
 pritani_polytheism:0 "Pritani"
 pritani_polytheism_adj:0 "Pritani"
 pritani_polytheism_adherent:0 "Pritani Polytheist"
 pritani_polytheism_adherent_plural:0 "Pritani Polytheists"
 pritani_polytheism_desc:0 "The polytheism of the Britons, the Pritani of the island of Britain. Its gods are honoured at sacred wells, rivers and hilltop shrines, with druids as keepers of lore and sacrifice."
 pritani_polytheism_old:0 "Old Pritani"
 pritani_polytheism_old_adj:0 "Old Pritani"
 pritani_polytheism_old_adherent:0 "Old Pritani Polytheist"
 pritani_polytheism_old_adherent_plural:0 "Old Pritani Polytheists"
 pritani_polytheism_old_desc:0 "Before the Roman conquest of Britain, the Pritani honoured their gods at sacred wells, rivers and hilltop shrines, with druids as keepers of lore and sacrifice."
 eriu_polytheism:0 "Ériu"
 eriu_polytheism_adj:0 "Ériu"
 eriu_polytheism_adherent:0 "Ériu Polytheist"
 eriu_polytheism_adherent_plural:0 "Ériu Polytheists"
 eriu_polytheism_desc:0 "The polytheism of Ireland, named after Ériu, the land itself. Its gods are bound to the kingship of the island, and druids and poets keep the old lore alive."
 eriu_polytheism_old:0 "Old Ériu"
 eriu_polytheism_old_adj:0 "Old Ériu"
 eriu_polytheism_old_adherent:0 "Old Ériu Polytheist"
 eriu_polytheism_old_adherent_plural:0 "Old Ériu Polytheists"
 eriu_polytheism_old_desc:0 "In the old days of Ireland, before the coming of Christianity, kings were wedded to the land and druids and poets kept the lore of the gods."
 daco_thracian_polytheism:0 "Daco-Thracian"
 daco_thracian_polytheism_adj:0 "Daco-Thracian"
 daco_thracian_polytheism_adherent:0 "Daco-Thracian Polytheist"
 daco_thracian_polytheism_adherent_plural:0 "Daco-Thracian Polytheists"
 daco_thracian_polytheism_desc:0 "The faith of the Getae, Dacians and Thracians, reborn from what Greek and Roman writers recorded: the teaching of Zalmoxis among the Getae and Dacians, and the many gods of the Thracian kings and tribes."
 daco_thracian_polytheism_old:0 "Old Daco-Thracian"
 daco_thracian_polytheism_old_adj:0 "Old Daco-Thracian"
 daco_thracian_polytheism_old_adherent:0 "Old Daco-Thracian Polytheist"
 daco_thracian_polytheism_old_adherent_plural:0 "Old Daco-Thracian Polytheists"
 daco_thracian_polytheism_old_desc:0 "Before Rome conquered Dacia and Thrace, the Getae and Dacians awaited everlasting life with Zalmoxis, while the Thracians of the south honoured Bendis, Sabazios and the sky god Zbelsurdos on their mountains."
 canaanite_polytheism:0 "Canaanite"
 canaanite_polytheism_adj:0 "Canaanite"
 canaanite_polytheism_adherent:0 "Canaanite Polytheist"
 canaanite_polytheism_adherent_plural:0 "Canaanite Polytheists"
 canaanite_polytheism_desc:0 "The polytheism of the Canaanite and Phoenician peoples, carried by Phoenician sailors from the Levant to Carthage and the far west of the Mediterranean."
 canaanite_polytheism_old:0 "Old Canaanite"
 canaanite_polytheism_old_adj:0 "Old Canaanite"
 canaanite_polytheism_old_adherent:0 "Old Canaanite Polytheist"
 canaanite_polytheism_old_adherent_plural:0 "Old Canaanite Polytheists"
 canaanite_polytheism_old_desc:0 "Before the fall of Tyre and Carthage, the Canaanite and Phoenician cities each honoured their own patron gods in temples and high places across the Mediterranean."
 # etruscan_polytheism (religion: roman_religion) - was the religion etruscan_religion / faith etc_polytheism (issue #86)
 etruscan_polytheism:0 "Etruscan"
 etruscan_polytheism_adj:0 "Etruscan"
 etruscan_polytheism_adherent:0 "Etruscan Polytheist"
 etruscan_polytheism_adherent_plural:0 "Etruscan Polytheists"
 etruscan_polytheism_desc:0 "The Etruscan pantheon stood apart from its Indo-European neighbors, drawing on both a distinct native tradition and heavy borrowing from Greek gods and heroes — a uniqueness that did not save the Etruscans from being absorbed into the rising Roman state."
 etruscan_polytheism_old:0 "Old Etruscan"
 etruscan_polytheism_old_adj:0 "Old Etruscan"
 etruscan_polytheism_old_adherent:0 "Old Etruscan Polytheist"
 etruscan_polytheism_old_adherent_plural:0 "Old Etruscan Polytheists"
 etruscan_polytheism_old_desc:0 "In the earlier centuries of Etruscan civilization, before Rome's rise, the twelve cities of Etruria each kept their own priesthoods and rites, bound together by a shared reverence for the same gods and the sacred art of divination."
