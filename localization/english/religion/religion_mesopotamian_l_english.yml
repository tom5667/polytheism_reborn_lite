    mesopotamian_religion_desc:0 "The Mesopotamian religion knows many gods, once shared by the ancient Babylonians, Assyrians, Akkadians and Sumerians."

    #Babylonian
    babylonian_polytheism:0 "Mesopotamian"
    babylonian_polytheism_adj:0 "Mesopotamian"
    babylonian_polytheism_adherent:0 "Mesopotamian Polytheist"
    babylonian_polytheism_adherent_plural:0 "Mesopotamian Polytheists"
    babylonian_polytheism_desc:0 "The gods of Sumer, Akkad, Babylon and Assyria were one great family: Anu of the sky, Enlil of Nippur, Ea of the deep waters, and the city gods who ruled from their temples. Babylon raised Marduk to their head, Assyria raised Aššur, and the ancient Sumerian hymns were sung in every temple long after the language itself had died."

    babylonian_polytheism_old:0 "Old Mesopotamian"
    babylonian_polytheism_old_adj:0 "Old Mesopotamian"
    babylonian_polytheism_old_adherent:0 "Old Mesopotamian Polytheist"
    babylonian_polytheism_old_adherent_plural:0 "Old Mesopotamian Polytheists"
    babylonian_polytheism_old_desc:0 "$babylonian_polytheism_desc$"

    # Babylonian rite (religion-level localization block). Names checked twice against ORACC (AMGG),
