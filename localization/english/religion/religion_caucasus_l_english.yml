    armenian_polytheism_good_god_anahit:0 "Anahit"
    armenian_polytheism_good_god_vahagn:0 "Vahagn"
    armenian_polytheism_good_god_mihr:0 "Mihr" # son of Aramazd, Bagayarich (Agathangelos)
    armenian_polytheism_good_god_nane:0 "Nane" # daughter of Aramazd, Til (Agathangelos)
    armenian_polytheism_good_god_tir:0 "Tir"
    armenian_polytheism_good_god_astghik:0 "Astghik" # 'little star', the Armenian Aphrodite (Agathangelos)
    armenian_polytheism_good_god_barshamin:0 "Barshamin" # 'of dazzling whiteness', Tordan (Agathangelos)
