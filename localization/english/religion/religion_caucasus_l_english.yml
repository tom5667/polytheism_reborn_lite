    caucasus_religion_adherent:2 "Caucasus"
    caucasus_religion_adherent_plural:2 "Caucasians"

    caucasus_religion_desc:0 "The old religions of the Caucasus, once shared by the ancient Georgians and Armenians before Christianity took root, honor a broad pantheon of mountain and sky gods."

    #Caucasian faith (armenian_polytheism)
    armenian_polytheism:0 "Caucasian"
    armenian_polytheism_adj:0 "Caucasian"
    armenian_polytheism_adherent:0 "Caucasian Polytheist"
    armenian_polytheism_adherent_plural:0 "Caucasian Polytheists"
    armenian_polytheism_desc:0 "Before Christianity reached the Caucasus in the fourth century, Armenians and Georgians honoured gods shaped by their Iranian neighbours: Aramazd and Armazi, the great goddess Anahit, and Vahagn the dragon-slayer, beside older spirits of mountain, hearth and spring. Traces lived on long after the conversion, among the Armenian 'Children of the Sun' and in the shrines of the Georgian high valleys."

    armenian_polytheism_old:0 "Old Caucasian"
    armenian_polytheism_old_adj:0 "Old Caucasian"
    armenian_polytheism_old_adherent:0 "Old Caucasian Polytheist"
    armenian_polytheism_old_adherent_plural:0 "Old Caucasian Polytheists"
    armenian_polytheism_old_desc:0 "$armenian_polytheism_desc$"

    #################################################################
    # Armenian rite (religion-level block). Checked twice (2026-10-06) against Agathangelos and
    # Movses Khorenatsi (historians.armeniancathedral.org), Strabo XI.14.16, Encyclopaedia Iranica
    # "Armenia and Iran" iii (Russell) and iv (Schmitt), Ananikian "Armenian Mythology" (1925),
    # Kurkjian ch. 34. Urartian gods (Haldi, Arubani, Selardi) and modern folklore (Tsovinar) removed.
    # Readable spelling (user choice): Astghik, Bakht, Drakht, Dzhokh.
    #################################################################
    armenian_polytheism_high_god_name:0 "Aramazd"
    armenian_polytheism_high_god_name_2:0 "$armenian_polytheism_high_god_name$"
    armenian_polytheism_high_god_name_possessive:0 "Aramazd's"
    armenian_polytheism_high_god_name_alternate:0 "Ormizd" # later learned form (Agathangelos, Eznik)
    armenian_polytheism_high_god_name_alternate_possessive:0 "Ormizd's"
