    armenian_polytheism_creator_god_name_possessive:0 "$armenian_polytheism_high_god_name_possessive$"
    armenian_polytheism_health_god_name:0 "the Aralez"
    armenian_polytheism_health_god_name_possessive:0 "the Aralez's"
    # spirits who lick the wounds of the fallen and revive them (Khorenatsi on Ara; Eznik)
    armenian_polytheism_fertility_god_name:0 "Anahit"
    armenian_polytheism_fertility_god_name_possessive:0 "Anahit's"
