    scythian_religion_adherent_plural:2 "Scythians"
    scythian_religion_desc:0 "The ancient faith of the Scythian nomads is a rich tapestry of myth and nature-worship, born upon the windswept steppes. Followers revere a vast pantheon of primordial deities, believing that the divine presence courses through the earth, the sky, and the thundering hooves of their steeds."

