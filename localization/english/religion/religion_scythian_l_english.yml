    scythian_polytheism_adherent_plural:0 "Scythian polytheists"
    scythian_polytheism_desc:0 "At the heart of the Scythian faith lies a profound reverence for the gods and goddesses of the untamed steppe. Through elaborate sacrifices, roaring hearth fires, and sacred rites, devotees seek to appease these ancient powers, ensuring victory in battle, the fertility of their herds, and harmony within the natural world."

