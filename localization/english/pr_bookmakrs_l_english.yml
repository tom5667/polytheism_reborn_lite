l_english:
  bm_867_pr_adventurers:0 "Polytheism Reborn 867"
  bm_867_pr_adventurers_desc:0 "The world has changed a lot and most of the Polytheistic strongholds are gone Basil reconquered Laconia and ordered missionaries to convert the local population, but still there is one family who doesn't like it one bit. Play as Epimakhos Agiadai and prepare for a last stand."
  bookmark_pr_867_epimakhos:0 "Epimakhos Agiadai"
  bookmark_pr_867_epimakhos_desc:0 "The day has come to start my adventure as Leonidas did before me, we need to protect our religion against the false emperor, those damn missionaries. First of I need search for like minded people even if only for their hatred against the emperor. From there the road is open to expand my power and may one day this family rule Laconia or maybe even The Eastern Roman Empire."
  bookmark_pr_867_epimakhos_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
