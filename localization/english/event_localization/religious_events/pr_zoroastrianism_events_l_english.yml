zoroastrianism.001.t:0 "3rd Avesta"
zoroastrianism.001.desc:0 "As the conflict recedes, a beacon of hope emerges for the Mazdayasna community. With the Arabian invaders vanquished, their lands and temples reclaimed, a collective sense of relief sweeps across the land, a glimmer of optimism piercing the darkness. Amongst the aristocracy and priesthood, a fervent desire ignites to restore the Avesta, their sacred text, ravaged by the invaders. This ancient repository of divine wisdom, painstakingly compiled over centuries, holds immense significance, its loss a grievous blow to the Zoroastrian faith. Your head of faith [ROOT.Char.GetFaith.ReligiousHeadName], recognizing the gravity of this task and its profound symbolism, addresses the congregation with unwavering conviction. "Fellow Mazdayasna," he declares with his voice resonating through the grand hall, "as we stand on the threshold of a new era, we must not let the sacred text that guided our ancestors slip into oblivion. The Avesta, our beacon of wisdom, has been scattered and destroyed by the invaders. Now, it is time to restore what had once been lost!"" 
zoroastrianism.001.a:0 "Restore the Avesta" 
zoroastrianism.001.cancel:0 "Never mind"



zoroastrianism.002.t:0 "The new Avesta"
zoroastrianism.002.desc:0 "As you sit upon your throne, anticipation hangs heavy in the air. The grand hall waits in hushed silence, the congregation holding its breath, awaiting the proclamation that will mark the culmination of their arduous journey. Your heart pounds with anticipation, your spirit echoing the collective yearning for the moment when the Third Avesta, your sacred text, will be restored to its rightful place.\n\nSuddenly, the doors burst open, and your [ROOT.Char.GetFaith.ReligiousHeadName], their face ablaze with triumph, strides into the chamber. Their voice, resonating with the power of Ahura Mazda, echoes through the hall, declaring, "Praise be, fellow Mazdayasna! The Third Avesta is now complete!"\n\nA thunderous roar of jubilation erupts from the congregation, their voices rising in a cacophony of joy and gratitude. You join in the celebration, your heart swelling with pride and gratitude. The restoration of your sacred text is not merely a theological triumph it is a testament to your unwavering faith and resilience. The Third Avesta, now complete, will guide you towards a new era of prosperity, enlightenment, and righteousness."
zoroastrianism.002.a:0 "Glory to $zoroastrianism_high_god_name$!"

zoroastrianism.003.t:0 "Reinstate Middle Persian Names"
zoroastrianism.003.desc:0 "The restoration of the Third Avesta has rekindled the flames of tradition and heritage amongst the Mazdayasna community. As the sacred text is meticulously transcribed and disseminated, the ancient Middle Persian names, once lost to the ravages of time, are resurrected from the annals of history. These names, imbued with the essence of the faith, carry the weight of centuries of tradition and wisdom, connecting the present to the past in a seamless continuum.\n\n Your head of faith [ROOT.Char.GetFaith.ReligiousHeadName], recognizing the significance of these names, addresses the congregation with solemn reverence. "Fellow Mazdayasna," he intones, his voice resonating with the power of Ahura Mazda, "as we restore the Third Avesta, we must also revive the Middle Persian names that have been lost to us. These names, steeped in the wisdom of our ancestors, are a testament to our heritage and faith. Let us embrace them once more, and honor the legacy of our forebears!"" 
zoroastrianism.003.a:0 "Reinstate Middle Persian Names"

zoroastrianism.004.t:0 "The Sassanid Envoys"
zoroastrianism.004.desc:0 "The Sassanid envoys, dispatched from the newly reclaimed lands of Sistan, arrived at the [SCOPE.sC('receiver').GetHouse.GetName] court with a sense of cautious optimism. Their attire, though modest compared to the grandeur of old, bore the unmistakable symbols of the resurgent Sassanid dynasty. Kneeling before the [SCOPE.sC('receiver').GetHouse.GetName] ruler, they presented a missive sealed with the royal signet of the Shahanshah. The message spoke of the Sassanid's determination to restore the glory of their empire and invited the [SCOPE.sC('receiver').GetHouse.GetName] ruler to join their cause, forging an alliance to reclaim the lands and heritage of their ancestors.\n\nThe courtiers murmured among themselves, their expressions a mix of intrigue and skepticism. The envoys, their demeanor resolute yet humble, awaited the [SCOPE.sC('receiver').GetHouse.GetName] ruler's response, knowing that this moment could mark the beginning of a new chapter in the history of the Mazdayasna faith and the Persian people."


zoroastrianism.004.a:0 "Await his response"

zoroastrianism.005.t:0 "The Alliance Of The Faithful"
zoroastrianism.005.desc:0 "As the envoys from the Sassanid dynasty awaited the [SCOPE.sC('receiver').GetHouse.GetName] ruler's response, a sense of anticipation hung heavy in the air. The courtiers, gathered in the grand hall, exchanged furtive glances, their hearts pounding with a mixture of hope and trepidation. The envoys, their eyes fixed on the [SCOPE.sC('receiver').GetHouse.GetName] ruler, awaited the moment when the fate of their alliance would be decided.\n\nSuddenly, the [SCOPE.sC('receiver').GetHouse.GetName] ruler rose from their throne, their expression a mix of determination and resolve. Addressing the envoys with a voice that rang with authority, they declared, "We shall join forces to reclaim our shared heritage!"\n\nA wave of jubilation swept through the hall, the courtiers erupting in cheers and applause. The alliance of the faithful, forged in the crucible of adversity, would now stand united against the forces of darkness, their faith and heritage intertwined in a bond that transcended time and space."
zoroastrianism.005.a:0 "We shall join forces to reclaim our shared heritage!"

zoroastrianism.006.t:0 "No Alliance"
zoroastrianism.006.desc:0 "As the envoys from the Sassanid dynasty awaited the [SCOPE.sC('receiver').GetHouse.GetName] ruler's response, a sense of anticipation hung heavy in the air. The courtiers, gathered in the grand hall, exchanged furtive glances, their hearts pounding with a mixture of hope and trepidation. The envoys, their eyes fixed on the [SCOPE.sC('receiver').GetHouse.GetName] ruler, awaited the moment when the fate of their alliance would be decided.\n\nSuddenly, the [SCOPE.sC('receiver').GetHouse.GetName] ruler rose from their throne, their expression a mix of determination and resolve. Addressing the envoys with a voice that rang with authority, they declared, "We shall stand alone in this endeavor!"\n\nA wave of disappointment swept through the envoys, their expressions betraying a mixture of disbelief and sorrow. The rejection of the alliance by the [SCOPE.sC('receiver').GetHouse.GetName] ruler was a heavy blow to the Sassanid dynasty's aspirations, casting a shadow over their hopes of unity. Yet, with unwavering resolve, the envoys vowed to continue their mission, determined to restore their heritage and faith, even if they must do so without the support of their brethren."
zoroastrianism.006.a:0 "We shall stand alone in this endeavor!"


zoroastrianism.007.t:0 "Failed Persuasion"
zoroastrianism.007.desc:0 "As the envoys from the Sassanid dynasty awaited the [SCOPE.sC('receiver').GetHouse.GetName] ruler's response, a sense of anticipation hung heavy in the air. The courtiers, gathered in the grand hall, exchanged furtive glances, their hearts pounding with a mixture of hope and trepidation. The envoys, their eyes fixed on the [SCOPE.sC('receiver').GetHouse.GetName] ruler, awaited the moment when the fate of their alliance would be decided.\n\nSuddenly, the [SCOPE.sC('receiver').GetHouse.GetName] ruler rose from their throne, their expression a mix of fury and indignation. Addressing the envoys with a voice that thundered through the hall, they declared, "How dare you presume to dictate terms to the [SCOPE.sC('receiver').GetHouse.GetName] court! Your arrogance is an affront to our sovereignty!"\n\nThe envoys, their faces pale with fear, attempted to stammer out an apology, but it was too late. The [SCOPE.sC('receiver').GetHouse.GetName] ruler, their patience exhausted, ordered their guards to seize the envoys. "Let this be a lesson to all who dare insult the [SCOPE.sC('receiver').GetHouse.GetName] dynasty," the ruler proclaimed. "
zoroastrianism.007.a:0 "This is not wat I wanted!"

