  #Event text  random event Temple sacriledge
  cdr.002.t:0 "Temple Sacriledge"
  cdr.002.desc:0 "Some fool has been caught defacing the temple of Jupiter. Such matter shouldn't be taken lightly. What should we do with him ? Next to that do I want to restore the temple?"
  cdr.002.a:0 "Send him to our prison and repair the temple"
  cdr.002.b:0 "The priest may decide his faith, only repair the temple"
  cdr.002.c:0 "Let him go"

  #Lemuria
  cdr.003.t:0 "Lemuria"
  cdr.003.desc:0 "Today we hold the Lemuria to expel the restless death and the fearful ghosts from our house, Together with my family we go through the house\n they with pots behind me while I speak the words, with these beans I redeem me and mine, nine times, after that I put beans in my mouth and spit them out over my shoulder.\n Now that is done my family are clashing the pots, while I speak the words, Ghosts of my fathers and ancestors, be gone! The ritual is done so it's time to wash my hands three times and watch for a good or bad signs."
  cdr.003.a:0 "watch for a good or bad signs"
  cdr.003.message.positive:0 "The ghosts and restless deaths are appeased"
  cdr.003.message.negative:0 "Bad omen sighted"

  #Offering to Dīs Pater
  cdr.004.t:0 "Offering to Dīs Pater"
  cdr.004.desc:0 "Today I walked along the graves of my ancestors, sometimes it's hard to believe they arren't arround anymore. After I got back home I decided to make a offering to Dīs Pater to honor my ancestors and be a bit closer to them. Important is disposing the food I offer and not eat it myself afterwards."
  cdr.004.a:0 "Make offering"

  #Visiting temple of Jupiter
  cdr.005.t:0 "Visiting Temple of Jupiter"
  cdr.005.desc:0 "To rule my realm I need some guidence from Jupiter King of the gods only he can he give the support my to rule my realm in a good way."
  cdr.005.a:0 "Sacrife a White Ox"
  cdr.005.message.positive:0 "Blessed by Jupiter"
  cdr.005.message.negative:0 "Unfavoured by Jupiter"

  #Ludi Plebii
  cdr.006.t:0 "Ludi Plebii"
  cdr.006.desc:0 "Today is the day for all citizens in the Realm races and all sort of other festivities to celebrate the liberties and democracy."
  cdr.006.a:0 "Join the festivities"

  #Offer food of your meal to the lares 
  cdr.007.t:0 "Offering to the Lares"
  cdr.007.desc:0 "Nothing better then a good meal, but today I want to share a part with the Lares the house gods to thank them for protecting my family."
  cdr.007.a:0 "Make offering to the Lares"

  #Offering to Ceres
  cdr.008.t:0 "Offering to Ceres"
  cdr.008.desc:0 "it's almost harvest time, to get some extra help we make a offering today to Ceres for a good harvest this season."
  cdr.008.a:0 "Make offering to Ceres"
  cdr.008.message.positive:0 "Blessed by Ceres"
  cdr.008.message.negative:0 "Bad harvest"

  #Lupercalia
  #This festival had it's flawes and for game sake and respect to and for woman all things in favor hitting or Demonization will be left out of the events 
  #even though this was historically true 
  #\n\nThe festival has changed over the centuries for the better, in the early republic it was a custom for the luperci to dance naked. But with the first Roman Emperor Augustus it got reformed to luperci running arround in goatskin.
  cdr.009.t:0 "Lupercalia"
  cdr.009.desc:0 "Today I can visit the center of the city where the yearly Lupercalia (between 13 and 15th of Februari) is being held. The festival in honor of $cdr_polytheism_good_god_juno$ Februata and is meant to Purify the city and promoting health and fertility.\n\nIt was also the festival where the famous Julius Ceasar refused the golden crown offered by Marcus Antonius."
  cdr.009.a:0 "Go to the Center of the city"
  cdr.009.b:0 "Maybe next year"

  cdr.010.t:0 "City center"
  cdr.010.desc:0 "Of course the Center of the city is crowded with people in a relationship or not, some just come watch the ceremonies and festivities. I on the other hand going to participate in the festival and that means I'm going to spent a whole day with the woman on the small piece of parcement I'm going to recieve.\n\nBut before that the Lupercari Priests are going to hold sacrifices this included a male goat and a dog. Next to that there is also a offering of salted mealcakes provided by the vestal virgins, two Luperci approached the altar. Their foreheads were anointed with blood from the sacrificial knife, then wiped clean with wool soaked in milk, after which they were expected to laugh.\n\n In a few centuries this al may sound a bit strange but as with everything also rituals will change with time.\n\n The luperci aproached us with a box where we received the small piece of parcement which contains the name of the woman I'm going to spend the day with."
  cdr.010.a:0 "I hope this date works out"

  cdr.011.t:0 "The Lupercalia date"
  cdr.011.desc:0 "The day is at a end, what a day but the question is was it enough for both of us to build on ?"
  cdr.011.a:0 "Maybe I really found the one"
  cdr.011.b:0 "No it was just a nice date" 

  lover_lupercalia_date:0 "Lupercalia date"
  #Buy book about Roman mythology 
  cdr.012.t:0 "The Bookseller"
  cdr.012.desc:0 "As I walked through the market today I found a stand with some books, there was one particular book that catches my eye that was the one about Roman Mythology. It costs a few coins but it's worth it."
  cdr.012.a:0 "Buy the book"

  #Read book about Roman mythology 
  cdr.013.t:0 "Story of Aenaes"
  cdr.013.desc:0 "You would say the Roman and Greek mythology is same but yet it isn't. I read About Aneas the son of $cdr_polytheism_fertility_god_name$ and how he fled to Rome as commanded by the gods with a group known as the Aenaeds, Carried with them the statues of the Lares and Penates the household gods of troy, As the group spread arrived in Italy they started to spread the statues.\n\nNext to that Aenaes was supposed to be married with Queen Dido of Carthago but after intervention of $cdr_polytheism_wealth_god_name$ on behalve of $cdr_polytheism_high_god_name$ that didn't happen. Queen Dido Cursed Rome to be always a enemy of Carthage what would end up in the first, second and third punic war and even elephants in the alps."
  cdr.013.a:0 "Funny to think that there once where elephants in the Alps"

   # Recruit augur event
  cdr.014.t:0 "Court Augur"
  cdr.014.fallback_reason.desc:0 "We never know if the gods aprove neither a  [ROOT.Char.GetTitleTierName]. I should hire a court augur so I can find out if the gods aprove my actions.\n\nI have asked around for recommendations, and they have assembled a few options to chose from."
  cdr.014.decision.desc:0 "We never know if the gods aprove neither a  [ROOT.Char.GetTitleTierName]. I should hire a court augur so I can find out if the gods aprove my actions.\n\nI have asked around for recommendations, and they have assembled a few options to chose from."
  cdr.014.a:0 "Apparently, [high_skill_option.GetFirstNameNoTooltip] is quite experienced."
  cdr.014.a.tt:1 "A [GetCourtPositionType('pr_court_augur_court_position').GetName()] also has a monthly salary of [gold_i][SCOPE.ScriptValue('court_position_physician_salary')]"
  cdr.014.b:0 "[low_skill_option.GetFirstNameNoTooltip] seems enthusiastic, if nothing else."
  cdr.014.c:0 "[mystic_option.GetFirstNameNoTooltip] claims to be trained in "alternative medicine.""
  cdr.014.d.two:0 "Both of them fail to impress me."
  cdr.014.d.more:0 "They all fail to impress me."
  cdr.014.e:0 "[excellent_skill_option.GetFirstNameNoTooltip] is widely known in scholarly circles."
  cdr.014.d.tt:1 "I do not recruit anyone as my [GetCourtPositionType('pr_court_augur_court_position').GetName()]"

  cdr.015.fallback.t:0 "This is a bug"
  cdr.015.fallback.desc:0 "Please report the bug on steam or discord when you see this message. Thanks in advance!"
  cdr.015.sacred_hens.t:0 "The sacred hens title"
  cdr.015.sacred_hens.desc:0 "I asked my [GetCourtPositionType('pr_court_augur_court_position').GetName()] for the Tripudiis auspice of the sacred hens. of course he can't guarantee a good outcome but If I have the approval of the gods, the rule of my realm would be alot easier.\n\nIf the hens come out the cage and eat in a pattern it's a good sign if they don't I have big problem."

  cdr.015.eagle.t:0 "The Eagle Auspice"
  cdr.015.eagle.desc:0 "I asked my [GetCourtPositionType('pr_court_augur_court_position').GetName()] for the Avibus auspice of the eagle. of course he can't guarantee a good outcome but If I have the approval of the gods, the rule of my realm would be alot easier.\n\nIf the eagle flighs high it's a good sign if it doesn't I have big problem."

  cdr.015.crows.t:0 "The crows title"
  cdr.015.crows.desc:0 "I asked my [GetCourtPositionType('pr_court_augur_court_position').GetName()] for the Oscines auspice of the crows. of course he can't guarantee a good outcome but If I have the approval of the gods, the rule of my realm would be alot easier.\n\nIf the Crows sing it's a good sign if they don't I have big problem."
  cdr.015.a:0 "Let's proceed"
  cdr.015.b:0 "Wait I have a proposition"

  cdr.016.t:0 "Good Auspice"
  cdr.016.sacred_hens.desc:0 "The cage opened, what will the hens do will they stay in the cage or come out and eat?\nNot long after did a small prayer to [ROOT.Char.GetFaith.HighGodName] The hens came out of the cage and started eating. The augur watched and after a few minutes he said. "The gods have spoken they aprove this war to be fought [ROOT.Char.GetFaith.WarGodName] Invicta!"\n\nNow we can go to battle the enemy in knowledge that the gods aprove our actions."
  cdr.016.eagle.desc:0 "The [GetCourtPositionType('pr_court_augur_court_position').GetName()] opened the cage of the eagle and he imediatly took of to the sky en circeled high above us all. The augur waited a few minutes and said "As the eagle flighs high above us, $cdr_polytheism_high_god_name$ Optimus Maximus certainly approves the actions of [scoped_ruler.GetTitledFirstName]."\n\nNow the gods have aproved the stability in my realm is once more assured!"
  cdr.016.crows.desc:0 "The [GetCourtPositionType('pr_court_augur_court_position').GetName()] Stands next to the cage of the crows, he let's them out they immediatly fly to a tree nearby. A few minutes later the crows start to make sound, the augur listened and not much later hey said "Their sound is like a song played by $cdr_polytheism_good_god_apollo$ the gods approve the the financial state of the realm"\n\nNow the gods have aproved the trade in my realm is once more assured!
  cdr.016.a:0 "The gods approve!"

  cdr.017.t:0 "Augur Accepts Bribe"
  cdr.017.sacred_hens.desc:0 "The augur told me that he will use hens that haven't eaten in a while so a good outcome is assured."
  cdr.017.eagle.desc:0 "The augur told me that he has a eagle that flighs high on order so that a good outcome is assured."
  cdr.017.crows.desc:0 "The augur told me that he that crows will make song like sounds so that a good outcome is assured."
  cdr.017.a:0 "Great!"

  cdr.018.t:0 "Augur Didn't Accept"
  cdr.018.desc:0 "The [GetCourtPositionType('pr_court_augur_court_position').GetName()] was not amused to say the least. He asked if I want the wrath of the gods over the realm\n\nWhile unfortunate, the gods have spoken and had not grant me their blessings to rule the realm. Best I can do is prove them mistaken."
  cdr.018.a:0 "I think I leave now"
  
  #Special event cancel auspice 
  cdr.020.t:0 "The Eagle Owl"
  cdr.020.desc:0 "It where just a few minutes after the start of the auspice when the sound of the eagle owl came close and emediatly the augur stoped the auspice and said, "I can't continue this is a eagle owl interfering in a auspice and that is a bad omen.""
  cdr.020.a:0 "Well this doesn't sound good at all."

  #Bad auspice 
  cdr.021.t:0 "Bad Auspice"
  cdr.021.fallback.desc:0 "Please report the bug on steam or discord when you see this message. Thanks in advance!"
  cdr.021.eagle.desc:0 "The augur led the eagle out of the cage but it was safe to say the eagle didn't go verry high in my opinion. A moment later the [GetCourtPositionType('pr_court_augur_court_position').GetName()] came to me and said. "The gods have spoken and your actions are not aproved by the gods, Proceed in this way and you will anger [ROOT.Char.GetFaith.HighGodName]"\n\nThis was really the worst what could happen my vassals, my realm could get in trouble because of my actions."

  cdr.021.sacred_hens.desc:0 "The augur led the hens out of the cage but it was safe to say the hens werren't verry hungry in my opinion. A moment later the [GetCourtPositionType('pr_court_augur_court_position').GetName()] came to me and said. "The gods have spoken and your actions are not aproved by the gods, Proceed in this way and you will anger [ROOT.Char.GetFaith.HighGodName]"\n\nThis was really the worst what could happen my vassals, my realm could get in trouble because of my actions."

  cdr.021.crows.desc:0 "The augur led the crows out of the cage but instead of making a song like sound they flew to the three and just stayed there without making sound. A moment later the [GetCourtPositionType('pr_court_augur_court_position').GetName()] came to me and said. "The gods have spoken and your actions are not aproved by the gods, Proceed in this way and you will anger [ROOT.Char.GetFaith.HighGodName]"\n\nThis was really the worst what could happen my vassals, my realm could get in trouble because of my actions."
  cdr.021.a:0 "Oh no"

  cdr.022.t:0 "Augury"
  cdr.022.desc:0 "In ancient Rome Augury was one of the most important things as only they can see if the gods approve our decisions, yet I failed to do so. Now I have to face the consequences."
  cdr.022.a:0 "Oh no"

  cdr.023.t:0 "The Lararium Shop"
  cdr.023.desc:0 "Today I going to a local lararium shop they sell lots of statues of the gods but also things like incense, should I buy a new statue ?"
  cdr.023.jupiter:0 "$cdr_polytheism_high_god_name$"
  cdr.023.juno:0 "$cdr_polytheism_good_god_juno$"
  cdr.023.mars:0 "$cdr_polytheism_war_god_name$"
  cdr.023.lares:0 "$cdr_polytheism_wealth_god_name$"
  cdr.023.venus:0 "$cdr_polytheism_good_god_Venus$"
  cdr.023.mercurius:0 "$cdr_polytheism_wealth_god_name$"
  cdr.023.minerva:0 "$cdr_polytheism_knowledge_god_name$"
  cdr.023.apollo:0 "$cdr_polytheism_good_god_apollo$"
  cdr.023.cancel:0 "Maybe not now"

  cult.025.t:0 "The Call to Advance"
  cult.025.corax.desc:0 "As a Corax, I have served my brothers in the Mithraeum, carrying the ritual food and drink. I have learned humility and the importance of service. The Pater tells me that I have shown the diligence of Mercury and that the path to the next grade, that of Nymphus, is open to me. It is a trial of symbolic union and purity, representing Venus."
  cult.025.nymphus.desc:0 "As a Nymphus, I have tended the sacred lamps, ensuring the light of the Mithraeum never falters. I have learned of the soul's purity and its mystical marriage to the divine. The Pater says I am ready to face the trial of the Soldier, the Miles. This grade, under the protection of Mars, requires a test of loyalty and endurance."
  cult.025.miles.desc:0 "As a Miles, I have proven my endurance and loyalty, refusing the earthly crown to declare Mithras as my only king. I have stood vigil and shown my strength. The Pater now calls me to the trial of the Leo, the Lion. Protected by Jupiter, this grade requires a trial by fire, a purification of the spirit."
  cult.025.leo.desc:0 "As a Leo, I have handled the sacred fire, offering libations of honey to purify my hands and tongue. I have learned to control my passions and act with the strength of the Lion. The Pater believes I am ready to become a Perses, a Persian. This grade, under the Moon, is one of guardianship over the sacred fruits of the earth."
  cult.025.perses.desc:0 "As a Perses, I have guarded the sacred honey, a symbol of preservation and the bounty of the earth. I have learned the secrets of the harvest and the cycles of nature. The Pater now calls me to the grade of Heliodromus, the Sun-Runner. This trial, under the Sun itself, is a test of my ability to guide others as Mithras guides the cosmos."
  cult.0s.heliodromus.desc:0 "As a Heliodromus, I have carried the light of the Sun, participating in the sacred drama of the solar journey. I have learned to embody the light and order that Mithras brings to the world. The Pater, seeing my wisdom and dedication, has declared me ready for the final step":" to become a Pater, a Father to the community, under the guidance of Saturn, the keeper of time and wisdom."
  cult.025.fallback.desc:0 "This is a bug please report it on steam or on discord"

  cult.025.corax.a:0 "I am ready for the trial of the Bridegroom."
  cult.025.corax.a.tt:0 "I will become a Nymphus, a Bridegroom. I will be veiled and presented with a lamp, symbolizing the soul's search for divine light."
  cult.025.nymphus.a:0 "I am ready for the trial of the Soldier."
  cult.025.miles.a:0 "I am ready for the trial of the Lion."
  cult.025.leo.a:0 "I am ready for the trial of the Persian."
  cult.025.leo.a.tt:0 "I will become a Perses, a Persian. I will be entrusted with the guardianship of the sacred honey, symbolizing the preservation of life."
  cult.025.perses.a:0 "I am ready for the trial of the Sun-Runner."
  cult.025.perses.a.tt:0 "I will become a Heliodromus, the Sun-Runner. I will participate in the sacred drama, carrying a torch to represent the light of the Sun."
  cult.025.heliodromus.a:0 "I am ready to become a Father."
  cult.025.heliodromus.a.tt:0 "I will become a Pater, the highest grade. I will take on the role of a wise leader, guiding my brothers in the mysteries of Mithras."
  cult.025.standard:0 "Great meeting with my fellow brothers and sisters"

  cult.026.t:0 "The Initiation"
  cult.026.desc:0 "For the initiation to the Leo rank I need to recitate of a catechism, where I need to answer on a serie of questions. The pater of the cult started\n\n"...He will say 'Where  ...?'" Very sharp and ...\n"'... is he at a loss there?' Say'...'" Much. He will say\n"... Say'Night'. He will say 'Where ...?'" '... of the hot and cold'. He will say '...?'\n"... Say 'All things ...'" red linen. He will say Why? Say\n"Are you called? Say Because of the summery" Red border the linen, however,\n"Having become he/it has the fiery ones"  has been wrapped? Say the savior's\n"did you receive?' Say 'In a pit'. He will say 'Where is your ...'?" He will say 'Who is the father?' Say'The one who begets everything'\nIn the Leonteion. He will say 'Will you gird ...?'" He will say 'How did you become a Leo?' Say 'By the ... of the father ...'\n'"... death'. He will say 'Why, having girded yourself, ...?'" Say 'Drink and food'. He will say'...?'\n"... this has four tassels." ... in the seven-...\n\n After the recitate is done I'm welcomed into the rank of Leo"
  cult.026.a:0 "I'm part of the Leo rank!"

  cult.027.t:0 "The Trial of the Soldier"
  cult.027.desc:0 "The Pater leads me to the center of the Mithraeum. He presents me with a crown on the tip of a sword. 'Aurelian offered a crown to the Unconquered Sun,' he proclaims. 'Now, a crown is offered to you.' I know the rite. I must push the crown away and declare my loyalty to a higher power.\n\n'My only crown is Mithras!' I shout. The Pater nods in approval. 'You have shown your loyalty. You are now a Miles, a soldier of the Unconquered God.'"
  cult.027.a:0 "My only crown is Mithras!"

  cdr.026.t:0 "The Latin Speaker"
  cdr.026.desc:0 "After the Latin speaker arrived, he began to unroll some ancient scrolls written by Roman statesmen such as Cicero and Livius. He also placed a book of the Gallic Wars, Commentarii de bello Gallico, written by Gaius Julius Caesar, on the table.\n\nAfter a few days of learning, the teacher said, "You now know the basics of Latin. Keep working on your Latin, and you will get better every day.\n\nAs a present, I am giving you this book about the Gallic Wars."\n\nAnd so, I am finally done, and I can finally reintroduce the Latin language in court if I want to."
  cdr.026.a:0 "The Latin language is back!"

 cdr.027.t:0 "Pontif"
 cdr.027.desc:0 "My fellow [ROOT.Char.GetFaith.GetAdherentNamePlural] certainly don't expect me to declare our submission to the existing.\n\nYet, perhaps by pledging allegiance to the old Pontifex we stand stronger against our enemies..."
 cdr.027.a:0 "$head_of_faith.0021.a$"
 cdr.027.d:0 "We must continue cleaving to [old_pontifex.GetFaith.GetAdjectiveNoTooltip] authority!"
 cdr.027.rejection_body:0 "rejects the pledge"
 cdr.027.acceptance_body:0 "accepts the pledge"
 cdr.027.rejection.outcome:0 "You are forced to take your own path regardless"
 cdr.027.d.rejection:0 "@piety_level_0_icon_islam! [old_pontifex.GetTitledFirstNameNoTooltip] $cdr.027.rejection_body$"
 cdr.027.d.acceptance:0 "@piety_level_3_icon_islam! [old_pontifex.GetTitledFirstNameNoTooltip] $cdr.027.acceptance_body$"
 
 cdr.029.t:0 "The Sibylline Books"
 cdr.029.desc:0 "As our priests are starting to kick out the Nazerene priests and their zealots out of our lands and temples, many aristocrats and priests believe it is time to search for the remnants of the Sibylline Books that had been destroyed by the general Stilicho in 405 AD/1158 AUC.\n\nSo this is how we proceed answered [ROOT.Char.GetFaith.ReligiousHeadName] "If we are going through with this, it will take about a year to complete the books. Of course I will personally oversee the safety of the oracle and make sure they can do their work without interferrence of others. The choice is yours.""
 cdr.029.a:0 "You may proceed" 
 cdr.029.cancel:0 "Never mind"

 cdr.030.t:0 "The new Sybelline Books"
 cdr.030.desc:0 "While sitting on your throne, your [ROOT.Char.GetFaith.ReligiousHeadName] suddenly rushes into the hall shouting "Good news, everyone! The Oracle in Graecia had deemed the new Sibylline Books finished!"\n\n"Where would we store it?" You ask after the celebratory clutter ends. "I thought you might have had an idea about that, my liege...""
 cdr.030.jupiter:0 "The Temple of $cdr_polytheism_high_god_name$!"
 cdr.030.mars:0 "The Temple of $cdr_polytheism_war_god_name$!"
 cdr.030.venus:0 "The Temple of $cdr_polytheism_fertility_god_name$!"
 cdr.030.minerva:0 "The Temple of $cdr_polytheism_knowledge_god_name$!"

 cdr.031.t:0 ""
 cdr.031.desc:0 "Even though Emperor Julians Rule was short, he still left a big mark on the fourth century. He got a few nicknames in the time he ruled now it's time to choose what name you to give him."
 cdr.031.polytheistic_nick:0 "Templorum Restaurator"
 cdr.031.christian_nick:0 "Apostate"
 cdr.031.philosopher_nick:0 "The Philosopher"
 cdr.031.jewish_nick:0 "The Hellen"

 ep3_roman_restoration.0100.c:0 "The way of the great Emperor Augustus"

 cdr.032.t:0 "Romanize the [pagan.GetCulture.GetCollectiveNounNoTooltip]"
 cdr.032.desc:0 "Romanization brings prosperity and protection to people, but our neighbor, [pagan.GetTitledFirstName], is blissfully unaware of it, and persists in believing in only their gods who can't protect them forevor from the christians.\n\nSaving [pagan.GetHerHis] soul and those of [pagan.GetHerHis] people is a noble endeavor in itself, but there also #EMP earthly#! advantages to their conversion — for starters, reducing their hostility towards us and bringing them into our own sphere of influence.\n\nMy chosen missionary, [evangelizer.GetFirstName], is ready to go."
 cdr.032.a:0 "May [ROOT.Char.GetFaith.HighGodName] guide you!"
 cdr.032.a.tt: "[evangelizer.GetFirstNameNoTooltip] departs for [pagan.GetTitledFirstNamePossessiveNoTooltip] capital."
 

 cdr.034.desc: "Emissaries from our neighbors come and go frequently enough that they all mix together in my mind. However, today's envoy from [GetTitleByKey('e_byzantium').GetName] sticks out like none before.\n\n[evangelizer.GetSheHe|U] seems to be some sort of holy [evangelizer.GetWomanMan], for starters, and instead of advancing political demands, this [evangelizer.GetFirstName] preaches of an omnipotent God, honored in temples of gold and silver that always smell of incense."
 cdr.034.a: "Please tell me more"
 cdr.034.a.tt: "You create an [alliance|E] with [evangelizer.GetTitledFirstNamePossessiveNoTooltip] liege, [sender.GetTitledFirstName]"
 cdr.034.b: "We don't need new gods."
 cdr.034.c: "Ridiculous!"
 cdr.034.c.tt: "This is sure to send a message: your preachers are not welcome here! But we should be ready for retaliation..."

 cdr.035.t: "" #AI event, leave empty
 cdr.035.desc: "" #AI event, leave empty
 cdr.035.a: "" #AI event, leave empty
 
 cdr.037.desc_new: "My predecessor [sender.GetFirstName] had invested into the spreading of the [pagan.GetCulture.GetCollectiveNounNoTooltip] but, unfortunately for [sender.GetHerHim], it is I who will reap the benefits of [sender.GetHerHis] efforts. [sender.GetHerHis|U] missionary [evangelizer.GetFirstName], in fact, has just returned."
 cdr.037.desc_old: "Months ago, I sent my trusted [evangelizer.GetFirstName] to bring the knowledge about the Gods to the [pagan.GetCulture.GetCollectiveNounNoTooltip]. It is with great joy that I welcome [sender.GetHerHim] back today, as I've been eagerly waiting for [evangelizer.GetHerHis] report."
 cdr.037.desc_success: "\n\n"I bring great news, my liege! [pagan.GetTitledFirstName|U] was eager to hear the Glad Tidings, and converted to [evangelizer.GetFaith.GetName], accompanied by many of [pagan.GetHerHis] people."
 cdr.037.desc_failure: "\n\n"I bring somber news, my liege. Unfortunately, [pagan.GetTitledFirstName] was most unresponsive to the Word of the gods, and sent me away empty-handed.""
 cdr.037.a: "Excellent!"
 cdr.037.b: "It's only a temporary setback."
 cdr.037.a.tt: "You create an [alliance|E] with the newly-converted [pagan.GetTitledFirstName]."

cdr.038.desc: "Terrible tidings!\n\nNews has come from the land of [pagan.GetCulture.GetCollectiveNounNoTooltip] and, apparently, my missionary [evangelizer.GetFirstName] was killed but the barbarian [pagan.GetTitledFirstName], who wasn't satisfied with rebuking any conversion attempts, but went as far as committing the final desecration and murder a [evangelizer.GetWomanMan] of the Gods!"
cdr.038.a: "Outrageous!"

cdr.039.t: "Pantheon of Constantinople"
cdr.039.desc: "With the Hagia sophia demolished we have space to build a pantheon like the one in Rome, a proper place to worship the gods "
cdr.039.a: "Open the Pantheon"

cdr.040.t: "Reopening of Pantheon"
cdr.040.desc: "Centuries have gone by, with ulitmatly giving away the pantheon by Emperor  to the Pope. All christian signs and statues are removed and replaced by marble statues of the gods./n/nFrom now on the proper gods will be worshiped here again !"
cdr.040.a: "Open the Pantheon"

cdr.041.t:0 "A Sacred Duty"
cdr.041.desc:0 "Today, I have made the momentous decision to send my beloved daughter to serve as a Vestal Virgin. It is both an honor and a sacrifice for our family, but I know that her service will bring great favor from the gods and eternal glory to our name. As she departs for the temple of Vesta, I pray that she will uphold the sacred flame and fulfill her duty with dignity and devotion."
cdr.041.a:0 "May Vesta watch over her"
cdr.041.cancel:0 "Maybe not now"

cult.042.t:0 "The cults"
cult.042.desc:0 "Centuries ago the cults where many, but with the growth of christianity the cults where baned. As ruler I have the power to restore the cults.\n\nI could restore all of them but if that is a smart thing to ? Only the gods know."
cult.042.mithras:0 "Mithras"
cult.042.sol_invictus:0 "Sol Invictus"
cult.042.isis:0 "Isis"
cult.042.serapis:0 "Serapis"
cult.042.eleusinian:0 "Eleusinian"
cult.042.imperial:0 "Imperial"
cult.042.bacchus:0 "Bacchus"
cult.042.cybele:0 "Cybele"

cult.028.t:0 "Restoration of Mithras Cult" 
cult.028.desc:0 "In the forgotten crypts and buried garrisons of a bygone era, tales persist of a hidden lord, born from stone, who struck down the primordial bull. This is Mithras, the Unconquered Guide, whose mysteries once forged unbreakable bonds among soldiers and merchants, instilling discipline, cosmic understanding, and unwavering loyalty. For centuries, his sacred caves have remained sealed, his seven grades of initiation lost to time, known only through obscure fragments and whispered legends.\n\nMy most daring spies and dedicated scholars have hinted at the rediscovery of a hidden Mithraeum, or perhaps a ciphered text revealing the true path to his ancient wisdom. To seek out this obscured truth is to undertake a perilous quest, fraught with secrecy and demanding an iron will. It will require immense personal risk, significant investment, and a dedication to an order that transcends mere mortal ambition. Yet, the promise of the strength, foresight, and unbreakable loyalty that the Mysteries of Mithras once bestowed... it beckons with a potent, almost forgotten power."
cult.028.a:0 "Praise Mithras"

cult.043.t:0 "Restoration of Isis Cult"
cult.043.desc:0 "Rumours have reached my ear, from distant lands and ancient wisdom. They speak of Isis, the powerful goddess, queen of heaven and earth, whose embrace brings forth life and whose favour protects prosperity. Decades, perhaps even centuries, her mysteries have remained hidden, her temples neglected, her hymns silenced in this land. Yet, the echo of her name lingers on the wind, calling with the promise of abundance, fertility, and safe journeys.\n\nMy scholars and spies have uncovered ancient texts fragments of rituals, prayers, and references to secret initiations. It seems the key to her forgotten worship lies within reach, an opportunity to once again invoke her divine grace upon my realm and my people.\n\nThis is no fleeting endeavour, but a profound undertaking that will demand my dedication and resources. But imagine the blessings a reawakened Isis could bestow..."
cult.043.a:0 "Restore the cult"

cult.044.t:0 "Restoration of Cybele Cult"
cult.044.desc:0 "In the wildest parts of my domain, where civilization's grip is weakest, whispers of an ancient and formidable power have resurfaced. This is the domain of the Magna Mater, the Great Mother Cybele, a deity of untamed nature, of life, death, and ferocious rebirth. Her worship, once a vibrant and ecstatic force, has long been suppressed, its rites driven into the shadows.\n\nMy most trusted agents have uncovered a hidden community that has preserved the core of her mysteries. They speak of the Taurobolium, a baptism of blood, and of the Archigallus, the high priest who embodies the goddess's untamed spirit. To restore this cult is to embrace a primal power, one that promises immense vitality and a deep connection to the earth, but it is a path that demands absolute surrender and walks the line between divine ecstasy and madness."
cult.044.a:0 "Let the Great Mother's drums beat again!"


cult.045.t:0 "Restoration Sol Invictus Cult"
cult.045.desc:0 "For generations, the grand tales of the Roman emperors and their celestial patrons have faded into legend, whispers in crumbling ruins and forgotten texts. Yet, amidst these ancient fragments, my scholars have unearthed a recurring symbol the radiant visage of Sol, the Unconquered Sun. This was not merely a god amongst many, but the divine companion of emperors, the very essence of victory, light, and enduring power.\n\nThe knowledge required to rekindle his sacred fire is immense, scattered across lost provinces and buried beneath centuries of dust.\n\nBut I feel its pull a calling to restore this ancient patron, to bring his unifying light back to a world that has strayed far from his influence. To undertake this task is to embrace a destiny of order and might, to reforge a spiritual bedrock for an empire, or indeed, for any realm seeking true invincibility. It will demand immense personal sacrifice, vast resources, and a will as unyielding as the sun itself. Yet, the promise of his eternal favour... it is alluring beyond measure."
cult.045.a:0 "Solis Invicti!"

cult.031.t:0 "Restoration Serapis Cult"
cult.031.desc:0 "Even through the mists of time, where the gods of old seem but echoes, persistent whispers speak of a deity whose wisdom encompassed life and death, and whose bounty promised sustenance for all. This is Serapis, the lord of the fertile soil and the benevolent guide of souls through the underworld. His temples, once bustling centres of healing and prophecy, now lie silent, their sacred knowledge fragmented, passed down only through obscure lore.\n\nMy advisors speak of ancient scrolls unearthed, or perhaps a vision granted during a period of deep contemplation, hinting at the profound rituals required to reawaken his grace. The path to his restoration promises not only bountiful harvests and freedom from pestilence for my lands, but also solace for the weary and insight into the mysteries of existence.\n\nIt is a long and arduous journey, demanding dedication, substantial resources, and an understanding that transcends mere mortal concerns. But the thought of his benevolent hand guiding my realm towards unparalleled prosperity and well-being... it is a future worth striving for."
cult.031.a:0 "Restore the cult"

cult.046.t:0 "Restoration Eleusinian Cult"
cult.046.desc:0 "From the depths of ancient lore and the forgotten wisdom of the earth, whispers surface of the Eleusinian Mysteries. This was once a sacred path, illuminated by Demeter and Persephone, promising not just abundant harvests for the living, but also solace and hope for the souls journey beyond this mortal coil. Its grand rites, once held annually in hallowed Eleusis, have been lost to the ages, their profound secrets concealed by time and the silence of crumbling temples.\n\nMy most dedicated scholars speak of obscure references in philosophical texts, or perhaps the rediscovery of a hidden chamber beneath ancient ruins, hinting at the profound knowledge required to re-establish these Mysteries. To undertake this restoration is to delve into the very essence of existence, to reconnect my realm with the primal forces of life, death, and renewal. It will demand immense scholarly effort, spiritual purity, significant resources, and a reverence for the cycles that govern all things. Yet, the promise of fertile lands, inner peace, and a clearer vision of what lies beyond... it calls with a quiet, yet powerful, certainty."
cult.046.a:0 "Praise Demeter"

cult.033.t:0 "Restoration Bacchus Cult"
cult.033.desc:0 "Even in the long shadows cast by forgotten eras, whispers persist of a primal force, a deity whose ecstatic rites transcended the boundaries of civilization and unleashed the wild spirit within. This is Bacchus, the god of wine, frenzy, and liberation, whose mysterious followers, the Bacchanals, once roamed the night, shedding the shackles of mundane life. Their rites, once a hidden undercurrent in the heart of empires, were driven underground by fear and societal condemnation, their knowledge splintered into dangerous fragments.\n\nMy curiosity has been piqued by strange findings ancient tablets describing delirious dances and secret oaths, or perhaps a clandestine meeting with a shadowy figure claiming lineage to forgotten Dionysian traditions. The path to reawakening this ancient revelry is fraught with peril. It promises liberation and potent insight into the untamed aspects of existence, but at the cost of societal disapproval, moral decay, and the very real threat of scandal. It demands a spirit bold enough to embrace chaos, and resources to fund what many would deem utter madness. Yet, the allure of such untamed power, the shedding of inhibitions... it holds a dangerous fascination."
cult.033.a:0 "Freedom!"

cult.034.t:0 "Restoration Imperial Cult"
cult.034.desc:0 "Though the sun of Rome may have set in the West centuries ago, and its Christian flame burns on in the East, the profound truth of its ancient power lingers in the annals of history the mightiest realms were bound not just by laws and legions, but by the divine aura of their rulers. The Pagan Imperial Cult, that sacred tradition of venerating the 'genius' or the very person of the Emperor, was the spiritual bedrock upon which the vast Roman world once stood united. Its grand temples and solemn rites, once the beating heart of loyalty and civic order, have crumbled or been repurposed, their original pagan purpose forgotten by all but the most dedicated antiquarians.\n\nMy most esteemed advisors, after arduous study of unearthed decrees and and monumental inscriptions, have deciphered the hidden mechanisms of this ancient system. This undertaking, however, is monumental. It demands unprecedented wealth, unwavering Piety, and a soul prepared to ascend to a station beyond mortal men. It will reshape the very fabric of my realm, binding all subjects in sacred loyalty, yet offering the promise of an unshakeable dominion and an eternal legacy, echoing the true power of ancient Rome."
cult.034.a:0 "Ave Augustus"

cult.042.close:0 "Close"


cult.047.t:0 "The New Vestalis Maxima"
cult.047.desc:0 "After the death of the last Vestalis Maxima, a new vestalis maxima has been chosen by the vestal virgins. Hopefully she will stay in office for a long time and keep the sacred flame burning."
cult.047.a:0 "Praise Vesta!"


cult.053.t:0 "The New Hierophant of Isis"
cult.053.desc:0 "The previous Hierophant of Isis has journeyed to the afterlife, but the Great Mother's work is eternal. From among the most devout priestesses, a new leader has been chosen to interpret her will and guide her followers. May she be a worthy successor, blessed with wisdom and magic."
cult.053.a:0 "May Isis guide her hand."


cult.054.t:0 "The New Hierophant of Serapis"
cult.054.desc:0 "The guiding hand of the last Hierophant of Serapis has fallen still. From the ranks of the faithful, a new leader has been chosen to oversee the rites of the benevolent god of the afterlife and abundance. May he ensure our prosperity in this life and the next."
cult.054.a:0 "Praise be to Serapis!"


cult.055.t:0 "The New Hierophant of Sol Invictus"
cult.055.desc:0 "The light of the previous Hierophant has been extinguished, but the Unconquered Sun never sets. A new leader, strong and resolute, has been chosen to carry the solar flame. May his leadership be as radiant and unwavering as the sun itself."
cult.055.a:0 "The Sun is Unconquered!"


cult.056.t:0 "The New Hierophant of Eleusis"
cult.056.desc:0 "The keeper of the Mysteries has passed into the great mystery itself. A new Hierophant has been selected to lead the sacred rites of Demeter and Persephone, to guide new initiates, and to preserve the sacred hope of a blissful afterlife. May she guard the secrets well."
cult.056.a:0 "The cycle of life continues."


cult.057.t:0 "The New Hierophant of Bacchus"
cult.057.desc:0 "The wild revels of the last Hierophant have ended. A new master of ceremonies has been chosen to lead the followers of Bacchus in their ecstatic worship. May his festivals be joyous and his wine ever-flowing, bringing liberation to all who follow him."
cult.057.a:0 "Let the revelry begin anew!"

cult.058.t:0 "The New Archigallus of Cybele"
cult.058.desc:0 "The primal cry of the last Archigallus has faded. A new high priest has been chosen to lead the frenzied worship of the Great Mother, Cybele. May his devotion be as fierce as the lions that pull her chariot, and may he bring vitality to the land."
cult.058.a:0 "The Great Mother provides!"


cult.059.t:0 "The New Pater of Mithras"
cult.059.desc:0 "The Father of our Mithraeum has completed his final trial. From among the most worthy Heliodromi, a new Pater has been chosen to lead our brotherhood. May he guide us with the strength and discipline of Mithras himself, and may our bonds remain unbreakable."
cult.059.a:0 "For Mithras, the Unconquered Guide!"

cult.060.t:0 "The New Augustalis"
cult.060.desc:0 "The previous Augustalis, who upheld the divine authority of the Emperor, has passed from this world. A new priest has been chosen to lead the Imperial Cult, to ensure the 'Genius' of the ruler is venerated and the stability of the realm is secured through divine mandate. May he serve the empire with unwavering loyalty."
cult.060.a:0 "For the glory of the Empire!"

cult.061.t:0 "The Cave of Whispers"
cult.061.desc:0 "While surveying a remote part of my domain, my men stumbled upon a hidden cave. The entrance, obscured by overgrown vines, revealed a narrow passage descending into the earth. Inside, they found not a simple cavern, but a perfectly preserved Mithraeum, untouched for centuries.\n\nThe air is still and heavy with the scent of ancient incense. A magnificent Tauroctony dominates the far wall, its colors still vibrant. This place feels holy, a direct link to the earliest days of our brotherhood. I feel a pull to study its secrets, to understand the wisdom left behind by our ancestors."
cult.061.a:0 "I will personally investigate this sacred place."
cult.061.b:0 "Seal the entrance. Some secrets should remain buried."

cult.062.t:0 "The Heart of the Mithraeum"
cult.062.desc:0 "Days spent in the silent dark of the ancient Mithraeum have yielded a profound discovery. Behind a false wall in the altar, I found a small, lead-lined chest. Inside, resting on faded silk, is not gold or jewels, but a series of clay tablets inscribed with astronomical charts and philosophical texts that deepen the mysteries of Mithras beyond anything I have ever known.\n\nHowever, the chest itself is heavy... far too heavy. Prying open the lead lining reveals a hidden compartment filled with ancient gold coins, a treasure of immense value. The tablets are a gift to the spirit, the gold a temptation for the flesh. What is the true treasure of this sacred place?"
cult.062.a:0 "The wisdom is the true treasure. The gold will fund a new temple."
cult.062.b:0 "Mithras rewards the strong. The gold is mine."

cult.063.t:0 "Drums in the Woods"
cult.063.desc:0 "A frantic, rhythmic drumming echoes from the woods tonight, a sound that stirs something primal in my soul. My scouts report a wild gathering not far from the castle — men and women dancing with abandon around a great bonfire, their faces painted, their cries lost in the cacophony of drums and flutes.\n\nThey are followers of the Great Mother, Cybele, lost in one of her ecstatic rites. The energy is both terrifying and alluring. This is the raw, untamed power I pledged to understand."
cult.063.a:0 "Join them! Let the Great Mother's spirit take me!"
cult.063.b:0 "I will watch from a safe distance."
cult.063.c:0 "This is chaos! Disperse them immediately!"

cybele_ecstatic_revelry:0 "Ecstatic Revelry"
cybele_ecstatic_revelry_desc:0 "This character has recently participated in a wild, ecstatic ritual in honor of the Great Mother, feeling the primal energy of nature flow through them."

eleusinian_vision:0 "Eleusinian Vision"
eleusinian_vision_desc:0 "This character has had a profound vision related to the Eleusinian Mysteries, granting them a sense of peace about the afterlife."

bacchus_divine_madness:0 "Divine Madness"
bacchus_divine_madness_desc:0 "This character has recently indulged in a divinely inspired revelry, feeling the liberating joy of Bacchus."

serapis_ferryman_token:0 "Ferryman's Token"
serapis_ferryman_token_desc:0 "This character possesses what they believe to be a token from Serapis, easing their fears of the afterlife."

isis_whispering_reed:0 "Whispering Reed"
isis_whispering_reed_desc:0 "This character has been gifted a sacred reed from a priestess of Isis, which seems to whisper ancient secrets, sharpening their mind."

cult.064.t:0 "The Eleusinian Dream"
cult.064.desc:0 "I dreamt last night of a field of asphodel under a sky with two suns. A veiled woman, who I knew to be Persephone, offered me a single pomegranate seed. 'Eat, and know what is to come,' she whispered. The dream was so vivid, so real, that I awoke with the taste of the seed still on my tongue.\n\nI feel as though I have glimpsed a truth that lies beyond the veil of this world. The Mysteries are not just rituals; they are a doorway."
cult.064.a:0 "I have seen a glimpse of the afterlife."
cult.064.b:0 "It was only a dream."

cult.065.t:0 "The Unexpected Vintage"
cult.065.desc:0 "A traveling merchant has arrived at court with a truly remarkable vintage of wine. He claims it was made from grapes grown on a mountainside where a follower of Bacchus had a vision. The wine is said to induce a state of joyful madness and clarity.\n\n'A single cup,' the merchant says with a sly grin, 'and you will dance with the god himself.' The temptation is strong, but the stories of the Bacchanalia are a warning as much as an invitation."
cult.065.a:0 "Pour me a cup! Tonight, I dance!"
cult.065.b:0 "Such indulgence is for lesser men."

cult.066.t:0 "The Ferryman's Coin"
cult.066.desc:0 "While walking by the river, I found a small, worn coin, unlike any in my treasury. On one side is the crowned head of Serapis, and on the other, the three-headed hound Cerberus. It feels cold to the touch, and holding it, I feel a strange sense of peace, as if the anxieties of this life are a distant shore.\n\nIt feels like a token, a promise from the god who guides souls that my own journey into the afterlife will be a tranquil one."
cult.066.a:0 "A comforting sign from the Great God."
cult.066.b:0 "It is just an old coin."

cult.067.t:0 "The Whispering Reed"
cult.067.desc:0 "A priestess of Isis has brought me a gift":" a single, hollow reed from the banks of a sacred river. 'Hold it to your ear,' she instructed, 'and the Mother will whisper her secrets to you.'\n\nDoing so, I hear not words, but a sound like the rustling of a thousand wings, the gentle lapping of water, and the sigh of the wind. It is a language older than words, a magic that calms my soul and sharpens my mind. I feel the goddess's protection around me."
cult.067.a:0 "I am blessed by her magic."
cult.067.b:0 "It is just the wind in a reed."

cult.035.t:0 ""
cult.035.desc:0 "For this religion there is no cult available"
cult.035.a:0 "Okay...."

cult.068.t:0 "The Call of the Vine"
cult.068.desc:0 "The wine flows freely tonight, and the music is a wild, intoxicating rhythm. I feel a strange pull, a desire to lose myself in the revelry, to let go of all restraint. It is as if Bacchus himself is calling to me, inviting me to taste a deeper, more dangerous joy."
cult.068.a:0 "Indulge further."
cult.068.b:0 "Withdraw from the revelry."

cult.069.t:0 "The Vision of Bacchus"
cult.069.desc:0 "As the world spins around me, I see him. Bacchus, crowned with ivy, his eyes filled with a terrifying, beautiful madness. He offers me a cup, not of wine, but of pure, liquid light. 'Drink,' he whispers, 'and see the world as it truly is: a chaotic, glorious dance.'"
cult.069.a:0 "Embrace the vision."
cult.069.b:0 "Dismiss it as a drunken dream."

bacchus_vision_cooldown:0 "Vision Cooldown"
bacchus_vision_cooldown_desc:0 "This character has recently sought a vision from Bacchus and must wait before doing so again."

bacchus_divine_insight:0 "Divine Insight"
bacchus_divine_insight_desc:0 "This character has received a profound insight from a vision of Bacchus, granting them a deeper understanding of the chaotic nature of the world."
