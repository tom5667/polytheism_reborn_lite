 rejected_to_join_vestal_vergins.001.desc:0 "Your suggestion for me to uproot my entire life and scurry off to the temple of Vesta is ludicrous. I am happy where I am, and I have no plans to change that."

  accepted_to_join_vestal_vergins.001.desc:0 "I will answer the call to serve a higher power, and I thank you for setting me on this path of righteousness."
  accepted_to_join_vestal_vergins.001.a:0 "I am sure you will serve Mother Vesta well!"


  cdr_otv.001.t:0 "Temple of Vesta opened"
  cdr_otv.001.desc:0 "After centuries of closure the temple of vesta is open again, the flame is burning and the new vestal virgins are doing everything they can to keep the flame burning."
  cdr_otv.001.a:0 "Finally the eternal flame burns again"

  saturnalia.001.t:0 "Saturnalia"
  saturnalia.001.desc:0 "The 17th of December has finally arrived, marking the closure of businesses and the completion of the year's harvest. Today, we honor Saturn and express our gratitude to the gods for the bountiful harvest. Following the sacred rituals, we exchange gifts with one another and immerse ourselves in joyous festivities."
  saturnalia.001.a:0 "Gather the realm for Saturnalia"

  cult.001.t:0 "Cults"
  cult.001.desc:0 "In Roman times there where many cults and with the reestablishment of the [ROOT.Char.GetFaith.GetAdjective] Those cults also flourished again.\nThe question is do I want to be part of one the cults ?"
  cult.001.mithras:0 "Mithras Cult"
  cult.001.isis:0 "Isis Cult"
  cult.001.serapis:0 "Serapis Cult"
  cult.001.eluesinian:0 "Eluesinian Cult"
  cult.001.sol_invictus:0 "Sol Invictus cult"
  cult.001.imperial:0 "Imperial cult"
  cult.001.cybele:0 "Cybele cult"
  cult.001.optout:0 "Maybe now isn't the right time"

  #Join Mithras cult 
  cult.002.t:0 "The Application"
  cult.002.desc:0 "After reading how to get in contact with the cult I wrote a letter on why I would be a valueble asset to the cult\nAfter that I left the letter in the secret place by the well. Now I need to wait a few day's before I get an answer."
  cult.002.a:0 "Let's wait and hope for the best"

  cult.003.t:0 "The Answer"
  cult.003.desc:0 "Some days later I returned to the place where I left the letter, between the stones sad a small letter with a text and\na location on where I will meet with them for the initiation into the cult."
  cult.003.a:0 "Go to the meeting place"

  cult.004.t:0 "The Hidden Location"
  cult.004.desc:0 "Welcome welcome, so you are the one who send the application, great. Mithras god of war is beloved by the soldiers and many of them are part of this cult\nWe you too made some name for yourself so we are happy to say we can start the initiation."
  cult_0004.a.tt:0 "Historical context, the real initiation has not been preserved so it's a bit guessing and pure fiction./nWhat is known that it was a initiation proces of 7 the names of them are known so I will build on that."
  cult.004.a:0 "Start the initiation"

  cult.005.t:0 "The Initiation"
  cult.005.desc:0 "We stand before the statue of Mithras, after following the 1st degree of initiations now take this knife and make a cut in your hand. After that let some drops of blood fall on the plate\n and say the following words, I swear I will always follow the ways of mithras and will never betray my brothers and sisters. A few moments later it's all done.\n\nYou're now part of the cult you start at the beginning as Corax."
  cult.005.trait:0 "Finaly I'm part of the Mithras cult"
  cult.005.religion:0 "Finaly I'm part of the Mithras cult"
 
  #Standard decline answer 
  cult.006.t:0 "The Answer"
  cult.006.desc:0 "Some days later I returned to the place where I left the letter, between the stones sad a small letter with a text.\nWe have to decline the application you're not yet worthy of joining our cult."
  cult.006.a:0 "It's a shame"

  #Isis cult
  cult.007.t:0 "The Dream"
  cult.007.desc:0 "I had the strangest dream last night. It felt so real, like a message. Whispers of a powerful goddess, Isis, reached me on the wind. The dream urged me to travel to Tithorea in Greece, to find her temple. It feels like more than just a dream; it feels like a calling."
  cult.007.a:0 "Follow the Whispers"

  cult.008.t:0 "Arriving At Tithorea"
  cult.008.desc:0 "The journey to Tithorea was long, but the dream's pull was undeniable.\n\nFinally, I stand before the Temple of Isis. It's weathered and ancient, holding secrets I can almost feel in the air. A sense of anticipation, and maybe a little fear, grips me as I approach the entrance."
  cult.008.a:0 "Enter the temple"

  cult.009.t:0 "Temple Of Isis"
  cult.009.desc:0 "Inside, the air is thick with incense and the murmur of unseen worshippers. A priestess, her eyes deep and knowing, greets me. She seems to have been expecting me. 'The Mother has called you,' she says, her voice a silken whisper. 'Are you ready to embrace her mysteries?' A shiver runs down my spine. This is far beyond a simple pilgrimage; this is a true test."
  cult_009.a.tt:0 "Historical context, the real initiation has not been preserved, there are sources that say a initiation wasn't necessary.So it's a bit guessing and pure fiction."
  cult.009.a:0 "start the initiation"

  cult.010.t:0 "The Initiation"
  cult.010.desc:0 "Let's start the initiation, First we start with ritual purifications, in the meantime the priest asks for forgifness for my sins and sprinkels water on me./nAfter that I had to wait 10 days and abstraining from meat and wine, in the evening of the tenth day I got unspecified gifts from fellow devotees of Isis before donning a clean linen robe and entering the deepest part of the temple. After some rituals and swearing the following words\nI swear I will always follow the ways of Isis and will never betray my brothers and sisters.\nThe next day I left the temple and traveled back home."
  cult.010.trait:0 "Finaly I'm part of the Isis cult"
  cult.010.religion:0 "Finaly I'm part of the Isis cult"

  #Serapis Cult
  cult.011.t:0 "Preparations"
  cult.011.desc:0 "For weeks, my sleep has been plagued by the same vision. A majestic, bearded figure, a grain-measure resting on his head like a crown, sits enthroned. At his feet lies the monstrous three-headed hound, Cerberus. He does not speak, but his gaze is heavy with unspoken meaning, a mix of promise and warning. He shows me fleeting images":" fields of golden wheat, a ship laden with grain, and a peaceful journey into a sunlit afterlife. The dream leaves me feeling both hopeful and deeply unsettled. I must understand its meaning."
  cult.011.a:0 "I will seek an interpreter of dreams."

  cult.012.t:0 "The Seeker's Path"
  cult.012.desc:0 "The dream interpreter, a wise old mystic, listened intently. 'This is no mere dream,' she whispered, her eyes wide. 'It is a summons from the Great Serapis. He is a guide for souls and a bringer of plenty. He calls you to his temple, not one of grand stone, but a hidden place of quiet devotion. The path is not on any map; you must let the memory of your dream guide you.' Following this cryptic advice, I set out, my heart a mix of trepidation and purpose."
  cult.012.a:0 "My journey begins."

  cult.013.t:0 "The Serapeum"
  cult.013.desc:0 "After what felt like an eternity, I found it. Tucked away in a secluded valley, a modest temple stood, its entrance flanked by statues matching the figures from my dream. A priest, his face serene, greeted me as if I were an old friend. 'The dream has led you true,' he said. 'Serapis has chosen you. He offers a life of abundance and a tranquil afterlife, but initiation demands a test of faith. You must spend a night in the incubation chamber, to dream once more and receive his final blessing. Are you prepared?'"
  cult.013.a.tt:0 "Historical context, the real initiation has not been preserved so it's a bit guessing and pure fiction."
  cult.013.a:0 "I will face the dream."

  cult.014.t:0 "The Initiation"
  cult.014.desc:0 "I was led to a small, dark chamber and left alone. As I drifted to sleep, the dream returned, clearer than ever. Serapis smiled, and the hound at his feet seemed to nod in approval. I awoke to the priest standing over me. 'You have been accepted,' he declared. I was then led to the inner sanctum, where I was anointed with oils and shared a meal of bread and wine with the other devotees. I swore an oath of secrecy and brotherhood. The priest placed a hand on my shoulder. 'Welcome, child of Serapis. May your life be as bountiful as the Nile.'"
  cult.014.trait:0 "I am reborn in the eyes of Serapis!"



  #Eluesinian mysteries 
  cult.015.t:0 "A Glimmer of Hope"
  cult.015.desc:0 "Lately, my thoughts have been consumed by the grim finality of death. The tales of the shadowy, joyless underworld offer no comfort. In my search for solace, I have heard whispers of the Eleusinian Mysteries, a sacred cult dedicated to Demeter and Persephone. They say that for initiates, the afterlife is not a place of gloom, but one of blissful reunion. The path to this understanding begins with a pilgrimage to the holy site of Eleusis. I must know more."
  cult.015.a:0 "I will make the journey to Eleusis."

  cult.016.t:0 "The Sacred Way"
  cult.016.desc:0 "I arrive in Eleusis to find a procession underway. A priestess, a Hierophant, notices my searching gaze. 'You seek to understand the cycle of life and death, do you not? You seek the hope that Demeter grants to her children. The path of the initiate is one of purification and revelation. You must first be cleansed and taught the Lesser Mysteries, preparing your soul for the great truth that awaits. Are you ready to take the first step?'"
  cult.016.a:0 "I am. Guide me."

  cult.017.t:0 "The Kykeon"
  cult.017.desc:0 "After days of fasting and ritual cleansing, the Hierophant leads me to the entrance of the Telesterion, the great initiation hall. 'You have been purified,' she intones. 'Now, you must drink the 'italic kykeon'!, the sacred brew that parts the veil between our world and the divine. It will open your mind to what must be seen. Do not be afraid. Demeter's light will guide you through the darkness.' She offers me a simple earthenware cup containing a grainy, mint-scented mixture."
  cult_017.a.tt:0 "Historical context, the real initiation has not been preserved so it's a bit guessing and pure fiction."
  cult.017.a:0 "I drink without hesitation."

  cult.018.t:0 "The Vision"
  cult.018.desc:0 "The world dissolves into a whirlwind of light and shadow. I witness the sorrow of a mother's loss, the descent into the darkness of the underworld, and the glorious, vibrant rebirth of spring. I see Persephone, crowned with asphodel, and Demeter, her face radiant with joy. The vision is overwhelming, a profound truth that words cannot capture. When I return to my senses, the Hierophant is smiling. 'You have seen. You are one of us now. Carry this hope in your heart, for you no longer need to fear the final journey.'"
  cult.018.trait:0 "I have seen the truth of the Mysteries."

  #Sol invictus cult
 cult.019.t:0 "The Weight of a Crown"
  cult.019.desc:0 "My realm is a tapestry of dissent and chaos. Vassals scheme in the shadows, and the loyalty of my subjects feels as fleeting as a summer breeze. In search of a solution, I have buried myself in the histories of the great emperors. I have just finished reading an account of Aurelian, 'Restorer of the World.' He faced an empire on the brink of collapse and, through sheer will, brought it back to glory. The chronicler notes that a key to his success was the establishment of the cult of Sol Invictus, the Unconquered Sun, as a divine anchor for the state. An idea takes root in my mind":" perhaps this is the unifying light my own realm needs."
  cult.019.a:0 "I must find the inheritors of this Unconquered Sun."

  cult.020.t:0 "The Fading Embers"
  cult.020.desc:0 "My search for the followers of Sol Invictus has been arduous. The cult, once the heart of an empire, has faded into obscurity. After many dead ends, my agents finally located a small, secluded community that still honors the Unconquered Sun. They are led by a man who calls himself the Hierophant, a former soldier who claims his lineage traces back to the priests of Aurelian. He has agreed to meet me, but his message was clear":" 'Only those who truly understand the burden of rule are worthy of Sol's light.'"
  cult.020.a:0 "I will meet this Hierophant."

  cult.021.t:0 "The Radiance of Power"
  cult.021.desc:0 "The Hierophant is a man forged from steel and sunlight, his eyes burning with an intense fire. 'You seek order in chaos, strength in division,' he states, not as a question, but as a fact. 'Sol Invictus is not a god of petty favors. He is the divine principle of order, the eternal victor, the soul of the Empire. To follow him is to embody his radiance, to become an unconquerable pillar for your people. The initiation is simple, yet profound":" you must swear an oath, not just of loyalty, but of purpose. To uphold order, to be a light against the darkness, and to recognize the divine fire within yourself as a reflection of the Sun.' He extends a hand, upon which rests a simple bronze medallion depicting a radiant sun."
  cult_021.a.tt:0 "Historical context, Couldn't find any info about an initiation so this event is fictional, if someone has some more info let me know on steam or discord."
  cult.021.trait:0 "I swear the oath. I will be Unconquered!"


  #Imperial cult 
  cult.022.t:0 "The Foundation of Power"
  cult.022.desc:0 "My authority feels fragile, my legacy uncertain. My vassals whisper in the shadows, and the common folk are fickle. I have been studying the annals of the Roman Empire, seeking the source of its enduring strength. It was not just legions and laws, but something deeper":" the Imperial Cult. By elevating the Emperor to a divine status, they forged a bond of absolute loyalty that held the vast empire together. Perhaps this is the key to securing my own dynasty's future."
  cult.022.a:0 "I must understand this divine mandate."

  cult.023.t:0 "The Augustales"
  cult.023.desc:0 "My inquiries lead me to a secluded college of priests, the Sodales Augustales. They have preserved the sacred rites of the Imperial Cult through the centuries. Their leader, a man of immense dignity, greets me. 'You seek to walk the path of the Divi, the deified emperors,' he says, his voice resonating with ancient authority. 'This is not a path of personal salvation, but of civic duty. It is to bind your soul to the fate of your realm, to become the living embodiment of its stability and glory. Are you prepared to bear such a weight?'"
  cult.023.a:0 "I am."

  cult.024.t:0 "The Divine Genius"
  cult.024.desc:0 "The priest leads me to a grand temple, its walls adorned with the images of deified emperors of old. 'To join the Imperial Cult is to acknowledge the divine spark within you, your 'italic Genius'!,' he proclaims. 'It is the spirit that guides your hand and protects your people. You must make an offering not to a distant god, but to the divine potential of your own rule and the memory of those who came before.' He gestures to a grand altar. 'Swear an oath to uphold the prosperity of your realm, and you will be one of us. Your rule will be sacred, your legacy, eternal.'"
  cult_024.a.tt:0 "Historical context, Couldn't find any info about an initiation so this event is fictional, if someone has some more info let me know on steam or discord."
  cult.024.trait:0 "My rule is divine. My legacy is secure."
  cult.024.religion:0 "My rule is divine. My legacy is secure."

  #Cybele Cult
  cult.050.t:0 "A Primal Calling"
  cult.050.desc:0 "My lands feel barren, my dynasty fragile. I feel a deep disquiet, a sense that the civilized gods have grown deaf to my prayers. Lately, when walking in the wild places of my domain, I hear it — a faint, rhythmic drumming on the wind, a sound that seems to rise from the very earth. It is a primal, powerful call that speaks of untamed nature, of life, death, and ferocious rebirth. Whispers among the peasantry speak of the Magna Mater, the Great Mother, whose power is as ancient and untamed as the mountains themselves."
  cult.050.a:0 "I must find the source of this sound."

  cult.051.t:0 "The Ecstatic Procession"
  cult.051.desc:0 "Drawn by the incessant drumming, I find a procession snaking through a dark forest. It is a wild, frenzied affair. Cymbals clash, flutes shriek, and devotees, their eyes wide with ecstasy, dance and whirl. At their head is a figure of imposing authority, an Archigallus, who carries a statue of a goddess crowned with towers. He sees me and approaches. 'You feel the call of the Great Mother, Cybele,' he says, his voice surprisingly calm amidst the chaos. 'She is the earth, the mountain, the lion. She offers boundless life, but demands total surrender. Her path is not for the faint of heart.'"
  cult.051.a:0 "I wish to understand this power."
  cult.051.b:0 "This is madness. I must leave."

  cult.052.t:0 "The Taurobolium"
  cult.052.desc:0 "The Archigallus leads me to a sacred pit. 'To be reborn in the eyes of the Magna Mater, you must be washed in the lifeblood of her sacred beast,' he explains. I am instructed to stand in the pit as a great bull is led onto a perforated platform above me. With a final prayer, the priests sacrifice the animal. Warm, crimson blood pours down, drenching me in a torrent of life and death. I emerge, gasping, feeling the raw power of the earth coursing through my veins."
  cult.052.a:0 "Bathe me in blood! I am reborn!"

  restore_altar.001.t:0 "The Senate"
  restore_altar.001.desc:0 "I take a deep breath when i stand before the senate doors. Inside a senate who is more devided than ever christians, polytheists who accept or not accept others beliefs and here i am with a proposition to bring back the altar of Victoria to the senate building."
  restore_altar.001.a:0 "Enter the senate"

  restore_altar.002.t:0 "The Senate"
  restore_altar.002.desc:0 "As expected the Christians werren't verry fond of the idea of bringing back the altar. It's a shame they are so against bringing back something what placed here by Emperor Augustus himself, so we could offer to the gods for wealthfare of the empire. It was even used to take oaths to the new emperors.\n\nAs the christians in the senate start to get engry, it's time to start the voting"
  restore_altar.002.a:0 "Start the voting"

  restore_altar.003.t:0 "The voting"
  restore_altar.003.desc:0 "Of course this is creating new problems but at the verry least they voted. As the where counted most of the senate was for the return of the altar. Some of the Christian senators were so angry they start running towards me with daggers, have to say didn't know those things where allowed here... "
  restore_altar.003.a:0 "Guards!!!"

