l_english:
 # College of Pontiffs (#76). Working texts; the final Roman texts follow at the end of the College work.
 pr_college_appoint_interaction:0 "Take as Priest of the College"
 pr_college_appoint_interaction_desc:0 "As Pontifex Maximus, take [recipient.GetShortUIName] as rex sacrorum, as one of the flamines maiores or, once the imperial cult is restored, as flamen Augustalis."
 pr_college_appoint_interaction_accept_tt:0 "[recipient.GetShortUIName|U] takes the chosen seat in the College of Pontiffs"
 pr_college_appoint_interaction_decline_toast:0 "Appointment to the College declined"
 pr_college_appoint_interaction_no_seat_tt:0 "Requires a free seat: rex sacrorum, a flamen maior or, once the imperial cult is restored, the flamen Augustalis"
 pr_college_appoint_option_rex:0 "Rex Sacrorum"
 pr_college_appoint_option_dialis:0 "Flamen Dialis"
 pr_college_appoint_option_martialis:0 "Flamen Martialis"
 pr_college_appoint_option_quirinalis:0 "Flamen Quirinalis"
 pr_college_appoint_option_landless_tt:0 "Only for someone who holds no land: the rex sacrorum may hold no political office"
 pr_college_appoint_option_rome_tt:0 "Only for someone without land, or whose highest title has its capital in Rome: the flamen Dialis may not leave Rome"
 pr_college_appoint_minor_interaction:0 "Take as Flamen Minor"
 pr_college_appoint_minor_interaction_desc:0 "As Pontifex Maximus, take [recipient.GetShortUIName] as one of the flamines minores. They belong to the College but do not vote."
 pr_college_appoint_minor_interaction_no_seat_tt:0 "Requires a free seat of a flamen minor"
 pr_college_appoint_option_carmentalis:0 "Flamen Carmentalis (Carmentis)"
 pr_college_appoint_option_cerialis:0 "Flamen Cerialis (Ceres)"
 pr_college_appoint_option_floralis:0 "Flamen Floralis (Flora)"
 pr_college_appoint_option_furrinalis:0 "Flamen Furrinalis (Furrina)"
 pr_college_appoint_option_pomonalis:0 "Flamen Pomonalis (Pomona)"
 pr_college_appoint_option_portunalis:0 "Flamen Portunalis (Portunus)"
 pr_college_appoint_option_volcanalis:0 "Flamen Volcanalis (Vulcan)"
 pr_college_appoint_option_volturnalis:0 "Flamen Volturnalis (Volturnus)"
 pr_college_appoint_option_falacer:0 "Flamen Falacer (Falacer)"
 pr_college_appoint_option_palatualis:0 "Flamen Palatualis (Palatua)"
 pr_college_appoint_option_augustalis:0 "Flamen Augustalis (the deified Augustus)"
 pr_college_appoint_option_imperial_tt:0 "Only for a member of the imperial cult"
 pr_college_nominate_interaction:0 "Nominate for the College of Pontiffs"
 pr_college_nominate_interaction_desc:0 "Put [recipient.GetShortUIName] forward as a candidate. When a pontifical seat falls empty, the College co-opts its own members and considers your nominee first."
 pr_college_nominate_interaction_accept_tt:0 "[recipient.GetShortUIName|U] is nominated for the next empty pontifical seat"
 pr_college_vacancy_toast:0 "A pontifical seat stands empty"
 pr_college_vacancy_toast_tt:0 "[pr_college_empty_seat.GetNameNoTier|U] has no holder. Within a year you can name a candidate with #V Nominate for the College of Pontiffs#! (right-click a man of the Roman faith, then Religion). Otherwise the College co-opts a member itself."
 pr_college_coopted_toast:0 "The College has co-opted a pontifex"
 pr_college_coopted_toast_tt:0 "A pontifical seat stood empty for a year, so the College of Pontiffs chose a new member itself."
 pr_college_silent_members_header:0 "Members without a vote"
 pr_college_silent_members_tt:0 "The flamines minores, and once the imperial cult is restored the flamen Augustalis, belong to the College but do not vote and cannot become Pontifex Maximus. Click the arrow to show or hide them."
 pr_college_seat_slot_tt:0 "[Title.GetNameNoTooltip]: [SelectLocalization( Title.GetHolder.IsValid, 'pr_college_seat_slot_holder', 'pr_college_seat_slot_vacant' )]"
 pr_college_seat_slot_holder:0 "[Title.GetHolder.GetShortUIName]"
 pr_college_seat_slot_vacant:0 "Vacant"
 pr_college_seat_short_carmentalis:0 "Carmentalis"
 pr_college_seat_short_cerialis:0 "Cerialis"
 pr_college_seat_short_floralis:0 "Floralis"
 pr_college_seat_short_furrinalis:0 "Furrinalis"
 pr_college_seat_short_pomonalis:0 "Pomonalis"
 pr_college_seat_short_portunalis:0 "Portunalis"
 pr_college_seat_short_volcanalis:0 "Volcanalis"
 pr_college_seat_short_volturnalis:0 "Volturnalis"
 pr_college_seat_short_falacer:0 "Falacer"
 pr_college_seat_short_palatualis:0 "Palatualis"
 pr_college_seat_short_augustalis:0 "Augustalis"
