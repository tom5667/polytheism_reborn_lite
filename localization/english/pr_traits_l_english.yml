  trait_vestalis:0 "Vestal Virgin"
  trait_vestalis_desc:0 "A vestal virgin is a priestess of Vesta, the goddess of the hearth, home, and family in ancient Roman religion. The vestal virgins were responsible for maintaining the sacred fire in the Temple of Vesta and were considered to be the embodiment of the Roman state."  

  trait_bacchus_cult:0 "Bacchus cultist"
  trait_bacchus_cult_desc:0 "The cult of Bacchus was a mystery cult that worshiped the god Bacchus, the god of wine and fertility. The cult was known for its ecstatic rituals and its emphasis on the power of wine to bring about spiritual transformation."
  
  trait_hierophant_bacchus:0 "Hierophant of Bacchus"
  trait_hierophant_bacchus_desc:0 "The Hierophant of Bacchus is the leader of the cult of Bacchus, the god of wine and fertility. The Hierophant is responsible for leading the cult's rituals and ceremonies, and for interpreting the will of Bacchus."

