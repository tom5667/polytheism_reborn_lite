l_english:
 # CK3 1.21 pattern (vanilla stonehenge_01): name and description in building_type_<key>, the building
 # (<key>, <key>_desc) and its district (<key>_district, <key>_district_desc_flavor) point to them.
 building_type_oracle:0 "Oracle"
 building_type_oracle_desc:0 "Seek divine guidance and prophecy in this sacred place, revered by Romans and Greeks alike. Here the gods are consulted on the decisions of life, on what is yet to come, and on their own will."
 oracle:0 "$building_type_oracle$"
 oracle_desc:0 "$building_type_oracle_desc$"
 oracle_district:0 "$building_type_oracle$"
 oracle_district_desc_flavor:0 "$building_type_oracle_desc$"

 building_type_temple_jupiter_capitoline:0 "Temple of Jupiter"
 building_type_temple_jupiter_capitoline_desc:0 "A temple to honour Jupiter, high god of the sky and thunder and protector of the Roman people."
